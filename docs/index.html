  // on every load, not something that has to be discovered inside a card.
  // Its own popup (rendered below, alongside this header's other
  // elements) is also how the global "N" keyboard shortcut
  // (src/ui/shell.js) surfaces, since both open the same transient state
  // in src/ui/components/brain-dump.js. The currency picker sits here
  // too, alongside the period selector and theme toggle.
  const controls = el('div', { class: 'header-bar__controls' }, [
    renderBrainDumpButton({ requestRender }),
    renderPeriodSelector({ value: period, onChange: onPeriodChange, requestRender }),
    renderCurrencySelector({ state, dispatch, requestRender }),
    renderThemeToggle({ state, dispatch }),
  ]);

  const brainDumpPopup = renderBrainDumpPopup({ dispatch, requestRender });

  return el('header', { class: 'header-bar' }, [brand, controls, brainDumpPopup].filter(Boolean));
}


// ---- src/ui/router.js ----
// A tiny hash-based view router. The app used to be a single scrolling
// screen with an in-page anchor sidebar; at the user's explicit request
// it's now a real multi-view app — each sidebar item is a distinct
// destination with its own screen, not a scroll target.
//
// Deliberately hand-rolled (no framework, per docs/ARCHITECTURE.md §2):
// the whole contract is "read a view id from location.hash" +
// "set location.hash" + "re-render on hashchange". The application STATE
// (the store, localStorage) is completely independent of the hash —
// switching views, refreshing, and Back/Forward never touch data.

// The known views. Order here is only used as a fallback; the sidebar
// (src/ui/components/sidebar.js) owns the displayed grouping/order.
const APP_VIEWS = ['dashboard', 'income', 'expenses', 'bills', 'debts', 'goals', 'categories', 'settings'];
const DEFAULT_VIEW = 'dashboard';
// Friendly aliases so an old/typed hash still lands somewhere sensible.
// `budget` -> `goals`: the Budget tab was reworked into a Goals tab, so
// an old `#budget` bookmark still resolves.
const VIEW_ALIASES = { '': 'dashboard', index: 'dashboard', home: 'dashboard', overview: 'dashboard', budget: 'goals' };

/**
 * The view the current URL asks for. Tolerates `#expenses`, `#/expenses`,
 * `#EXPENSES`, an alias, or nothing — anything unrecognized falls back to
 * the Dashboard rather than showing a blank screen.
 * @returns {string} one of APP_VIEWS
 */
function getCurrentView() {
  if (typeof location === 'undefined') return DEFAULT_VIEW;
  const raw = (location.hash || '').replace(/^#\/?/, '').trim().toLowerCase();
  if (APP_VIEWS.includes(raw)) return raw;
  if (raw in VIEW_ALIASES) return VIEW_ALIASES[raw];
  return DEFAULT_VIEW;
}

/**
 * Navigate to a view by setting the URL hash — which fires a `hashchange`
 * event that `initViewRouter`'s listener turns into a re-render. Browser
 * Back/Forward therefore work for free.
 * @param {string} viewId
 * @returns {boolean} true if the hash actually changed (a `hashchange`
 *   will follow); false if it was already on that view (caller may still
 *   want to re-render, e.g. to close the mobile drawer).
 */
function navigateToView(viewId) {
  if (typeof location === 'undefined') return false;
  const target = APP_VIEWS.includes(viewId) ? viewId : DEFAULT_VIEW;
  if (getCurrentView() === target) return false;
  location.hash = target;
  return true;
}

/**
 * Register the one `hashchange` listener. Called once from
 * `src/ui/shell.js`'s `mountShell`.
 * @param {() => void} onChange
 */
function initViewRouter(onChange) {
  if (typeof window === 'undefined') return;
  window.addEventListener('hashchange', onChange);
}


// ---- src/ui/components/app-frame.js ----
// The persistent app shell shared by every view (src/ui/screens/*): the
// left sidebar + its mobile scrim, the top header bar, and an optional
// page title, wrapping whatever `body` the current view supplies. Only
// the `body` changes as you navigate — see src/ui/router.js.
//
// Every view screen calls this instead of building the sidebar/header
// itself, so navigation, the collapse toggle, the mobile drawer, and the
// global period selector are wired the same way everywhere in one place.


function focusSoon(selector) {
  if (typeof requestAnimationFrame === 'function' && typeof document !== 'undefined') {
    requestAnimationFrame(() => document.querySelector(selector)?.focus());
  }
}

/**
 * @param {object} options
 * @param {object} options.state
 * @param {Function} options.dispatch
 * @param {() => void} options.requestRender
 * @param {string} options.activeView current route id (drives the active sidebar item)
 * @param {string|Node} [options.title] page heading — omitted for the Dashboard's own greeting header
 * @param {string} [options.subtitle]
 * @param {Node} [options.titleAction] a control shown top-right of the
 *   page heading — the Income/Expenses/Bills/Debts views use it for their
 *   green "+ Add" button.
 * @param {Node} options.body the view's content
 * @returns {HTMLElement}
 */
function renderAppFrame({ state, dispatch, requestRender, activeView, title, subtitle, titleAction, body }) {
  const sidebar = renderSidebar({
    state,
    dispatch,
    requestRender,
    activeView,
    onToggleCollapse: () => {
      setSidebarCollapsed(!isSidebarCollapsed());
      requestRender?.();
      focusSoon('.sidebar__toggle');
    },
    onNavigate: (viewId) => {
      const wasDrawerOpen = isSidebarDrawerOpen();
      setSidebarDrawerOpen(false);
      // Setting the hash fires `hashchange`, which src/ui/shell.js turns
      // into a re-render (+ scroll to top). If we're already on that
      // view, no event fires — re-render here so the drawer still closes.
      const changed = navigateToView(viewId);
      if (!changed) requestRender?.();
      if (wasDrawerOpen) focusSoon('.header-bar__menu-btn');
    },
    onCloseDrawer: () => {
      setSidebarDrawerOpen(false);
      requestRender?.();
      focusSoon('.header-bar__menu-btn');
    },
  });

  const headerBar = renderHeaderBar({
    state,
    dispatch,
    period: getSelectedPeriod(),
    onPeriodChange: (next) => {
      setSelectedPeriod(next);
      requestRender?.();
    },
    // Hamburger — mobile only (CSS hides it at >=1024px, where the rail
    // is always visible).
    onOpenNav: () => {
      setSidebarDrawerOpen(true);
      requestRender?.();
      focusSoon('.sidebar__close');
    },
    requestRender,
  });

  const heading = title
    ? el('header', { class: 'view-header' }, [
        el('div', { class: 'view-header__main' }, [el('h1', {}, title), subtitle ? el('p', { class: 'view-header__subtitle' }, subtitle) : null].filter(Boolean)),
        titleAction || null,
      ].filter(Boolean))
    : null;

  return el('div', { class: 'screen screen--app' }, [
    sidebar.nav,
    sidebar.scrim,
    sidebar.editPopup,
    el('div', { class: 'app-view' }, [headerBar, heading, body].filter(Boolean)),
  ].filter(Boolean));
}


// ---- src/core/date.js ----
// Shared date/time utilities — the single implementation of "what day is
// it" logic. See docs/ARCHITECTURE.md §6 (`/core/date.js`) and
// docs/DATA-MODEL.md §2 ("conversion to local time/day boundaries happens
// only at render/derivation time, via the shared date utility ... never
// scattered ad hoc across modules").
//
// All "local day" logic here is deliberately based on the runtime's local
// timezone (the browser's), not UTC — a date-only value like a Task's
// `dueAt` of "2026-08-21" means the 21st in the user's own day, not in UTC.

/** @param {Date} [date] @returns {string} local date as "YYYY-MM-DD" */
function getLocalDateKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

/** @param {Date} [date] @returns {Date} local midnight of the given date */
function startOfLocalDay(date = new Date()) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

/** @param {Date} a @param {Date} b @returns {boolean} */
function isSameLocalDay(a, b) {
  return getLocalDateKey(a) === getLocalDateKey(b);
}

/**
 * Parses an ISO date or datetime string as a local-time Date, avoiding the
 * common footgun where `new Date("YYYY-MM-DD")` is parsed as UTC midnight
 * (which can land on the *previous* local day in negative-UTC-offset
 * timezones). Date-only strings are parsed as local; full datetime strings
 * are passed through to the native parser, which already treats them as
 * local time per the ES spec when no timezone offset is present.
 *
 * @param {string} isoString
 * @returns {Date}
 */
function parseLocalDate(isoString) {
  const dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoString);
  if (dateOnly) {
    const [, year, month, day] = dateOnly;
    return new Date(Number(year), Number(month) - 1, Number(day));
  }
  return new Date(isoString);
}

/** @param {string} isoString @param {Date} [now] @returns {boolean} */
function isToday(isoString, now = new Date()) {
  return isSameLocalDay(parseLocalDate(isoString), now);
}

/**
 * A date is "overdue" if its local day is strictly before today's local
 * day — a due date of today is not yet overdue.
 * @param {string} isoString @param {Date} [now] @returns {boolean}
 */
function isOverdue(isoString, now = new Date()) {
  const due = startOfLocalDay(parseLocalDate(isoString));
  const today = startOfLocalDay(now);
  return due.getTime() < today.getTime();
}

/** @param {Date} [date] @returns {'morning'|'afternoon'|'evening'} */
function getGreetingPeriod(date = new Date()) {
  const hour = date.getHours();
  if (hour < 12) return 'morning';
  if (hour < 17) return 'afternoon';
  return 'evening';
}

/** @param {Date} [date] @returns {string} e.g. "Friday, August 21, 2026" */
function formatFriendlyDate(date = new Date()) {
  return new Intl.DateTimeFormat(undefined, {
    weekday: 'long',
    month: 'long',
    day: 'numeric',
    year: 'numeric',
  }).format(date);
}

/**
 * A short "Mon 31 Aug" — weekday + day + short month, day-before-month
 * order. Used for the Safe-to-Spend hero's payday deadline. The locale is
 * pinned to `en-GB` so the order/punctuation is deterministic and matches
 * the intended format regardless of the browser's own locale (same
 * reasoning as `formatCents` pinning `en-US`).
 * @param {string|Date|null|undefined} dateOrKey a "YYYY-MM-DD" key or a Date
 * @returns {string|null} null if the input isn't a resolvable date
 */
function formatShortWeekdayDate(dateOrKey) {
  if (dateOrKey == null) return null;
  const date = typeof dateOrKey === 'string' ? parseLocalDate(dateOrKey) : dateOrKey;
  if (!(date instanceof Date) || Number.isNaN(date.getTime())) return null;
  return new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).format(date);
}

/**
 * A short, relative label for a recent timestamp — "just now", "2m ago",
 * "3h ago", "5d ago" — used by the Inbox section (src/ui/components/
 * inbox-section.js) for Brain Dump capture timestamps, which are always
 * recent by nature (a note sits in the Inbox until acted on, but it was
 * always *captured* moments ago). Falls back to `formatFriendlyDate` past
 * a week, where "12d ago" stops being a useful unit. Negative elapsed
 * time (clock skew) is clamped to "just now" rather than shown as
 * nonsensical negative minutes.
 * @param {string} isoTimestamp
 * @param {Date} [now]
 * @returns {string}
 */
function formatRelativeTime(isoTimestamp, now = new Date()) {
  const then = new Date(isoTimestamp);
  const diffSeconds = Math.max(0, Math.round((now.getTime() - then.getTime()) / 1000));
  if (diffSeconds < 60) return 'just now';
  const diffMinutes = Math.round(diffSeconds / 60);
  if (diffMinutes < 60) return `${diffMinutes}m ago`;
  const diffHours = Math.round(diffMinutes / 60);
  if (diffHours < 24) return `${diffHours}h ago`;
  const diffDays = Math.round(diffHours / 24);
  if (diffDays < 7) return `${diffDays}d ago`;
  return formatFriendlyDate(then);
}

/** @param {Date} date @param {number} n @returns {Date} `date` plus `n` local days */
function addDays(date, n) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
}

/**
 * `date` plus `n` calendar months, clamped to the last day of the target
 * month if the original day-of-month doesn't exist there (e.g. Jan 31 + 1
 * month -> Feb 28, not "March 3" from naive overflow).
 * @param {Date} date @param {number} n @returns {Date}
 */
function addMonths(date, n) {
  const targetMonth = date.getMonth() + n;
  const candidate = new Date(date.getFullYear(), targetMonth, date.getDate());
  const normalizedTargetMonth = ((targetMonth % 12) + 12) % 12;
  if (candidate.getMonth() !== normalizedTargetMonth) {
    return new Date(date.getFullYear(), targetMonth + 1, 0); // day 0 = last day of the intended month
  }
  return candidate;
}

/** @param {Date} from @param {Date} to @returns {number} whole local days from `from` to `to` (negative if `to` is earlier) */
function daysBetween(from, to) {
  const a = startOfLocalDay(from);
  const b = startOfLocalDay(to);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

/** @param {Date} date @returns {Date} local midnight of the 1st of `date`'s month */
function startOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

/** @param {Date} date @returns {Date} local midnight of the last day of `date`'s month */
function endOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth() + 1, 0); // day 0 = last day of the current month
}

/**
 * Monday of the calendar week containing `date` (ISO-style week start —
 * this app has no other week-start convention to be consistent with).
 * @param {Date} date @returns {Date} local midnight of that Monday
 */
function startOfWeek(date) {
  const day = date.getDay(); // 0 = Sunday ... 6 = Saturday
  const offsetFromMonday = day === 0 ? 6 : day - 1;
  return addDays(startOfLocalDay(date), -offsetFromMonday);
}

/**
 * `date` advanced by exactly one cycle of `frequency` — a single
 * unconditional step, unlike src/modules/safe-to-spend/recurrence.js's
 * `rollForwardRecurring` (which steps repeatedly until reaching "today").
 * Used where something needs "the next occurrence after this one," not
 * "the current occurrence as of now" — e.g. advancing a recurring
 * Income's `nextDate` the moment it's confirmed received (src/modules/
 * incomes/reducer.js). Lives here (not safe-to-spend/) since it's a
 * generic date-math primitive, not Safe-to-Spend-specific logic.
 * @param {Date} date
 * @param {'one-time'|'weekly'|'biweekly'|'monthly'} frequency
 * @returns {Date} `date` unchanged for 'one-time' or an unrecognized frequency
 */
function advanceByFrequency(date, frequency) {
  if (frequency === 'weekly') return addDays(date, 7);
  if (frequency === 'biweekly') return addDays(date, 14);
  if (frequency === 'monthly') return addMonths(date, 1);
  return date;
}


// ---- src/modules/safe-to-spend/recurrence.js ----
// Date-occurrence resolution for recurring/one-time Income and Bill
// records. See docs/SAFE-TO-SPEND.md for the full reasoning — income and
// bills are deliberately NOT treated symmetrically for a past one-time
// date: a past one-time income is presumed already received (excluded —
// it can't be a future payday), while a past one-time bill is presumed
// still owed if unpaid (included — overdue debt doesn't stop being debt).


const RECURRING_STEPPERS = {
  weekly: (d) => addDays(d, 7),
  biweekly: (d) => addDays(d, 14),
  monthly: (d) => addMonths(d, 1),
};

/** Rolls a recurring date forward to the first occurrence on/after `today`. */
function rollForwardRecurring(dateStr, frequency, today) {
  const stepper = RECURRING_STEPPERS[frequency];
  if (!stepper) return null;
  let date = parseLocalDate(dateStr);
  const todayKey = getLocalDateKey(today);
  let iterations = 0;
  // Guards against pathological input; a real recurring record should
  // never need more than a couple thousand steps (~38 years weekly) to
  // reach "today".
  while (getLocalDateKey(date) < todayKey && iterations < 2000) {
    date = stepper(date);
    iterations += 1;
  }
  return getLocalDateKey(date);
}

/**
 * When does this income next arrive, on or after `today`? A past
 * one-time income has no next occurrence (presumed already received —
 * see docs/SAFE-TO-SPEND.md "how recurring income is handled").
 * @param {string|null} dateStr YYYY-MM-DD
 * @param {'one-time'|'weekly'|'biweekly'|'monthly'} frequency
 * @param {Date} today
 * @returns {string|null} YYYY-MM-DD
 */
function getNextIncomeDate(dateStr, frequency, today) {
  if (!dateStr) return null;
  if (frequency === 'one-time' || !frequency) {
    const key = getLocalDateKey(parseLocalDate(dateStr));
    return key >= getLocalDateKey(today) ? key : null;
  }
  return rollForwardRecurring(dateStr, frequency, today);
}

/**
 * When is this bill currently due? A one-time bill keeps its own date
 * even if it's in the past (still owed if unpaid) — only recurring bills
 * roll forward to their current cycle.
 * @param {string|null} dateStr YYYY-MM-DD
 * @param {'one-time'|'weekly'|'monthly'} recurrence
 * @param {Date} today
 * @returns {string|null} YYYY-MM-DD
 */
function getCurrentBillDueDate(dateStr, recurrence, today) {
  if (!dateStr) return null;
  if (recurrence === 'one-time' || !recurrence) {
    return getLocalDateKey(parseLocalDate(dateStr));
  }
  return rollForwardRecurring(dateStr, recurrence, today);
}

/**
 * Every occurrence of a recurring (or one-time) income landing within
 * `[startKey, endKey]` (inclusive). Originally used for the dashboard's
 * period-scoped "money in" figure; **not currently called by anything** —
 * `getPeriodSummary` (src/modules/dashboard/index.js) switched to summing
 * real `IncomeReceipt` records instead, since a *projection* of scheduled
 * income read as "money in" when it was really "money about to arrive," a
 * real reported point of confusion. Kept, still fully tested
 * (tests/unit/safe-to-spend-recurrence.test.js), in case a distinct,
 * separately-labeled "projected/expected income" view is ever wanted
 * later — same "still a working, reusable primitive" precedent as
 * `categoryEmojiBadge` (src/ui/components/icons.js).
 *
 * Important limitation, inherent to the data model, not this function:
 * Income records aren't logged transaction history, only a forward-looking
 * schedule (`nextDate` + `frequency`) — there is nothing to roll
 * *backward*. This never returns a date before `today`, so a period
 * entirely in the past (e.g. "Last month") correctly yields `[]` rather
 * than a fabricated number. `endKey` is required (not optional) for the
 * same reason `getNextIncomeDate` never runs unbounded: an open-ended
 * range would mean "every future paycheck forever," which isn't a
 * meaningful sum — callers with no concrete end date should treat
 * "money in" as not applicable for that period rather than call this.
 *
 * @param {string|null} dateStr YYYY-MM-DD
 * @param {'one-time'|'weekly'|'biweekly'|'monthly'} frequency
 * @param {Date} today
 * @param {string|null} startKey YYYY-MM-DD, or null for "from today"
 * @param {string} endKey YYYY-MM-DD, required
 * @returns {string[]} occurrence dates, ascending
 */
function getIncomeOccurrencesInRange(dateStr, frequency, today, startKey, endKey) {
  if (!dateStr || endKey == null) return [];
  const todayKey = getLocalDateKey(today);
  const effectiveStart = startKey && startKey > todayKey ? startKey : todayKey; // never before today — see doc comment above
  if (effectiveStart > endKey) return [];

  if (frequency === 'one-time' || !frequency) {
    const key = getLocalDateKey(parseLocalDate(dateStr));
    return key >= effectiveStart && key <= endKey ? [key] : [];
  }

  const stepper = RECURRING_STEPPERS[frequency];
  if (!stepper) return [];

  let date = parseLocalDate(dateStr);
  let iterations = 0;
  // Same 2000-iteration guard as rollForwardRecurring, for the same reason.
  while (getLocalDateKey(date) < effectiveStart && iterations < 2000) {
    date = stepper(date);
    iterations += 1;
  }

  const occurrences = [];
  iterations = 0;
  while (getLocalDateKey(date) <= endKey && iterations < 2000) {
    occurrences.push(getLocalDateKey(date));
    date = stepper(date);
    iterations += 1;
  }
  return occurrences;
}


// ---- src/modules/safe-to-spend/calculation.js ----
// The Safe-to-Spend calculation. Pure function of (state, now) — no DOM,
// no side effects. See docs/SAFE-TO-SPEND.md for the full reasoning
// behind every decision here; this file implements that document, it
// doesn't redefine it. Money in, money out, all in integer cents (see
// src/core/money.js).


// Every collection read below is guarded with `Array.isArray(x) ? x : []`
// rather than the narrower `x ?? []` — a corrupted/hand-edited localStorage
// value can be *present but the wrong type* (an object, a string), not just
// missing, and `for...of` on a non-iterable throws. See Phase 8 QA
// (docs/QA-REPORT.md) — this function must never throw regardless of what
// shape a stored collection has degraded into.

/**
 * Sum of active, unpaid bills due on/before `horizonKey` (the next
 * payday), or all of them if `horizonKey` is null. **This IS a
 * subtracted term** — `upcomingBillsCents` is part of
 * `totalCommittedCents` / `safeToSpendCents` ("Bills still to land" in
 * the breakdown). Marking a bill paid removes it from this sum *and*
 * debits Current Balance by its amount (`src/modules/bills/
 * balance-effect.js`) — the amount just moves from "committed" to
 * "already gone from the balance", net zero on Safe-to-Spend. See
 * docs/SAFE-TO-SPEND.md §2/§7. (Whether unpaid bills are a committed
 * term has flip-flopped several times at the user's request — §2's
 * history note; the current state is "subtracted".)
 */
/**
 * Sum of every savings goal's "already put away" amount — protected,
 * committed money, subtracted from Safe-to-Spend (docs/SAFE-TO-SPEND.md
 * §3d). Note this is *not* the same treatment as
 * `budget.savingsAllocationCents` anymore — the flat Savings figure
 * became a display-only separate-account balance (§9); a goal's
 * `savedCents` is still a subtraction. Read here as raw `state.goals`
 * (same convention as every other collection in this file) rather than
 * importing src/modules/goals/, and guarded per-item against a corrupted
 * `savedCents`.
 */
function sumGoalsSaved(goals) {
  let totalCents = 0;
  for (const goal of Array.isArray(goals) ? goals : []) {
    if (!goal || !isValidAmountCents(goal.savedCents)) continue;
    totalCents += goal.savedCents;
  }
  return totalCents;
}

function sumUpcomingBills(bills, today, horizonKey) {
  let totalCents = 0;
  for (const bill of Array.isArray(bills) ? bills : []) {
    if (!bill || !bill.active || bill.paid) continue;
    if (!isValidAmountCents(bill.amountCents)) continue;
    if (!bill.dueDate) {
      totalCents += bill.amountCents; // no date at all — conservatively always counts
      continue;
    }
    const dueKey = getCurrentBillDueDate(bill.dueDate, bill.recurrence, today);
    if (dueKey == null) continue;
    if (horizonKey == null || dueKey <= horizonKey) totalCents += bill.amountCents;
  }
  return totalCents;
}

/** Sum of planned expenses due on/before `horizonKey` (undated ones always count — see docs/SAFE-TO-SPEND.md). */
function sumCommittedPlannedExpenses(plannedExpenses, horizonKey) {
  let totalCents = 0;
  for (const expense of Array.isArray(plannedExpenses) ? plannedExpenses : []) {
    if (!expense || !isValidAmountCents(expense.amountCents)) continue;
    if (!expense.plannedDate || horizonKey == null || expense.plannedDate <= horizonKey) {
      totalCents += expense.amountCents;
    }
  }
  return totalCents;
}

/** The earliest upcoming occurrence across all active income sources, or null if none. */
function findNextPaydayDate(incomes, today) {
  let earliest = null;
  for (const income of Array.isArray(incomes) ? incomes : []) {
    if (!income || !income.active) continue;
    const occurrence = getNextIncomeDate(income.nextDate, income.frequency, today);
    if (occurrence != null && (earliest == null || occurrence < earliest)) {
      earliest = occurrence;
    }
  }
  return earliest;
}

/**
 * Sum of active income landing exactly on `horizonKey` (i.e. the income(s)
 * that *are* the next payday). Purely informational, for display — see
 * docs/SAFE-TO-SPEND.md §3: this is never added to `safeToSpendCents`.
 */
function sumIncomeAtHorizon(incomes, today, horizonKey) {
  if (horizonKey == null) return 0;
  let totalCents = 0;
  for (const income of Array.isArray(incomes) ? incomes : []) {
    if (!income || !income.active) continue;
    if (!isValidAmountCents(income.amountCents)) continue;
    const occurrence = getNextIncomeDate(income.nextDate, income.frequency, today);
    if (occurrence === horizonKey) totalCents += income.amountCents;
  }
  return totalCents;
}

/**
 * @param {object} state
 * @param {{now?: Date}} [options]
 * @returns {{
 *   currentBalanceCents: number,
 *   upcomingIncomeCents: number,
 *   upcomingBillsCents: number, // SUBTRACTED — active, unpaid bills due on/before the next payday (see §2/§7)
 *   plannedExpensesCents: number,
 *   savingsAllocationCents: number, // display-only — a separate account balance; NOT subtracted (see §9)
 *   goalsSavedCents: number,
 *   netAfterCommittedCents: number, // currentBalance − totalCommitted; can be negative (see §10)
 *   safeToSpendCents: number, // netAfterCommittedCents floored at 0 — never negative (see §10)
 *   nextPaydayDate: string|null,
 *   daysUntilPayday: number|null,
 *   dailyAllowanceCents: number|null,
 *   isNegative: boolean, // true when netAfterCommittedCents < 0 (i.e. safeToSpendCents was floored)
 * }}
 */
function getSafeToSpend(state, { now = new Date() } = {}) {
  const budget = state?.budget ?? {};
  // A balance may legitimately be negative (docs/DATA-MODEL.md "Current
  // Balance model") — using the non-negative-only guard here would
  // silently zero out a real negative balance, corrupting the result.
  const currentBalanceCents = isValidBalanceCents(budget.currentBalanceCents) ? budget.currentBalanceCents : 0;
  const savingsAllocationCents = isValidAmountCents(budget.savingsAllocationCents) ? budget.savingsAllocationCents : 0;
  const goalsSavedCents = sumGoalsSaved(state?.goals);

  const nextPaydayDate = findNextPaydayDate(state?.incomes, now);
  const daysUntilPayday = nextPaydayDate != null ? daysBetween(now, parseLocalDate(nextPaydayDate)) : null;

  const upcomingBillsCents = sumUpcomingBills(state?.bills, now, nextPaydayDate);
  const plannedExpensesCents = sumCommittedPlannedExpenses(state?.plannedExpenses, nextPaydayDate);
  const upcomingIncomeCents = sumIncomeAtHorizon(state?.incomes, now, nextPaydayDate);

  // What's subtracted from Current Balance:
  //   - upcomingBillsCents: active, unpaid bills due on/before the next
  //     payday ("Bills still to land"). Marking one paid moves its amount
  //     out of here and into a Current Balance debit instead — net zero
  //     (§7).
  //   - plannedExpensesCents: known one-off future spends within the horizon.
  //   - goalsSavedCents: money earmarked to a savings goal — protected
  //     (docs/SAFE-TO-SPEND.md §3d).
  // NOT subtracted:
  //   - savingsAllocationCents: the Savings figure is a *separate account
  //     balance* the user tracks for reference, not money sitting inside
  //     Current Balance — subtracting it would misrepresent a $1,000
  //     checking balance as deeply negative just because $12,000 sits in a
  //     savings account. Moving money into savings is a real transfer
  //     (`budget/add-to-savings`, src/main.js) that debits Current Balance
  //     directly, the same as an Expense — so it reaches Safe-to-Spend
  //     that way, once. See §9.
  //   - upcoming income (§3): informational until it actually arrives.
  const totalCommittedCents = upcomingBillsCents + plannedExpensesCents + goalsSavedCents;
  // The raw position: what's left after everything committed. Can be
  // negative (commitments exceed the balance) — kept on the result so the
  // UI can say *by how much* the user is over-committed.
  const netAfterCommittedCents = currentBalanceCents - totalCommittedCents; // upcomingIncomeCents deliberately excluded (§3); upcomingBillsCents IS included (§2/§7)
  // Safe-to-Spend is floored at 0 — a negative "safe to spend" isn't a
  // spendable amount, and showing one read as broken. Over-commitment is
  // still surfaced, via `isNegative` + `netAfterCommittedCents` + the
  // wording.js message, not by a negative headline. See docs/SAFE-TO-SPEND.md §10.
  const safeToSpendCents = Math.max(0, netAfterCommittedCents);

  // Same-day payday (0 days) is treated as a 1-day window for the daily
  // rate rather than dividing by zero — see docs/SAFE-TO-SPEND.md.
  const dailyAllowanceCents =
    daysUntilPayday == null ? null : Math.round(safeToSpendCents / Math.max(daysUntilPayday, 1));

  return {
    currentBalanceCents,
    upcomingIncomeCents,
    upcomingBillsCents,
    plannedExpensesCents,
    savingsAllocationCents,
    goalsSavedCents,
    // The exact sum already used above to derive safeToSpendCents — the UI
    // needs this to show "how much is committed" (e.g. a progress bar), and
    // must never re-derive it itself (see docs/SAFE-TO-SPEND.md §11b and
    // CLAUDE.md — money arithmetic belongs in this module, not src/ui/).
    totalCommittedCents,
    netAfterCommittedCents,
    safeToSpendCents,
    nextPaydayDate,
    daysUntilPayday,
    dailyAllowanceCents,
    isNegative: netAfterCommittedCents < 0,
  };
}

/**
 * Convenience accessor matching docs/ARCHITECTURE.md's documented
 * `getSpendingAllowance(state)` interface — derived from the same
 * calculation, not recomputed separately.
 */
function getSpendingAllowance(state, options) {
  return getSafeToSpend(state, options).dailyAllowanceCents;
}


// ---- src/modules/safe-to-spend/wording.js ----
// Centralized product copy for Safe-to-Spend — defined once here so the
// wording rules (docs/PRODUCT.md §7 "no medical/diagnostic claims" and
// this phase's explicit financial-language requirements) aren't
// improvised ad hoc wherever the UI happens to display this number. See
// docs/SAFE-TO-SPEND.md "Language and framing".


// The headline label. Reworded from "Estimated safe to spend" to
// "Safe to spend today" at the user's request when the card moved to a
// payday-based framing — the "planning estimate, not a verified bank
// figure" caveat now lives in `getSafeToSpendSubtext` and
// `PLANNING_DISCLAIMER` below rather than the label itself
// (docs/SAFE-TO-SPEND.md §12).
const SAFE_TO_SPEND_LABEL = 'Safe to spend today';

const PLANNING_DISCLAIMER =
  "This is a planning estimate based on what you've entered — the app doesn't connect to or verify your bank accounts.";

/**
 * The line under the amount: "$X of your $Y balance has to last until
 * Mon 31 Aug". `$Y` is the raw current balance (never the
 * savings/goals-reduced figure — the user explicitly asked that the
 * balance shown here isn't itself netted down); `$X` is `safeToSpendCents`
 * (floored at 0 — see §10). Reads figures straight off the result — no
 * arithmetic here.
 * @param {ReturnType<typeof import('./calculation.js').getSafeToSpend>} result
 * @returns {string}
 */
function getSafeToSpendSubtext(result) {
  const spendable = formatCents(result.safeToSpendCents);
  const balance = formatCents(result.currentBalanceCents);
  const payday = formatShortWeekdayDate(result.nextPaydayDate);
  if (!payday) {
    return `${spendable} of your ${balance} balance — add an income date to see how long this needs to last`;
  }
  return `${spendable} of your ${balance} balance has to last until ${payday}`;
}

/**
 * Extra context copy for the negative/zero cases, where showing the raw
 * number alone risks reading as either a data error or (if ever clamped)
 * misleading positive guidance. Neutral, non-judgmental — states what's
 * true without blaming the user. Returns null for an ordinary positive
 * result, where the number speaks for itself.
 * @param {ReturnType<typeof import('./calculation.js').getSafeToSpend>} result
 * @returns {string|null}
 */
function getSafeToSpendMessage(result) {
  // `safeToSpendCents` is floored at 0 (§10); `netAfterCommittedCents`
  // carries the true position, so the overage amount is read from that.
  if (result.netAfterCommittedCents < 0) {
    const overBy = formatCents(Math.abs(result.netAfterCommittedCents));
    return `Your upcoming bills, planned expenses, and savings goals add up to ${overBy} more than your current balance. This isn't a spending amount — it's a sign to review what's committed.`;
  }
  if (result.safeToSpendCents === 0) {
    return "Nothing is safe to spend right now — your whole balance is already committed to upcoming bills, planned expenses, and savings goals.";
  }
  return null;
}

// An ordinary positive result gets no explanatory paragraph at all — the
// number, the subtext line, and the "How is this worked out?" breakdown
// carry the meaning (removed at the user's request). `getSafeToSpendMessage`
// still returns copy for the negative / exact-zero cases.


// ---- src/modules/safe-to-spend/index.js ----
// The Safe-to-Spend module's public interface. Pure, DOM-free calculation

// ---- src/ui/components/safe-to-spend-hero.js ----
// The hero card — the single most important thing on the dashboard
// (Phase 4 "primary objective": understand financial position in ~5
// seconds). Computes no money math of its own — every figure (the
// amount, the progress bar, the "How is this worked out?" rows) is read
// from what `getSafeToSpendBreakdown` (src/modules/dashboard/) returned,
// which is `getSafeToSpend`'s result plus a `period` block (see
// docs/SAFE-TO-SPEND.md §11b/§13). The "−"/"+" prefixes in the breakdown
// are labels, not arithmetic done here.


const row = (label, text, extraClass = '') =>
  el('div', { class: `hero__breakdown-row${extraClass ? ' ' + extraClass : ''}` }, [
    el('span', {}, label),
    el('span', { class: 'hero__breakdown-amount' }, text),
  ]);

/**
 * The collapsed "How is this worked out?" disclosure. Shows the EXACT
 * figures behind the headline and nothing else — a plain-language intro,
 * then the rows. There is no second calculation: every number is read
 * straight off what `getSafeToSpendBreakdown` returned:
 *
 *   In checking                          (period.inCheckingCents)
 *   + Arrived after that balance         (period.arrivedAfterBalanceCents)
 *   − Bills still to land                (result.upcomingBillsCents)
 *   − Paid and spent after that balance  (period.paidAndSpentAfterBalanceCents)
 *   − Already set aside                  (period.setAsideCents)
 *   ─────────────────────────────────
 *   Safe until payday                    (result.safeToSpendCents)
 *
 * By construction the rows reconcile to `netAfterCommittedCents` (then
 * floored to $0 → `safeToSpendCents`, §10) — see getSafeToSpendBreakdown's
 * doc in src/modules/dashboard/index.js. The "+"/"−" are labels, not
 * arithmetic done here (CLAUDE.md — money math stays in
 * src/modules/safe-to-spend/ + the dashboard composer).
 *
 * Over-committed (`isNegative`): the true negative total is shown as
 * "After everything" before the floored $0 headline.
 */
function renderBreakdown(result) {
  const p = result.period;
  const rows = [
    row('In checking', formatCents(p.inCheckingCents)),
    row('Arrived after that balance', `+ ${formatCents(p.arrivedAfterBalanceCents)}`),
    row('Bills still to land', `− ${formatCents(result.upcomingBillsCents)}`),
    row('Paid and spent after that balance', `− ${formatCents(p.paidAndSpentAfterBalanceCents)}`),
    row('Already set aside', `− ${formatCents(p.setAsideCents)}`),
  ];

  if (result.isNegative) {
    rows.push(row('After everything', formatCents(result.netAfterCommittedCents)));
    rows.push(row('Safe until payday (never below $0)', formatCents(result.safeToSpendCents), 'hero__breakdown-row--total'));
  } else {
    rows.push(row('Safe until payday', formatCents(result.safeToSpendCents), 'hero__breakdown-row--total'));
  }

  return el('details', { class: 'hero__breakdown' }, [
    el('summary', { class: 'hero__breakdown-summary' }, 'How is this worked out?'),
    el(
      'p',
      { class: 'hero__breakdown-intro' },
      "Your Safe to Spend is the money left after setting aside everything you've already spent, committed, or chosen to reserve.",
    ),
    el('div', { class: 'hero__breakdown-rows' }, rows),
  ]);
}

/** "$X committed of $Y available" — a different view of numbers the engine
 * already returns, not a new calculation (see docs/SAFE-TO-SPEND.md §11b). */
function renderCommittedProgress(result) {
  const available = result.currentBalanceCents;
  const committed = result.totalCommittedCents;
  const percent = available <= 0 ? (committed > 0 ? 100 : 0) : Math.min(Math.max((committed / available) * 100, 0), 100);
  const trackClass = result.isNegative ? 'hero__progress hero__progress--negative' : 'hero__progress';

  return el('div', { class: trackClass }, [
    el('div', { class: 'hero__progress-track' }, [el('div', { class: 'hero__progress-fill', style: `width: ${percent}%` })]),
    el('div', { class: 'hero__progress-labels' }, [
      el('span', {}, `${formatCents(committed)} committed`),
      el('span', {}, `of ${formatCents(available)} available`),
    ]),
  ]);
}

/**
 * @param {ReturnType<typeof import('../../modules/dashboard/index.js').getSafeToSpendBreakdown>} result
 *   `getSafeToSpend`'s result plus a `period` block. Pure display — the

  const amountClass = result.isNegative ? 'hero__amount hero__amount--negative' : 'hero__amount';

  return el('section', { class: 'card hero', 'aria-labelledby': 'safe-to-spend-heading' }, [

    el('h2', { class: 'hero__label', id: 'safe-to-spend-heading' }, SAFE_TO_SPEND_LABEL),
    el('p', { class: amountClass }, formatCents(result.safeToSpendCents)),

// A headline stat card — icon + label, a big value, and an optional
// "±X% ↑ from last month" delta chip or a plain supporting `note` line.
// Used on the Dashboard for Total Expenses / Total Savings / Total debt
// (beside the Safe-to-Spend hero), and — with a `note` — as the Debts

/**
 * @param {object} options
 * @param {string} options.icon
 * @param {string} options.label
 * @param {string} options.value already formatted (e.g. formatCents)
 * @param {string} [options.iconColor] overrides the tone-derived icon colour

 *   icon colour) instead of the default white surface — used for the
 *   per-tab summary cards on the Income / Expenses / Bills / Debts
 *   views. Default 'neutral' (the Dashboard's stat cards).
 */
function renderStatCard({ icon, label, value, iconColor = null, delta = null, note = null, tone = 'neutral' }) {
  const resolvedIconColor = iconColor || (tone === 'neutral' ? 'var(--color-accent)' : `var(--color-status-${tone}-text)`);
  const children = [
    el('div', { class: 'stat-card__head' }, [iconChip(icon, { color: resolvedIconColor, small: true }), el('span', { class: 'stat-card__label' }, label)]),
    el('p', { class: 'stat-card__value' }, value),
  ];

  if (delta && Number.isFinite(delta.pct)) {

    const chip = el('span', { class: `stat-card__delta stat-card__delta--${delta.isGood ? 'good' : 'bad'}` }, `${up ? '+' : ''}${delta.pct.toFixed(1)}% ${up ? '↑' : '↓'}`);
    children.push(el('p', { class: 'stat-card__delta-row' }, [chip, el('span', { class: 'stat-card__delta-note' }, 'from last month')]));

}

// A small, reusable empty-state message. See CLAUDE.md's product
// discipline notes — an empty state should say plainly what's true
// ("Nothing planned yet.") rather than leave a blank gap or overstate.


/** @param {string} message @returns {HTMLElement} */

}


// ---- src/ui/components/charts.js ----
// The dashboard's "Overview" chart — grouped columns comparing money in
// vs money out per month. Hand-authored SVG built as a string (the same
// technique as src/ui/components/icons.js — no chart library, nothing
// added to the zero-dependency / self-contained build). Interactivity is
// a native `<title>` per mark.
//
// Follows the data-viz method: two categorical series with an
// always-present legend (identity is never colour-alone), thin marks
// (<= 20px) with air left in each band, a 2px surface-colour gap between
// touching sub-bars, 4px rounded tops on a square baseline, three
// recessive hairline gridlines, text in text tokens (never the mark
// colour), a calm empty state.


const GRID = 'var(--color-border)';
const MUTED = 'var(--color-text-secondary)';

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/** A short money string for axis ticks: "$0", "$340", "$1.2k", "$18k", "$2.4M". */
function compactMoney(cents) {
  const sym = getCurrencySymbol(getActiveCurrency());
  const n = Math.round((Number.isFinite(cents) ? cents : 0) / 100);
  const abs = Math.abs(n);
  if (abs >= 1000000) return sym + (n / 1000000).toFixed(abs % 1000000 >= 100000 ? 1 : 0) + 'M';
  if (abs >= 1000) return sym + (n / 1000).toFixed(abs % 1000 >= 100 ? 1 : 0) + 'k';
  return sym + n;
}

/** Round `v` up to a clean axis maximum (1/2/5 × 10ⁿ). */
function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return step * mag;
}

function roundedTopBar(x, y, w, h, baseY) {
  if (h <= 0) return '';
  const r = Math.min(4, w / 2, h);
  return (
    `M${x.toFixed(1)},${baseY} L${x.toFixed(1)},${(y + r).toFixed(1)} ` +
    `Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)} ` +
    `L${(x + w - r).toFixed(1)},${y.toFixed(1)} ` +
    `Q${(x + w).toFixed(1)},${y.toFixed(1)} ${(x + w).toFixed(1)},${(y + r).toFixed(1)} ` +
    `L${(x + w).toFixed(1)},${baseY} Z`
  );
}

/**
 * @param {object} options
 * @param {string} options.title
 * @param {string} [options.subtitle]
 * @param {Array<{label: string, values: number[]}>} options.bars — one
 *   `values` entry per series, in cents; kept in order (zero-value
 *   months included so a quiet stretch reads as a gap).
 * @param {Array<{label: string, color: string}>} options.series — 1 or 2.
 * @param {string} [options.emptyMessage]
 */
function renderColumnChart({ title, subtitle, bars, series, emptyMessage = 'Nothing to chart for this period yet.' }) {
  const head = [sectionHeading('trending-up', title, undefined)];
  if (subtitle) head.push(el('p', { class: 'section-description' }, subtitle));

  const flat = bars.flatMap((b) => b.values.map((v) => (Number.isFinite(v) && v > 0 ? v : 0)));
  const total = flat.reduce((a, b) => a + b, 0);
  if (bars.length === 0 || total === 0) {
    return el('section', { class: 'card viz-card', 'aria-label': title }, [...head, emptyState(emptyMessage)]);
  }

  const W = 560;
  const H = 280;
  const padL = 52;
  const padR = 14;
  const padT = 18;
  const padB = 34;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const baseY = padT + plotH;
  const top = niceMax(Math.max(...flat));

  const n = bars.length;
  const band = plotW / n;
  const groupW = band * 0.66;
  const gap = series.length > 1 ? 3 : 0;
  const subW = Math.min(22, (groupW - gap * (series.length - 1)) / series.length);

  const parts = [`<svg class="viz__svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}" preserveAspectRatio="xMidYMid meet">`];

  for (const t of [0, 0.5, 1]) {
    const y = baseY - t * plotH;
    parts.push(`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="${GRID}" stroke-width="1"/>`);
    parts.push(`<text x="${padL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="11" fill="${MUTED}">${esc(compactMoney(top * t))}</text>`);
  }

  bars.forEach((b, i) => {
    const groupX = padL + i * band + (band - subW * series.length - gap * (series.length - 1)) / 2;
    series.forEach((s, j) => {
      const v = Number.isFinite(b.values[j]) && b.values[j] > 0 ? b.values[j] : 0;
      const h = (v / top) * plotH;
      const x = groupX + j * (subW + gap);
      const d = roundedTopBar(x, baseY - h, subW, h, baseY);
      parts.push(`<g><title>${esc(b.label)} — ${esc(s.label)}: ${esc(formatCents(v))}</title>`);
      if (d) parts.push(`<path d="${d}" fill="${s.color}"/>`);
      parts.push(`</g>`);
    });
    const showLabel = n <= 12;
    if (showLabel) {
      parts.push(`<text x="${(groupX + (subW * series.length + gap * (series.length - 1)) / 2).toFixed(1)}" y="${baseY + 16}" text-anchor="middle" font-size="10" fill="${MUTED}">${esc(b.label)}</text>`);
    }
  });

  parts.push('</svg>');

  const fig = el('figure', { class: 'viz' });
  fig.innerHTML = parts.join('');

  const children = [...head, fig];
  if (series.length > 1) {
    children.push(
      el(
        'ul',
        { class: 'viz-legend viz-legend--row' },
        series.map((s) =>
          el('li', { class: 'viz-legend__item' }, [
            el('span', { class: 'viz-legend__swatch', style: `background:${s.color}` }),
            el('span', { class: 'viz-legend__label' }, s.label),
          ])
        )
      )
    );
  }

  return el('section', { class: 'card viz-card', 'aria-label': title }, children);
}

/**

function createExpenseAction(input, { now = new Date() } = {}) {

      category: input?.category || null,
      notes: input?.notes || null,

// ---- src/modules/expenses/selectors.js ----

const DEFAULT_EXPENSE_CATEGORIES = [
  'Groceries',
  'Eating Out',
  'Transport',
  'Shopping',
  'Entertainment',
  'Health',
  'Subscriptions',
  'Other',
];

function getAllExpenses(state) {
  return state.expenses ?? [];
}

/**
 * Every category currently "in play" — the default suggestions plus any
 * category actually used by a logged Expense or an existing Category
 * Budget, deduplicated and alphabetized. Category stays free text
 * everywhere (docs/DATA-MODEL.md — no locked enum), so this isn't a
 * source of truth to validate against, just the shared `<datalist>`
 * suggestion list for both the Expense form's category field (this
 * module) and the Category Budget form's category field
 * (src/modules/category-budgets/) — one function so introducing a new
 * category from *either* form makes it "known" to both from then on,
 * without a separate persisted category list. Reads `state.categoryBudgets`
 * directly as raw data (not through category-budgets/index.js) — the same
 * "read another slice's raw data for a simple read-only aggregate"
 * precedent already used by category-budgets/selectors.js reading
 * `state.expenses`, so neither module formally depends on the other.
 * @param {object} state
 * @returns {string[]}
 */
function getKnownCategories(state) {
  const categories = new Set(DEFAULT_EXPENSE_CATEGORIES);
  const expenses = getAllExpenses(state);
  for (const expense of Array.isArray(expenses) ? expenses : []) {
    if (expense?.category) categories.add(expense.category);
  }
  for (const budget of Array.isArray(state?.categoryBudgets) ? state.categoryBudgets : []) {
    if (budget?.category) categories.add(budget.category);
  }
  return [...categories].sort((a, b) => a.localeCompare(b));
}

function sortByDateDesc(expenses) {
  return expenses.slice().sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return a.createdAt < b.createdAt ? 1 : -1;
  });
}

/** Most recent expenses first (by date, then createdAt as a tiebreak) — a short list, not a ledger. */
function getRecentExpenses(state, { limit = 5 } = {}) {
  return sortByDateDesc(getAllExpenses(state)).slice(0, limit);
}

// The period filter (Recent Expenses section): lets the user look at a
// specific stretch of past spending instead of only "the last few". This
// is a read-only lens over Expenses — it doesn't change what's stored,
// doesn't touch Safe-to-Spend, and follows the same "derived, not stored"
// principle as Category Budgets' monthly figures (src/modules/
// category-budgets/selectors.js) and Safe-to-Spend itself.
const EXPENSE_PERIODS = ['recent', 'week', 'month', 'lastMonth', 'all', 'custom'];

/**
 * Resolves a period id into inclusive `[startDateKey, endDateKey]` bounds
 * ("YYYY-MM-DD" strings, directly comparable against `Expense.date`), or
 * `null` for periods with no bound on one or both ends ('recent', 'all',
 * or a 'custom' range missing both `from`/`to`).
 * @param {string} period one of EXPENSE_PERIODS
 * @param {{now?: Date, from?: string|null, to?: string|null}} [options]
 * @returns {{startDateKey: string|null, endDateKey: string|null}|null}
 */
function resolvePeriodRange(period, { now = new Date(), from = null, to = null } = {}) {
  if (period === 'week') {
    const start = startOfWeek(now);
    return { startDateKey: getLocalDateKey(start), endDateKey: getLocalDateKey(addDays(start, 6)) };
  }
  if (period === 'month') {
    return { startDateKey: getLocalDateKey(startOfMonth(now)), endDateKey: getLocalDateKey(endOfMonth(now)) };
  }
  if (period === 'lastMonth') {
    const lastMonth = addMonths(now, -1);
    return { startDateKey: getLocalDateKey(startOfMonth(lastMonth)), endDateKey: getLocalDateKey(endOfMonth(lastMonth)) };
  }
  if (period === 'custom') {
    if (!from && !to) return null;
    return { startDateKey: from || null, endDateKey: to || null };
  }
  return null; // 'recent' and 'all' — no date bound, only 'recent' additionally caps by count
}

/**
 * Expenses within a chosen period, most recent first. 'recent' and 'all'
 * are both unbounded by date — 'recent' additionally caps to `limit`
 * (the existing default-glance behavior); every other period returns
 * every matching expense, uncapped, since the user asked to look at that
 * specific stretch of time.
 * @param {object} state
 * @param {{period?: string, now?: Date, from?: string|null, to?: string|null, limit?: number}} [options]
 */
function getExpensesForPeriod(state, { period = 'recent', now = new Date(), from = null, to = null, limit = 10 } = {}) {
  const sorted = sortByDateDesc(getAllExpenses(state));
  const range = resolvePeriodRange(period, { now, from, to });
  const filtered = range
    ? sorted.filter((expense) => {
        if (!expense?.date) return false;
        if (range.startDateKey && expense.date < range.startDateKey) return false;
        if (range.endDateKey && expense.date > range.endDateKey) return false;
        return true;
      })
    : sorted;
  return period === 'recent' ? filtered.slice(0, limit) : filtered;
}

/**
 * Sum of a list of expenses' amounts, skipping any with a corrupted/
 * invalid `amountCents` rather than letting one bad value NaN-poison the
 * total (same defensive pattern as src/modules/category-budgets/
 * selectors.js and src/modules/safe-to-spend/calculation.js).
 * @param {Array<{amountCents: number}>} expenses
 */
function getExpensesTotalCents(expenses) {
  let totalCents = 0;
  for (const expense of Array.isArray(expenses) ? expenses : []) {
    if (!expense || !isValidAmountCents(expense.amountCents)) continue;
    totalCents += expense.amountCents;
  }
  return totalCents;
}

const EDITABLE_FIELDS = ['amountCents', 'description', 'date', 'category', 'notes'];

function validateNewExpense(candidate) {
  if (!candidate) return null;
  if (!isValidAmountCents(candidate.amountCents)) return null;
  return candidate;
}

function sanitizeExpenseChanges(changes = {}) {
  const sanitized = {};
  for (const field of EDITABLE_FIELDS) {
    if (field in changes) sanitized[field] = changes[field];
  }
  if ('amountCents' in sanitized && !isValidAmountCents(sanitized.amountCents)) {
    delete sanitized.amountCents;
  }
  return sanitized;
}

// Note: this reducer only manages the `expenses` array itself. The
// consequence of an expense on Current Balance (docs/DATA-MODEL.md
// "Current Balance model") is a *cross-slice* effect computed by
// balance-effect.js and applied by src/main.js's rootReducer, which has
// visibility into both slices — this reducer deliberately doesn't know
// budget exists, keeping module boundaries clean (docs/ARCHITECTURE.md §7).
const expensesReducer = createListReducer({
  actionPrefix: 'expenses',
  entityKey: 'expense',
  validateNew: validateNewExpense,
  sanitizeChanges: sanitizeExpenseChanges,
});


// ---- src/modules/expenses/balance-effect.js ----
// How logging/editing/deleting an Expense affects the Current Balance
// checkpoint. See docs/DATA-MODEL.md "Current Balance model" for the full
// reasoning: the balance is a checkpoint the user can correct at any
// time, automatically adjusted by expense transactions in between.
//
// This file only decides *how much* the balance should change — it
// returns a signed delta, never mutates state itself. src/main.js's
// rootReducer applies that delta to `budget.currentBalanceCents`
// atomically, in the same state transition as the `expenses` slice
// update (so the two never drift out of sync, and the store's
// subscribers see one consistent state, not two separate updates).


/**
 * @param {{type: string, id?: string}} action
 * @param {Array} prevExpenses the `expenses` slice before this action
 * @param {Array} nextExpenses the `expenses` slice after this action
 * @returns {number} signed cents to add to currentBalanceCents (negative = spent)
 */
function computeBalanceDelta(action, prevExpenses, nextExpenses) {
  if (nextExpenses === prevExpenses) return 0; // the expenses reducer no-op'd — nothing to apply

  if (action.type === 'expenses/create') {
    // createListReducer appends; the new expense is always the last item.
    const added = nextExpenses[nextExpenses.length - 1];
    return added && isValidAmountCents(added.amountCents) ? -added.amountCents : 0;
  }

  if (action.type === 'expenses/delete') {
    const removed = prevExpenses.find((expense) => expense.id === action.id);
    // Refund what was previously deducted — but only if that figure is
    // actually a valid amount. A corrupted stored expense (bad amountCents
    // from hand-edited/pre-validation localStorage data) contributes 0
    // rather than NaN-poisoning currentBalanceCents; the reducer already
    // guarantees this can't happen for anything created/edited through the
    // app itself (src/modules/expenses/reducer.js).
    return removed && isValidAmountCents(removed.amountCents) ? removed.amountCents : 0;
  }

  if (action.type === 'expenses/update') {
    const before = prevExpenses.find((expense) => expense.id === action.id);
    const after = nextExpenses.find((expense) => expense.id === action.id);
    if (!before || !after) return 0;
    const beforeCents = isValidAmountCents(before.amountCents) ? before.amountCents : 0;
    const afterCents = isValidAmountCents(after.amountCents) ? after.amountCents : 0;
    // Spent more than before -> further deduct the increase.
    // Spent less than before -> refund the decrease.
    return beforeCents - afterCents;
  }

  return 0;
}

      ].filter(Boolean)

    const amountCents = parseAmountToCents(amount.amountInput.value);

    error.textContent = '';

// ---- src/modules/category-budgets/selectors.js ----
// Selectors for Category Budgets (Phase 6). "Spent" is always derived
// live from Expenses dated in the current calendar month — there is no
// explicit monthly reset step or stored "spent so far" figure. The month
// simply changes which expenses count, automatically, the moment `now`
// rolls into a new month. This also means these figures can never drift
// out of sync with the Expenses they're computed from (same "derived, not
// stored" principle as Safe-to-Spend — see docs/DATA-MODEL.md §4).
//
// These are purely a planning/visibility layer — see docs/SAFE-TO-SPEND.md
// for why they deliberately do NOT feed into the Safe-to-Spend arithmetic.


/** Spending at/above this fraction of the limit (but not yet over) is "approaching". */
const APPROACHING_THRESHOLD_RATIO = 0.8;

function getAllCategoryBudgets(state) {
  const value = state?.categoryBudgets;
  return Array.isArray(value) ? value : [];
}

/** "YYYY-MM" — a simple string-prefix month key, comparable against Expense.date ("YYYY-MM-DD"). */
function monthKeyFor(date) {
  return getLocalDateKey(date).slice(0, 7);
}

function sumSpentForCategory(expenses, category, monthKey) {
  let totalCents = 0;
  // Array.isArray, not `?? []` — a corrupted stored value can be present
  // but the wrong type, not just missing; see src/modules/safe-to-spend/
  // calculation.js's identical guard and docs/QA-REPORT.md (Phase 8).
  for (const expense of Array.isArray(expenses) ? expenses : []) {
    if (!expense || expense.category !== category) continue;
    if (!expense.date || !expense.date.startsWith(monthKey)) continue;
    // A corrupted/invalid amountCents (e.g. hand-edited or pre-validation
    // localStorage data) is skipped rather than summed — an unguarded `+=`
    // here would let a single bad value NaN-poison the whole month's
    // "spent" figure and status, matching the defensive pattern already
    // used by src/modules/safe-to-spend/calculation.js.
    if (!isValidAmountCents(expense.amountCents)) continue;
    totalCents += expense.amountCents;
  }
  return totalCents;
}

function statusFor(spentCents, limitCents) {
  if (limitCents <= 0) return spentCents > 0 ? 'exceeded' : 'on-track';
  if (spentCents > limitCents) return 'exceeded';
  if (spentCents >= limitCents * APPROACHING_THRESHOLD_RATIO) return 'approaching';
  return 'on-track';
}

/**
 * Each category budget's progress for the current calendar month.
 * @param {object} state
 * @param {{now?: Date}} [options]
 * @returns {Array<{id: string, category: string, limitCents: number, spentCents: number, remainingCents: number, status: 'on-track'|'approaching'|'exceeded'}>}
 */
function getCategoryBudgetProgress(state, { now = new Date() } = {}) {
  const monthKey = monthKeyFor(now);
  return getAllCategoryBudgets(state).map((budget) => {
    const spentCents = sumSpentForCategory(state.expenses, budget.category, monthKey);
    const remainingCents = budget.limitCents - spentCents;
    return {
      id: budget.id,
      category: budget.category,
      limitCents: budget.limitCents,
      spentCents,
      remainingCents,
      status: statusFor(spentCents, budget.limitCents),
    };
  });
}

/**
 * The Monthly View (Phase 6): totals across *budgeted* categories only —
 * spending in a category with no budget defined isn't part of this
 * summary (it's still visible on the Recent Expenses list, just not
 * folded into "total spent" here, which would otherwise make "remaining"
 * mean something different than "budget minus spend").
 * @param {object} state
 * @param {{now?: Date}} [options]
 */
function getMonthlyBudgetSummary(state, { now = new Date() } = {}) {
  const categories = getCategoryBudgetProgress(state, { now });
  const totalPlannedCents = categories.reduce((sum, c) => sum + c.limitCents, 0);
  const totalSpentCents = categories.reduce((sum, c) => sum + c.spentCents, 0);
  return {
    totalPlannedCents,
    totalSpentCents,

// ---- src/modules/bills/balance-effect.js ----
// How marking a Bill paid/unpaid affects the Current Balance checkpoint.
// See docs/DATA-MODEL.md "Current Balance model" — mirrors src/modules/
// expenses/balance-effect.js and src/modules/incomes/balance-effect.js's
// pattern exactly (a pure function deciding *how much* to adjust, applied
// atomically by src/main.js's rootReducer), but for the single `bills/
// toggle` action with `field: 'paid'`. Ordinary create/update/delete and
// the `field: 'active'` toggle never touch the balance, same as before
// this existed.
//
// Why this exists: an unpaid bill due on/before the payday horizon IS
// subtracted from Safe-to-Spend (`upcomingBillsCents` — docs/SAFE-TO-SPEND.md
// §2/§7). "Mark paid" removes it from that committed subtraction; this
// debit reduces the balance by the same amount at the same instant, so
// the net effect on Safe-to-Spend is ZERO — the amount just moves from
// "Bills still to land" to "already gone from the balance". Un-marking
// reverses both, also net zero. Without this debit, "Mark paid" would
// make Safe-to-Spend visibly go *up* (a real reported bug). (Whether
// unpaid bills are a committed term has flip-flopped five times — see
// docs/SAFE-TO-SPEND.md §2's history note; the current state is
// "subtracted while unpaid".)
//
// Deliberately narrower than Expenses, same simplification already
// documented for Income: editing a bill's amount or deleting it after
// it's been marked paid does not retroactively adjust the balance. Also
// worth knowing: if a payment is *both* marked paid here *and* separately
// logged as an Expense, that's a double deduction — this app doesn't link
// the two, consistent with `docs/PRODUCT.md` §5's "not a full accounting/
// double-entry bookkeeping system" non-goal. Use one or the other for a
// given real-world payment, not both.


/**
 * @param {{type: string, id?: string, field?: string}} action
 * @param {Array} prevBills the `bills` slice before this action
 * @param {Array} nextBills the `bills` slice after this action
 * @returns {number} signed cents to add to currentBalanceCents (negative = paid, positive = un-marked/refunded)
 */
function computeBillBalanceDelta(action, prevBills, nextBills) {
  if (action.type !== 'bills/toggle' || action.field !== 'paid') return 0;
  if (nextBills === prevBills) return 0; // the reducer no-op'd (unknown id) — nothing to apply

  const after = nextBills.find((bill) => bill.id === action.id);
  if (!after || !isValidAmountCents(after.amountCents)) return 0;

  return after.paid ? -after.amountCents : after.amountCents;
}

    if (trimmed) sanitized.name = trimmed;
    else delete sanitized.name;
  }
  if ('amountCents' in sanitized && !isValidAmountCents(sanitized.amountCents)) {
    delete sanitized.amountCents;
  }
  if ('frequency' in sanitized && !INCOME_FREQUENCIES.includes(sanitized.frequency)) {
    delete sanitized.frequency;
  }
  return sanitized;
}

const baseIncomesReducer = createListReducer({
  actionPrefix: 'incomes',
  entityKey: 'income',
  validateNew: validateNewIncome,
  sanitizeChanges: sanitizeIncomeChanges,
});

/**
 * Wraps the generic list reducer with one bespoke case:
 * `incomes/mark-received` isn't a plain field toggle (see
 * src/modules/incomes/actions.js `markIncomeReceivedAction`) — a one-time
 * income becomes permanently `received: true`, while a recurring income's
 * `nextDate` advances to its next cycle instead, so it never gets
 * permanently "stuck" as received. The actual Current Balance credit is a
 * separate cross-slice effect (src/modules/incomes/balance-effect.js),
 * applied atomically by src/main.js's rootReducer, mirroring how Expenses
 * affect the balance.
 */
function incomesReducer(items = [], action) {
  if (action.type === 'incomes/mark-received') {
    const index = items.findIndex((item) => item.id === action.id);
    if (index === -1) return items;
    const income = items[index];
    const next = items.slice();
    if (income.frequency === 'one-time' || !income.frequency) {
      if (income.received) return items; // already received — no-op
      next[index] = { ...income, received: true, updatedAt: action.now };
    } else {
      if (!income.nextDate) return items; // nothing to advance from
      const advanced = advanceByFrequency(parseLocalDate(income.nextDate), income.frequency);
      next[index] = { ...income, nextDate: getLocalDateKey(advanced), updatedAt: action.now };
    }
    return next;
  }
  return baseIncomesReducer(items, action);
}


// ---- src/modules/incomes/balance-effect.js ----
// How confirming an Income as received affects the Current Balance
// checkpoint. See docs/DATA-MODEL.md "Current Balance model" — mirrors
// src/modules/expenses/balance-effect.js's pattern exactly (a pure
// function deciding *how much* to credit, applied atomically by
// src/main.js's rootReducer), but only for the single `incomes/
// mark-received` action; ordinary create/update/delete/toggle on an
// Income never touch the balance, same as before this existed.
//
// Deliberately narrower than the Expense version: editing or deleting an
// income that was already marked received does NOT retroactively adjust
// the balance (an already-recurring income doesn't even keep a durable
// "received" marker to hang that adjustment on — see reducer.js). This
// keeps scope narrow, consistent with docs/PRODUCT.md §5's non-goal "not
// a full accounting/double-entry bookkeeping system" — the same
// simplification Bills' `paid` flag already has no balance-linkage at
// all. If this ever needs to change, it's a deliberate product decision,
// not a bug.


/**
 * @param {{type: string, id?: string}} action
 * @param {Array} prevIncomes the `incomes` slice before this action
 * @param {Array} nextIncomes the `incomes` slice after this action
 * @returns {number} cents to add to currentBalanceCents (always >= 0 — income only ever credits)
 */
function computeIncomeBalanceDelta(action, prevIncomes, nextIncomes) {
  if (action.type !== 'incomes/mark-received') return 0;
  if (nextIncomes === prevIncomes) return 0; // the reducer no-op'd (already received, unknown id, etc.) — nothing to credit

  const before = prevIncomes.find((income) => income.id === action.id);
  // Corrupted stored amountCents (hand-edited/pre-validation localStorage
  // data) contributes 0 rather than NaN-poisoning currentBalanceCents —
  // same defensive pattern as expenses/balance-effect.js.
  return before && isValidAmountCents(before.amountCents) ? before.amountCents : 0;
}

// ---- src/modules/income-receipts/create-receipt.js ----
// Builds the historical record created every time an Income is confirmed
// received — see docs/DATA-MODEL.md "IncomeReceipt". This is *not* a
// user-facing CRUD entity (no create/update/delete actions of its own) —
// it's an automatic log, one record appended per `incomes/mark-received`
// dispatch, applied atomically alongside that action's existing balance
// effect (src/modules/incomes/balance-effect.js) by src/main.js's
// rootReducer, the one place with visibility into all three slices
// (`incomes`, `incomeReceipts`, `budget`) this single action touches.
//
// Pure — decides *what record to create*, never mutates state itself,
// same shape as every other *-effect.js in this codebase.


/**
 * @param {{id: string, name: string, amountCents: number}|undefined} income
 *   the confirmed income, read *before* the mark-received mutation (its
 *   amount/name don't change during that mutation, but reading pre-mutation
 *   state is the more defensive choice — see src/main.js).
 * @param {Date} now
 * @returns {{id: string, incomeId: string, name: string, amountCents: number, date: string, createdAt: string}|null}
 *   `null` if there's nothing valid to record (unknown income, or a
 *   corrupted/invalid amount — the same defensive guard every balance
 *   effect in this codebase uses, so a bad stored value can't
 *   NaN-poison a receipt).
 */
function createIncomeReceipt(income, now) {
  if (!income || !isValidAmountCents(income.amountCents)) return null;
  return {
    id: createId('ir'),
    incomeId: income.id,
    name: income.name,
    amountCents: income.amountCents,
    date: getLocalDateKey(now),
    createdAt: now.toISOString(),
  };
}


// ---- src/modules/income-receipts/selectors.js ----

function getAllIncomeReceipts(state) {
  const value = state?.incomeReceipts;
  return Array.isArray(value) ? value : [];
}

/**
 * Receipts whose `date` falls within `[startDateKey, endDateKey]`
 * (either bound optional/nullable) — the real, logged counterpart to
 * `getExpensesForPeriod` (src/modules/expenses/selectors.js), used by
 * `getPeriodSummary`'s unbounded-period branch (src/modules/dashboard/
 * index.js) to sum actual received income instead of projecting.
 * @param {object} state
 * @param {{startDateKey?: string|null, endDateKey?: string|null}} [options]
 */
function getIncomeReceiptsForPeriod(state, { startDateKey = null, endDateKey = null } = {}) {
  return getAllIncomeReceipts(state).filter((receipt) => {
    if (!receipt?.date) return false;
    if (startDateKey && receipt.date < startDateKey) return false;
    if (endDateKey && receipt.date > endDateKey) return false;
    return true;
  });
}

/**
 * Sum of a list of receipts' amounts, skipping any with a corrupted/
 * invalid `amountCents` rather than letting one bad value NaN-poison the
 * total (same defensive pattern as every other *TotalCents helper in this
 * codebase).
 * @param {Array<{amountCents: number}>} receipts
 */
function getIncomeReceiptsTotalCents(receipts) {
  let totalCents = 0;
  for (const receipt of Array.isArray(receipts) ? receipts : []) {
    if (!receipt || !isValidAmountCents(receipt.amountCents)) continue;
    totalCents += receipt.amountCents;
  }
  return totalCents;
}

/**

 */
function getBillPaymentsForPeriod(state, { startDateKey = null, endDateKey = null } = {}) {

    if (!payment?.date) return false;
    if (startDateKey && payment.date < startDateKey) return false;

    return true;
  });

/**

 */
function getBillPaymentsTotalCents(payments) {
  let totalCents = 0;
  for (const payment of Array.isArray(payments) ? payments : []) {
    if (!payment || !isValidAmountCents(payment.amountCents)) continue;

// §7 and docs/DATA-MODEL.md "BillPayment". Not a user-facing CRUD module
