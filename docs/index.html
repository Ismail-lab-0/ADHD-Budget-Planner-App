<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADHD Budget Planner</title>
    <style>
/* ---- src/styles/base.css ---- */
/* Design tokens + reset. See CLAUDE.md "Design system" — calm, minimal,
   modern, low cognitive load. Colors are semantic tokens so components
   never hardcode a raw color, and dark mode is a token swap, not a
   parallel stylesheet.

   Color system: the canonical tokens (`--bg`, `--surface`, `--border`,
   `--text-primary`, `--text-secondary`, `--accent`, `--accent-bg`,
   `--warning`, `--warning-bg`, `--danger`, `--progress-track`) are the
   ones to change if the palette itself ever changes — nothing else in
   this codebase should. Every existing `--color-*` name a component
   already uses is kept as a plain alias of one of these (`--color-bg:
   var(--bg)`, etc.), so the ~180 existing `var(--color-*)` references
   across components.css/responsive.css never needed a rename; only the
   values above do. `--danger-bg` and `--color-accent-contrast` aren't
   part of the given palette (a background tint for danger, and the
   text color used *on* accent-colored buttons) — derived/kept to match
   the pattern of the tokens that are. Never pure black/white for
   `--text-primary`/`--bg` in either mode — see the values below. */

:root {
  /* ---- Color: light (default) ----
     "Steady" — a cool, low-arousal palette: a faintly teal-tinted paper
     ground, deep slate ink, and a calm deep-teal accent. Deliberately
     moved off the earlier warm cream + sage green (which read as
     off-the-shelf / competitor-ish). Cool hues sit easier for a
     low-cognitive-load, ADHD-friendly UI; teal keeps the "money =
     balance / clarity / positive" association without being the same
     green, and red stays the one "negative" signal. All values
     contrast-checked against `--bg`/`--surface` at AA or better for the
     weight each is used at. */
  --bg: #f2f6f6;
  --surface: #ffffff;
  --border: #e1e8e7;
  --text-primary: #23323a;
  --text-secondary: #566a71;
  --accent: #0e7c76;
  --accent-bg: #ddefec;
  --warning: #b06f1f;
  --warning-bg: #f7ecdb;
  --danger: #bb463b;
  --danger-bg: #f8e5e1;
  --progress-track: #e5ecea;

  /* ---- Legacy/semantic aliases — every existing component reads these;
     keeping them means the palette above is the only thing that ever
     needs to change. `accent` doubles as the one "positive/safe" signal
     color everywhere (income, a positive Safe-to-Spend, progress fills)
     — never a separate brand color competing with it. */
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-text: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-border: var(--border);
  --color-accent: var(--accent);
  --color-accent-contrast: #ffffff;
  --color-accent-muted: var(--accent-bg);
  --color-focus: var(--accent);
  --color-status-attention-bg: var(--danger-bg);
  --color-status-attention-text: var(--danger);
  --color-status-positive-bg: var(--accent-bg);
  --color-status-positive-text: var(--accent);
  --color-status-caution-bg: var(--warning-bg);
  --color-status-caution-text: var(--warning);
  /* Cool slate shadow tint to match the palette (was a warm brown). */
  --shadow-sm: 0 1px 3px rgba(26, 42, 49, 0.07), 0 1px 2px rgba(26, 42, 49, 0.05);
  /* A gentle mid lift — between -sm and -md; the per-tab summary cards. */
  --shadow: 0 3px 10px rgba(26, 42, 49, 0.08);
  --shadow-md: 0 10px 28px rgba(26, 42, 49, 0.12);

  /* Category identifier colours — a fixed set of distinct hues so a list
     of mixed categories reads as organized, not a rainbow. Purely
     identifying, never judgmental (docs/PRODUCT.md §3); deliberately not
     --accent or --danger (those keep their one meaning). Applied via
     `iconChip()`/`categoryIconChip()` (src/ui/components/icons.js) and the
     dashboard donut (src/ui/components/charts.js). Re-stepped for the
     dashboard-chart work to a set that clears the data-viz normal-vision
     floor (worst adjacent ΔE 15.3, was 11.6 — a fail) and the chroma
     floor (two of the old hues read as gray); the remaining
     colour-blindness deltas are in the warn band, legal here because the
     donut always ships the legend + per-slice value/% + surface gaps as
     the identity channel (colour is never the only cue). Seven arbitrary
     hues cannot fully clear CVD on any single surface — that is a known
     limit of the medium, mitigated by the legend, not a bug. */
  --color-cat-groceries: #1f9e63;
  --color-cat-eating-out: #e08133;
  --color-cat-transport: #2f7fd6;
  --color-cat-shopping: #d24f9a;
  --color-cat-entertainment: #8a5fd0;
  --color-cat-health: #d94b3e;
  --color-cat-subscriptions: #0f9b9b;

  /* Chart series — the dashboard's "Income vs Expenses" columns
     (src/ui/components/charts.js): a teal / coral pair, teal for money
     in (consistent with the accent's "positive" role), coral for money
     out. Deeper than a pastel so both read clearly on `--surface`;
     validated for both themes against the data-viz chroma / CVD /
     contrast checks. The chart always ships a legend, so identity is
     never colour-alone. */
  --color-chart-income: #0f9b9b;
  --color-chart-expense: #d4663f;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  /* Serif, system-only (no web font — see CLAUDE.md "no network request in
     normal use") — used sparingly, just the Safe-to-Spend hero amount, for
     a warmer, more editorial focal point than an all-sans page would give. */
  --font-serif: Georgia, Cambria, 'Times New Roman', Times, serif;
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.375rem;
  --font-size-2xl: 1.75rem;
  --font-size-3xl: 2.25rem;
  --font-size-hero: clamp(2.75rem, 9vw, 3.75rem);
  --line-height-base: 1.5;
  --line-height-tight: 1.25;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* `.app-main`'s left/right edge padding only (src/styles/components.css,
     responsive.css) — was `var(--space-4)` (16px) at every breakpoint;
     reduced by exactly 20% at the user's explicit request (16 * 0.8 =
     12.8px). Deliberately not part of the space-1..8 scale above (that
     scale's values are all whole multiples of 4px, and 12.8px isn't) —
     a one-off, single-purpose token rather than bending the scale itself
     or duplicating this literal value across three separate `.app-main`
     rules. Vertical padding at each breakpoint is untouched, still the
     normal --space-4/--space-6/--space-8 progression. */
  --app-edge-padding: 12.8px;

  /* Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 999px;

  /* Touch target minimum (mobile-first) */
  --tap-target-min: 44px;
}

/* Dark theme tokens — a warm dark charcoal base, deliberately
   desaturated/lower-contrast relative to a typical "technical" dark UI
   to match the calm, low-cognitive-load feel (CLAUDE.md "Design
   system"). Only the *accent* trio was updated to teal alongside the
   light-mode "Steady" repalette above, so the brand/positive colour
   stays consistent between modes; the warm charcoal base is otherwise
   unchanged and is a candidate for a future cool-dark pass to fully
   match the new light theme. Applied two ways so both an explicit
   in-app choice (src/ui/components/theme-toggle.js, `settings.theme`,
   persisted through the existing storage adapter — see docs/DATA-MODEL.md,
   already the app's one localStorage path) and the OS-level
   `prefers-color-scheme` work, with the explicit choice always winning.
   The toggle works by adding a class to <html> (`src/ui/shell.js`), not
   an inline style or a second stylesheet:
   - no stored preference ('system', the default): follows the OS, via the
     media query below, guarded so an explicit *light* choice on a
     dark-OS device isn't overridden by it;
   - an explicit 'dark' choice: applied regardless of the OS, via the
     plain `.theme-dark` class right after. */
@media (prefers-color-scheme: dark) {
  :root:not(.theme-light) {
    --bg: #1c1b19;
    --surface: #242320;
    --border: #38362f;
    --text-primary: #efeae2;
    --text-secondary: #9c9689;
    --accent: #5fb3ab;
    --accent-bg: #1e332f;
    --warning: #d4a05c;
    --warning-bg: #332b1e;
    --danger: #c97f63;
    --danger-bg: #382920;
    --progress-track: #312f2a;

    --color-bg: var(--bg);
    --color-surface: var(--surface);
    --color-text: var(--text-primary);
    --color-text-secondary: var(--text-secondary);
    --color-border: var(--border);
    --color-accent: var(--accent);
    --color-accent-contrast: #0c2622;
    --color-accent-muted: var(--accent-bg);
    --color-focus: var(--accent);
    --color-status-attention-bg: var(--danger-bg);
    --color-status-attention-text: var(--danger);
    --color-status-positive-bg: var(--accent-bg);
    --color-status-positive-text: var(--accent);
    --color-status-caution-bg: var(--warning-bg);
    --color-status-caution-text: var(--warning);
    /* Dark surfaces need a real (if subtle) shadow too, not `none` — a
       flat dark card next to a dark background has no depth cue at all
       without one — but kept softer than a typical near-black dark theme. */
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.28);
    --shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.38);

    /* Same hue identity as the light-mode set, tuned for contrast against
       a dark surface without the higher saturation a "technical" dark UI
       would use. */
    --color-cat-groceries: #31a071;
    --color-cat-eating-out: #cf8543;
    --color-cat-transport: #4386d4;
    --color-cat-shopping: #cf5c9e;
    --color-cat-entertainment: #8d64cf;
    --color-cat-health: #d9564a;
    --color-cat-subscriptions: #1f9d9d;

    --color-chart-income: #1f9d9d;
    --color-chart-expense: #d67854;
  }
}

:root.theme-dark {
  --bg: #1c1b19;
  --surface: #242320;
  --border: #38362f;
  --text-primary: #efeae2;
  --text-secondary: #9c9689;
  --accent: #5fb3ab;
  --accent-bg: #1e332f;
  --warning: #d4a05c;
  --warning-bg: #332b1e;
  --danger: #c97f63;
  --danger-bg: #382920;
  --progress-track: #312f2a;

  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-text: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-border: var(--border);
  --color-accent: var(--accent);
  --color-accent-contrast: #0c2622;
  --color-accent-muted: var(--accent-bg);
  --color-focus: var(--accent);
  --color-status-attention-bg: var(--danger-bg);
  --color-status-attention-text: var(--danger);
  --color-status-positive-bg: var(--accent-bg);
  --color-status-positive-text: var(--accent);
  --color-status-caution-bg: var(--warning-bg);
  --color-status-caution-text: var(--warning);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.28);
  --shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.38);
  --color-cat-groceries: #31a071;
  --color-cat-eating-out: #cf8543;
  --color-cat-transport: #4386d4;
  --color-cat-shopping: #cf5c9e;
  --color-cat-entertainment: #8d64cf;
  --color-cat-health: #d9564a;
  --color-cat-subscriptions: #1f9d9d;

  --color-chart-income: #1f9d9d;
  --color-chart-expense: #d67854;
}


*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  min-height: 100%;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p {
  margin: 0 0 var(--space-3) 0;
  line-height: var(--line-height-tight);
}

h1 {
  font-size: var(--font-size-2xl);
  font-weight: 700;
}

h2 {
  font-size: var(--font-size-lg);
  font-weight: 600;
}

p {
  line-height: var(--line-height-base);
}

img,
svg {
  max-width: 100%;
  display: block;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

a {
  color: inherit;
}

ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

/* Visible focus for every interactive element — never rely on color alone
   and never suppress the browser's default without replacing it. */
:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}


/* ---- src/styles/components.css ---- */
/* Reusable component styles. See CLAUDE.md "Design system": typography,
   spacing, radius, buttons, cards, inputs, navigation, modal structure,
   empty states, status indicators. Base (non-breakpoint-specific) look
   only — layout changes by screen size live in responsive.css. */

/* ---- App shell ---- */

.app-banner {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  background: var(--color-accent-muted);
  color: var(--color-text);
  font-size: var(--font-size-sm);
  text-align: center;
}

.app-main {
  /* Left/right at --app-edge-padding (space-4 reduced 20%, see base.css),
     top/bottom still the normal --space-4 — a horizontal-only reduction. */
  padding: var(--space-4) var(--app-edge-padding);
}

/* ---- Sidebar navigation (src/ui/components/sidebar.js) ----
   In-page section navigation for the single dashboard screen (the app is
   deliberately one scrolling page — see CLAUDE.md "Current status"). This
   is the mobile-first baseline: an off-canvas drawer opened by the header
   bar's hamburger. src/styles/responsive.css turns it into a fixed,
   collapsible rail at >=1024px. Colours/tokens are all existing ones —
   the active item reuses the accent-muted treatment already used by the
   period selector's active option. */
:root {
  --sidebar-width: 240px;
  --sidebar-collapsed-width: 68px;
}

.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  width: min(var(--sidebar-width), 84vw);
  padding: var(--space-4) var(--space-3);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  overflow-y: auto;
  overscroll-behavior: contain;
  transform: translateX(-100%);
  visibility: hidden;
  /* Delay `visibility` so the drawer stays keyboard/AT-inert while
     off-canvas, then reveals instantly when opening. */
  transition: transform 0.2s ease, visibility 0s linear 0.2s;
}

body.sidebar-drawer-open .sidebar {
  transform: translateX(0);
  visibility: visible;
  box-shadow: var(--shadow-md);
  transition: transform 0.2s ease;
}

.sidebar__top {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.sidebar__brand {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: 1;
  min-width: 0;
  font-weight: 700;
}

/* ---- Brand lockup (src/ui/components/brand.js) — used in the header bar
   and the sidebar. An accent-filled rounded badge + a two-line wordmark
   ("Budget" over "and Planner"), a deliberate logotype rather than an
   accidental wrap. ---- */
.brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
}

.brand__mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: var(--radius-md);
  background: var(--color-accent);
  color: var(--color-accent-contrast);
}

.brand__name {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.brand__name-primary {
  font-weight: 700;
  font-size: var(--font-size-lg);
  line-height: 1.05;
  letter-spacing: -0.015em;
}

.brand__name-sub {
  font-size: var(--font-size-xs);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.sidebar__toggle {
  display: none; /* a desktop-only affordance — shown at >=1024px */
}

.sidebar__nav {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.sidebar__group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar__group-label {
  margin: 0 0 var(--space-1);
  padding: 0 var(--space-3);
  font-size: var(--font-size-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-text-secondary);
}

/* ---- Sidebar footer card (src/ui/components/sidebar.js) — Current
   Balance + Savings, moved here from the former Budget tab. A tinted
   panel (not the sidebar's own surface colour); each figure is a small
   label with the amount below it and a compact edit pencil beside the
   amount. Pushed to the bottom of the rail; hidden on the collapsed icon
   rail (responsive.css). */
.sidebar__stats {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-color: color-mix(in srgb, var(--color-accent) 28%, var(--color-border));
  border-radius: var(--radius-md);
  background: var(--color-accent-muted);
  box-shadow: var(--shadow-md);
}

.sidebar__stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar__stat-label {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

.sidebar__stat-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.sidebar__stat-value {
  font-size: var(--font-size-base);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar__stat-edit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  padding: 0;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--color-text-secondary);
  cursor: pointer;
}

.sidebar__stat-edit:hover {
  color: var(--color-text);
}

.sidebar__link {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: var(--tap-target-min);
  padding: var(--space-2) var(--space-3);
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--color-text);
  font-size: var(--font-size-sm);
  text-align: left;
  cursor: pointer;
}

.sidebar__link:hover {
  background: var(--color-accent-muted);
}

.sidebar__link--active {
  background: var(--color-accent-muted);
  color: var(--color-accent);
  font-weight: 600;
}

.sidebar__label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Dims the page behind the mobile drawer; a click anywhere on it closes
   the drawer (src/ui/components/sidebar.js). Never shown on desktop. */
.sidebar-scrim {
  position: fixed;
  inset: 0;
  z-index: 55;
  padding: 0;
  border: 0;
  background: rgba(0, 0, 0, 0.4);
}

body:not(.sidebar-drawer-open) .sidebar-scrim {
  display: none;
}

/* The centered-content wrapper every view's content sits in (the sidebar
   + scrim are position:fixed siblings outside it — see
   src/ui/components/app-frame.js). On mobile it just fills its parent; at
   >=1024px it re-establishes the content measure inside the
   sidebar-offset .app-main (responsive.css). */
.app-view {
  min-width: 0;
}

.header-bar__menu-btn {
  flex-shrink: 0;
}

/* A dedicated view's page heading (src/ui/components/app-frame.js) — the
   Dashboard reuses this for its greeting + date too. The Income/Expenses/
   Bills/Debts views put a green "+ Add" button in the trailing slot. */
.view-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-5);
}

.view-header__main {
  min-width: 0;
}

.view-header h1 {
  margin-bottom: var(--space-1);
}

.view-header__subtitle {
  margin: 0;
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
}

/* A simple vertical stack of cards, used by the non-Dashboard views that
   don't need the two-column dashboard grid. */
.view-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* The stack's own `gap` is the single spacing source — cancel the card's
   default trailing margin so a summary card + list don't double up. */
.view-stack > .card {
  margin-bottom: 0;
}

/* A trailing-aligned row for a lone control above a list (e.g. the Debts
   view's "Manage debts" link) — the views put their entries in bare
   `.money-list--cards` / `.debt-list` cards with no wrapping card, so an
   action like this has nowhere else to sit. */
.view-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* A row of mutually-exclusive choice buttons (the Settings view's theme
   picker). */
.settings-choice {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* Settings controls sit on a full-width card, which on a wide desktop
   left a lone <select>/<input> stretched across the whole page. Cap them
   to a comfortable form width. */
.settings-view .field__input,
.settings-view .money-form {
  max-width: 26rem;
}

/* In Settings, each card already has its own heading + a
   `.section-description` comment, so the form's own top divider (which
   separates a form from a modal header elsewhere) is a redundant line. */
.settings-view .money-form {
  padding-top: 0;
  border-top: 0;
}

/* ---- Cards ---- */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  margin-bottom: var(--space-5);
  box-shadow: var(--shadow-sm);
  /* So a card the sidebar scrolls to (src/ui/components/sidebar.js) lands
     with a little breathing room from the top, not flush against it. */
  scroll-margin-top: var(--space-5);
}

.card:last-child {
  margin-bottom: 0;
}

/* ---- Icons (src/ui/components/icons.js) ---- */

.icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 0;
  flex-shrink: 0;
}

/* A small tinted rounded chip behind an icon — the chip's background is
   a soft tint of `--chip-color` via color-mix, so every new use just sets
   one color instead of a whole bg/fg pair. */
.icon-chip {
  --chip-color: var(--color-accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  background: var(--color-accent-muted); /* fallback for browsers without color-mix() */
  background: color-mix(in srgb, var(--chip-color) 16%, transparent);
  color: var(--chip-color);
  flex-shrink: 0;
}

.icon-chip--sm {
  width: 30px;
  height: 30px;
}

/* A bigger, friendlier rounded-square badge showing a real emoji — same
   tint approach as .icon-chip, just larger and with emoji sized to match
   (see categoryEmojiBadge, src/ui/components/icons.js). */
.emoji-badge {
  --chip-color: var(--color-accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background: var(--color-accent-muted);
  background: color-mix(in srgb, var(--chip-color) 18%, transparent);
  font-size: 1.375rem;
  line-height: 1;
  flex-shrink: 0;
}

/* A small, square, icon-only action button (e.g. a row's Edit/Delete) —
   distinct from .btn, which always carries visible text. */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--tap-target-min);
  height: var(--tap-target-min);
  padding: 0;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-secondary);
  cursor: pointer;
}

.icon-btn:hover {
  color: var(--color-text);
  border-color: var(--color-text-secondary);
}

.icon-btn--attention:hover {
  color: var(--color-status-attention-text);
  border-color: var(--color-status-attention-text);
}

/* A card's standard header: icon chip + <h2>, replacing a bare heading
   wherever a card wants the icon treatment. */
.section-heading {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.section-heading h2 {
  margin-bottom: 0;
}

/* ---- Buttons ---- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--tap-target-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font-size: var(--font-size-base);
  font-weight: 600;
  cursor: pointer;
}

.btn--primary {
  background: var(--color-accent);
  color: var(--color-accent-contrast);
}

.btn--secondary {
  background: transparent;
  border-color: var(--color-border);
  color: var(--color-text);
}

/* ---- Inputs ---- */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.field__label {
  font-size: var(--font-size-sm);
  font-weight: 600;
}

.field__input {
  min-height: var(--tap-target-min);
  padding: 0 var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-size: var(--font-size-base);
}

/* A <select> renders its text tight against the top/left without a
   little padding (unlike a text input, which the min-height + baseline
   centre). Give it real breathing room — a touch taller than a text
   input, and more horizontal room so the value isn't against the border
   or the native arrow. */
select.field__input {
  min-height: calc(var(--tap-target-min) + var(--space-2));
  padding-top: var(--space-3);
  padding-bottom: var(--space-3);
  padding-left: var(--space-5);
  padding-right: var(--space-5);
}

.field__hint {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

/* ---- Modal structure (src/ui/components/popup.js — every "add" form in
   the app opens through this one shared popup) ---- */

@keyframes modal-backdrop-fade-in {
  from {
    opacity: 0;
  }
}

@keyframes modal-pop-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
  z-index: 100;
  /* `prefers-reduced-motion: reduce` already forces every animation's
     duration to ~0 globally (src/styles/base.css) — nothing extra needed
     here to respect it. */
  animation: modal-backdrop-fade-in 0.16s ease-out;
}

.modal {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  overscroll-behavior: contain; /* scrolling a tall form to its end doesn't also scroll the page behind it */
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  animation: modal-pop-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-5);
  border-bottom: 1px solid var(--color-border);
}

.modal__header h2 {
  margin-bottom: 0;
}

.modal__body {
  padding: var(--space-5);
}

/* A money form shown as a popup's whole body doesn't need its own
   top separator line (that's for when it sits inline under a section
   heading) — the modal header already provides the divider. */
.modal__body > .money-form {
  border-top: none;
  padding-top: 0;
}

.modal__footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  padding: var(--space-5);
  border-top: 1px solid var(--color-border);
}

/* ---- Empty states ---- */

.empty-state {
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
  margin: 0;
}

/* ---- Status indicators ---- */
/* Always paired with a visible text label by whoever uses these classes —
   color is never the only signal (docs/TEST-PLAN.md accessibility
   checklist). */

.status {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: 600;
}

.status--neutral {
  background: var(--color-border);
  color: var(--color-text-secondary);
}

.status--attention {
  background: var(--color-status-attention-bg);
  color: var(--color-status-attention-text);
}

.status--positive {
  background: var(--color-status-positive-bg);
  color: var(--color-status-positive-text);
}

.status--caution {
  background: var(--color-status-caution-bg);
  color: var(--color-status-caution-text);
}

/* ---- Screens ---- */

/* ---- Dashboard ---- *
   Reference-style stack of row grids:
     .dashboard__top    — three even stat cards (Total Expenses / Total
                          Savings / Total debt to pay)
     .dashboard__mid    — Safe to Spend beside the Income-vs-Expenses
                          chart, matched height (chart-driven)
     .dashboard__bottom — Budget progress | Recent Expenses
   Each collapses to fewer columns on tablet and one on mobile —
   placement rules are in responsive.css. */
.dashboard {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.dashboard .card {
  margin-bottom: 0;
  padding: var(--space-6);
  border-radius: var(--radius-lg);
}

.dashboard__top,
.dashboard__mid,
.dashboard__bottom {
  display: grid;
  gap: var(--space-5);
}

/* The stat row and the safe-to-spend / chart row stretch their cards to
   equal height (the chart's natural height drives `.dashboard__mid`; the
   hero fills the rest — see `.hero__disclaimer { margin-top: auto }`). */
.dashboard__top,
.dashboard__mid {
  align-items: stretch;
}

/* ---- Charts (src/ui/components/charts.js) ---- */

.viz-card .section-description {
  margin-top: calc(var(--space-1) * -1);
  margin-bottom: var(--space-4);
}

.viz {
  margin: 0;
}

.viz__svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 320px;
  overflow: visible;
}

.viz-legend {
  display: flex;
  gap: var(--space-4);
  margin: var(--space-3) 0 0;
}

.viz-legend--row {
  flex-wrap: wrap;
}

.viz-legend__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--font-size-sm);
  min-width: 0;
}

.viz-legend__swatch {
  flex: 0 0 auto;
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.viz-legend__label {
  color: var(--color-text-secondary);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---- Onboarding (Phase 7) ---- */

/* One question centered on the screen, both axes — at the user's
   request. `min-height: 100vh` (with a `dvh` upgrade for browsers that
   support it, more accurate on mobile where the address bar changes the
   viewport) makes the screen at least viewport-tall regardless of
   .app-main's own padding, so `justify-content: center` has real room to
   center within; a step long enough to exceed that just scrolls
   normally, it's a floor, not a hard clamp. */
.screen--onboarding {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
}

.screen--onboarding .onboarding-header,
.screen--onboarding > .card {
  width: 100%;
  max-width: 480px;
}

/* On the payday / bills steps, "Continue" is a bare button rendered as a
   card sibling right after the add-form — without this it sits almost
   flush against the form's own "Add another …" button. */
.screen--onboarding > .card > .btn:last-child,
.screen--onboarding > .card > .link-button:last-child {
  margin-top: var(--space-4);
}

.onboarding-header {
  margin-bottom: var(--space-4);
  text-align: center;
}

.onboarding-header h1 {
  margin-bottom: var(--space-2);
}

.onboarding-header .section-description {
  margin-bottom: var(--space-2);
}

.onboarding-progress {
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  margin: 0 0 var(--space-4);
}

.onboarding-finish {
  text-align: center;
}

.onboarding-finish .section-description {
  margin-bottom: var(--space-4);
}

.section-description {
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
  margin-top: calc(var(--space-1) * -1);
}

/* ---- Expenses period filter (Recent Expenses section) ---- */

.expenses-filter {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.expenses-filter__select {
  min-height: var(--tap-target-min);
  flex: 1 1 160px;
}

.expenses-filter__date {
  min-height: var(--tap-target-min);
  flex: 1 1 140px;
}

.expenses-filter__date-sep {
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
}

.expenses-filter__total {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--color-text-secondary);
  margin: 0 0 var(--space-3);
}

/* ---- Mini table (the Dashboard's read-only "Expenses" card) ---- */

.mini-table__scroll {
  overflow-x: auto; /* never overflow the card ugly on a phone */
  margin: 0 calc(var(--space-2) * -1);
}

.mini-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-sm);
}

.mini-table th {
  text-align: left;
  font-weight: 500;
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-text-secondary);
  padding: 0 var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

.mini-table td {
  padding: var(--space-3) var(--space-2);
  border-bottom: 1px solid var(--color-border);
  color: var(--color-text);
  vertical-align: middle;
  white-space: nowrap;
}

.mini-table tbody tr:last-child td {
  border-bottom: none;
}

.mini-table__activity {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.mini-table__name {
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 22ch;
}

.mini-table__cat,
.mini-table__date {
  color: var(--color-text-secondary);
}

.mini-table__amount {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

/* ---- Money list / money items (Phase 2 — Income, Bills, Planned Expenses) ---- */

.money-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.money-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--color-border);
}

.money-item:last-child {
  border-bottom: none;
}

.money-item__body {
  flex: 1;
  min-width: 180px;
}

.money-item__title {
  display: block;
  font-weight: 500;
  word-break: break-word;
}

.money-item__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-1);
}

.money-item__meta-text {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

.money-item__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ---- Card-per-entry lists ----
   Income / expense / debt logs render each entry as its own subtly
   raised card rather than a divider-separated row: a hairline border,
   soft low-opacity shadow, rounded corners, and a small gap between
   them. Container styling only — the row's content/layout is unchanged.
   Applied via `.money-list--cards` (income-view.js, expenses-section.js,
   debts-section.js's "All debts" popup) and mirrored on `.debt-row`
   (the Debts view's own list, which uses its own markup). */
.money-list--cards {
  gap: var(--space-3);
}

.money-list--cards .money-item,
.money-list--cards .money-item:last-child {
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.completed-section {
  color: var(--color-text-secondary);
}

.completed-section summary {
  cursor: pointer;
  font-weight: 600;
  font-size: var(--font-size-sm);
  padding: var(--space-2) 0;
}

/* ---- Money forms (add/edit, Phase 2) ---- */

/* One consistent vertical rhythm between every child of a money form —
   bare inputs (e.g. a name field), `.field` wrappers, the "+ More
   options" toggle, error/hint text, and the button row all get the same
   gap. Previously only `.field` carried a `margin-bottom`, so a bare
   input butted straight against the next field's label. */
.money-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border);
}

.money-form .field {
  margin-bottom: 0;
}

.money-form__buttons {
  display: flex;
  gap: var(--space-2);
  margin-top: var(--space-1);
}

.money-form__toggle {
  align-self: flex-start;
}

.money-form__details {
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border);
}

.field__error {
  color: var(--color-status-attention-text);
  font-size: var(--font-size-xs);
  margin: calc(var(--space-2) * -1) 0 var(--space-2) 0;
  min-height: 1em;
}

.field__error:empty {
  display: none;
}

/* Brief, quiet success feedback after a save (Phase 7) — never
   attention-grabbing, just a plain confirmation. */
.field__success {
  color: var(--color-status-positive-text);
  font-size: var(--font-size-xs);
  margin: calc(var(--space-2) * -1) 0 var(--space-2) 0;
  min-height: 1em;
}

.field__success:empty {
  display: none;
}

.btn--small {
  min-height: var(--tap-target-min);
  padding: 0 var(--space-3);
  font-size: var(--font-size-sm);
}

/* ---- Single-value editor (currently just Savings) ---- */

.single-value-form__current {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--font-size-xl);
  font-weight: 700;
  margin-bottom: var(--space-3);
}

/* ---- Dashboard headline stat cards (src/ui/components/stat-card.js) --
   Total Expenses / Total Savings, in the top row beside Safe to Spend. ---- */

.stat-card {
  display: flex;
  flex-direction: column;
}

.stat-card__head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.stat-card__label {
  font-size: var(--font-size-sm);
  font-weight: 500;
  color: var(--color-text-secondary);
}

.stat-card__value {
  margin: 0;
  font-size: var(--font-size-2xl);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.stat-card__delta-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-3) 0 0;
}

.stat-card__delta {
  display: inline-flex;
  align-items: center;
  padding: 2px var(--space-2);
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: 600;
}

.stat-card__delta--good {
  background: var(--color-status-positive-bg);
  color: var(--color-status-positive-text);
}

.stat-card__delta--bad {
  background: var(--color-status-attention-bg);
  color: var(--color-status-attention-text);
}

.stat-card__delta-note {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

/* A plain supporting line under the value (used instead of a delta row —
   e.g. the Debts view's "Still owed" card). */
.stat-card__note {
  margin: var(--space-3) 0 0;
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
}

/* Tinted variants — the per-tab summary cards (Income / Expenses / Bills
   / Debts views). Same background treatment as `.upcoming-income` /
   `.bills-due-soon`: a soft `--color-status-*-bg` fill, no visible
   border, and a deeper shadow than a plain card so the headline number
   for each tab visibly lifts off the page. */
.stat-card--positive,
.stat-card--caution,
.stat-card--attention {
  border-color: transparent;
  box-shadow: var(--shadow);
}

.stat-card--positive {
  background: var(--color-status-positive-bg);
}

.stat-card--caution {
  background: var(--color-status-caution-bg);
}

.stat-card--attention {
  background: var(--color-status-attention-bg);
}

/* ---- Safe-to-Spend card — the dashboard's primary number ----
   Prominence comes from a soft accent tint + the largest figure on the
   page, not a loud gradient/shadow (docs/PRODUCT.md — calm, low
   cognitive load). Left-aligned to sit in the top row's first cell. */

.hero {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  background: var(--color-accent-muted);
  border-color: var(--color-accent-muted);
}

.hero__icon {
  margin: 0;
}

.hero__label {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0;
}

.hero__amount {
  font-size: var(--font-size-3xl);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0;
  font-variant-numeric: tabular-nums;
  color: var(--color-status-positive-text);
}

.hero__amount--negative {
  color: var(--color-status-attention-text);
}

.hero__progress {
  margin: var(--space-1) 0 0;
}

.hero__progress-track {
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--color-surface);
  overflow: hidden;
}

.hero__progress-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--color-status-positive-text);
  transition: width 0.2s ease;
}

.hero__progress--negative .hero__progress-fill {
  background: var(--color-status-attention-text);
}

.hero__progress-labels {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  margin-top: var(--space-2);
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

/* The line directly under the amount: "$X of your $Y balance has to last
   until Mon 31 Aug". */
.hero__subtext {
  margin: calc(var(--space-1) * -1) 0 0;
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
  font-variant-numeric: tabular-nums;
}

.hero__description {
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
  margin: 0;
}

/* "How is this worked out?" — a collapsed breakdown of the exact figures
   getSafeToSpend returns (src/ui/components/safe-to-spend-hero.js). */
.hero__breakdown {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

.hero__breakdown-summary {
  cursor: pointer;
  user-select: none;
}

.hero__breakdown-summary:hover {
  color: var(--color-text);
}

.hero__breakdown-rows {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-top: var(--space-2);
}

.hero__breakdown-row {
  display: flex;
  justify-content: space-between;
  gap: var(--space-4);
}

.hero__breakdown-amount {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.hero__breakdown-row--total {
  margin-top: var(--space-1);
  padding-top: var(--space-1);
  border-top: 1px solid var(--color-border);
  color: var(--color-text);
  font-weight: 600;
}

/* The plain-language sentence above the "How is this worked out?" rows. */
.hero__breakdown-intro {
  margin: var(--space-2) 0 var(--space-3);
  line-height: 1.5;
}

/* `auto` pins the disclaimer to the bottom of the card when it's
   stretched taller than its content — the `.dashboard__mid`
   matched-height case. With no free space it collapses to 0 and the flex
   `gap` still separates it. */
.hero__disclaimer {
  margin: auto 0 0;
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

/* ---- Bills due soon ---- */

.bills-due-soon {
  background: var(--color-status-caution-bg);
  border-color: transparent;
}

.bills-due-soon__list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.bills-due-soon__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

/* A hairline between rows so each bill / debt-payment reads as its own
   item — the amber card background makes `--color-border` faint, so tint
   the rule toward the card's own accent instead. */
.bills-due-soon__row:not(:last-child) {
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--color-border);
  border-bottom-color: color-mix(in srgb, var(--color-status-caution-text) 30%, transparent);
}

.bills-due-soon__info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 120px;
}

.bills-due-soon__name {
  font-weight: 600;
}

.bills-due-soon__date {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

.bills-due-soon__date--overdue {
  color: var(--color-status-attention-text);
  font-weight: 600;
}

.bills-due-soon__amount {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---- Upcoming income ---- */

.upcoming-income {
  background: var(--color-status-positive-bg);
  border-color: transparent;
}

.upcoming-income__list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.upcoming-income__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.upcoming-income__info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 120px;
}

.upcoming-income__name {
  font-weight: 600;
}

.upcoming-income__date {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

.upcoming-income__amount {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--color-status-positive-text);
}

/* ---- Header bar ---- */

.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.header-bar__brand {

  gap: var(--space-2);
}

/* ---- Period selector (header bar) ---- */

.period-selector {

}

/* A transparent full-page click-catcher behind the anchored panel — same
   sibling-scrim structure as src/ui/components/popup.js's dark backdrop,
   just invisible and positioned near the trigger instead of centered (see
   src/ui/components/period-selector.js's doc comment for why this needs
   no raw `document`-level click listener). */
.period-selector__scrim {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: transparent;
}

.period-selector__panel {
  position: absolute;
  top: 52px;
  right: 0;
  z-index: 91;
  width: min(280px, calc(100vw - var(--space-8)));
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: var(--space-3);
}

.period-selector__options {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.period-selector__option {
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  border: none;
  background: transparent;
  color: var(--color-text);
  cursor: pointer;
  min-height: var(--tap-target-min);
}

.period-selector__option:hover {
  background: var(--color-accent-muted);
}

.period-selector__option--active {
  background: var(--color-accent-muted);
  color: var(--color-accent);
  font-weight: 600;
}

.period-selector__custom-range {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);

.period-selector__date {

/* ---- Currency selector (header bar's right-side controls group,

   currency-selector.js) — display preference only, see that file's own
   comment. Same anchored scrim+panel structure as the period selector

   bar too, so a right-anchored panel overflows safely inward the same
   way period-selector's does. The toggle itself is a plain `.icon-btn`

.currency-selector {

  display: inline-flex;

.currency-selector__toggle {
  font-size: var(--font-size-lg);
  font-weight: 600;
}

.currency-selector__scrim {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: transparent;
}

.currency-selector__panel {
  position: absolute;
  top: 52px;
  right: 0;
  z-index: 91;
  width: min(260px, calc(100vw - var(--space-8)));

  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);

  padding: var(--space-3);

.currency-selector__options {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.currency-selector__option {
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  border: none;
  background: transparent;
  color: var(--color-text);
  cursor: pointer;
  min-height: var(--tap-target-min);
  font-size: var(--font-size-sm);
}

.currency-selector__option:hover {
  background: var(--color-accent-muted);
}

.currency-selector__option--active {
  background: var(--color-accent-muted);
  color: var(--color-accent);
  font-weight: 600;

/* ---- Card hierarchy: a quieter treatment for secondary/at-a-glance
   cards (the side column: This period, Current balance, Upcoming income,
   Bills due soon, Savings), vs. the full-weight .card used by the hero
   and the main column (Categories/Expenses/Inbox) — smaller heading,
   lighter border/shadow/padding, so the page has a visible
   primary/secondary distinction instead of every card competing at the
   same visual weight. Current Balance and Savings (src/ui/components/
   single-value-section.js) gained this class at the user's explicit
   request — they used to render as full-weight `.card`, the same visual

.card--quiet {

  border-color: var(--color-border);

/* A secondary card's own headline figure (e.g. "Currently: $X") reads

/* A card header that also carries a small trailing action (e.g. "+ Add

.card__header-row .section-heading {
  margin-bottom: 0;

/* A small, unobtrusive text link-as-button (e.g. "+ Add bill", "Edit

  background: transparent;
  color: var(--color-accent);
  font-size: var(--font-size-sm);
  font-weight: 600;
  cursor: pointer;
  padding: var(--space-1) 0;
  min-height: var(--tap-target-min);

.link-button:hover {

/* ---- Categories card ---- */

.category-list {

.category-row__name {

.category-row__amounts {

.category-row__bar-fill--attention {

.category-row__remaining {

}

.category-row__remaining--attention {
  color: var(--color-status-attention-text);
  font-weight: 600;
}

/* Categories view — each category is its own card (same treatment as
   `.debt-row` / `.goal-row`); the compact dashboard "Budget progress"
   card keeps the plain `.category-list` inside its own card. */

  gap: var(--space-3);
}

.category-list--cards .category-row {
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

/* On the same line as the badge / name row (a third flex child of

.category-row__actions {

  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
}

/* ---- Debt overview card (src/ui/components/debts-section.js) ----

   (.category-row__bar / .category-row__bar-fill) — for a debt, a fuller

.debt-list {

  flex-direction: column;
  gap: var(--space-3);

.debt-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.debt-row__body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.debt-row__pay {
  margin-top: var(--space-1);
}

/* A taller progress bar than the Categories mini-bar (6px) — a debt's
   "how far along am I" is the whole point of the card. */
.debt-row__bar {
  height: 10.8px;
  max-width: 54rem;
  border-radius: var(--radius-full);
  background: var(--progress-track);
  overflow: hidden;
}

.debt-row__bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--color-status-positive-text);
  transition: width 0.2s ease;
}

.debt-row__top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
}

.debt-row__name {
  font-weight: 600;
}

.debt-row__percent {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);

.debt-row--paid .debt-row__percent {

.debt-row__balances {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
}

.debt-row__payoff {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);

/* On the top line, right of the debt content — not stacked at the bottom. */
.debt-row__actions {
  display: flex;
  align-items: center;

/* ---- Goals view (src/ui/screens/goals-view.js) ----

.goal-list {

  box-shadow: var(--shadow-sm);
}

.goal-row__body {
  flex: 1;

}

.goal-row__top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
}

.goal-row__name {
  font-weight: 600;
}

.goal-row__percent {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  white-space: nowrap;
}

.goal-row--reached .goal-row__percent {
  color: var(--color-status-positive-text);
  font-weight: 600;
}

.goal-row__bar {
  height: 10.8px;
  max-width: 54rem;
  border-radius: var(--radius-full);

}

.goal-row__bar-fill {

  background: var(--color-status-positive-text);

}

.goal-row__amounts {

/* ---- src/styles/responsive.css ---- */
/* Responsive layout. See CLAUDE.md "Responsive design" — mobile is a
   first-class experience, not an afterthought: touch targets stay
   >= 44px, text stays readable, cards stay uncramped.

   Breakpoints: mobile (default, up to 639px), tablet (640-1023px),
   desktop (1024px+, fixed sidebar rail), wide desktop (1280px+, the
   dashboard's two-column grid — held back from 1024 so the fixed
   sidebar doesn't cramp the two columns). */

/* Tablet and up: content gets a comfortable centered measure instead of
   stretching edge to edge. */
@media (min-width: 640px) {
  .app-main {
    max-width: 640px;
    margin: 0 auto;
    padding: var(--space-6) var(--app-edge-padding);
  }
}

/* Desktop: a bit more breathing room. Onboarding (no sidebar) keeps the
   centered 1040 measure; the dashboard offsets .app-main for the fixed
   sidebar rail instead (below), re-centering its content in
   .app-view. */
@media (min-width: 1024px) {
  .app-main {
    max-width: 1040px;
    padding: var(--space-8) var(--app-edge-padding);
  }

  /* ---- Sidebar becomes a fixed rail (src/ui/components/sidebar.js) ---- */
  .sidebar {
    width: var(--sidebar-width);
    transform: none;
    visibility: visible;
    box-shadow: none;
    transition: width 0.15s ease;
  }

  .sidebar__toggle { display: inline-flex; }
  .sidebar__close { display: none; }
  .header-bar__menu-btn { display: none; }
  .sidebar-scrim { display: none !important; }

  /* Collapsed: icons only. Labels/group headings hidden; the section name
     stays reachable via each button's `title` (tooltip) and `aria-label`
     (screen readers) — set in sidebar.js. Active state still shows. */
  body.sidebar-collapsed .sidebar {
    width: var(--sidebar-collapsed-width);
    padding-left: var(--space-2);
    padding-right: var(--space-2);
  }
  body.sidebar-collapsed .sidebar__label,
  body.sidebar-collapsed .sidebar__group-label,
  body.sidebar-collapsed .brand__name,
  body.sidebar-collapsed .sidebar__stats {
    display: none;
  }
  body.sidebar-collapsed .sidebar__link {
    justify-content: center;
    gap: 0;
    padding-left: var(--space-2);
    padding-right: var(--space-2);
  }
  body.sidebar-collapsed .sidebar__group {
    align-items: center;
  }
  /* Brand icon above the expand toggle, both centred, when there's no
     room for them side by side. */
  body.sidebar-collapsed .sidebar__top {
    flex-direction: column;
    align-items: center;
  }
  body.sidebar-collapsed .sidebar__brand {
    flex: 0;
  }

  /* Offset the page content so the fixed rail never overlaps it. The
     content's own max-width/centering moves to .app-view. */
  body.has-sidebar .app-main {
    max-width: none;
    margin: 0;
    padding-left: calc(var(--sidebar-width) + var(--space-8));
  }
  body.has-sidebar.sidebar-collapsed .app-main {
    padding-left: calc(var(--sidebar-collapsed-width) + var(--space-6));
  }

  .app-view {
    max-width: 1040px;
    margin: 0 auto;
  }
}

/* ---- Dashboard grid (src/ui/screens/dashboard.js) ----
   Mobile (base): one column — every card stacks (stat cards, then Safe
   to Spend, then the chart, then Budget | Recent Expenses).
   Tablet (>= 600px): the three stat cards go 3-up in one even row; Safe
   to Spend and the chart still stack full-width.
   Desktop (>= 1024px): Safe to Spend sits beside the chart (matched
   height, chart-driven); the bottom row goes 2-up. */
@media (min-width: 600px) {
  .dashboard__top {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (min-width: 1024px) {
  .dashboard__mid {
    grid-template-columns: 1fr 1.4fr; /* Safe to Spend | Income vs Expenses (wider) */
  }
  .dashboard__bottom {
    grid-template-columns: 1.05fr 1.35fr; /* Budget progress | Recent Expenses (wider) */
  }
}

/* Narrow phones: keep money-item actions from cramming onto the title's
   row (Phase 2 §12 — "cards do not become cramped"). */
@media (max-width: 420px) {
  .money-item__actions {
    width: 100%;
  }

  /* A period-selector panel positioned from a fixed pixel offset (see
     components.css) can otherwise run close to a narrow phone's edge —
     give it a touch more breathing room from the right. */
  .period-selector__panel {
    right: calc(var(--space-2) * -1);
  }
}

// A tiny DOM-building helper — not a component framework, just removes
// repetitive createElement/appendChild boilerplate. See
// docs/ARCHITECTURE.md §2 ("no framework ... small hand-written helper
// utilities for rendering if repetitive patterns emerge").

/**
 * @param {string} tag
 * @param {Record<string, string>} [attrs]
 * @param {(Node|string|null|Array<Node|string|null>)} [children]
 * @returns {HTMLElement}
 */
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);

  for (const [key, value] of Object.entries(attrs)) {
    if (value == null) continue;
    if (key === 'class') node.className = value;
    // These must go through setAttribute, never a direct property
    // assignment: aria-*/data-*/role have no IDL property at all, and
    // `list` (an <input>'s associated <datalist>) is a *read-only* IDL
    // property that reflects the resolved element, not the attribute
    // string — `node.list = 'someId'` throws a TypeError in strict-mode
    // ES modules (which this codebase always runs as) in at least Safari,
    // silently doing nothing everywhere else. A Node-based DOM shim can't
    // catch this class of bug: it doesn't model real getter-only IDL
    // semantics, only a real browser does — found via manual QA, not
    // automated testing (see git history).
    else if (key.startsWith('aria-') || key.startsWith('data-') || key === 'role' || key === 'list') node.setAttribute(key, value);
    else node[key] = value;
  }

  for (const child of [].concat(children)) {
    if (child == null) continue;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }

  return node;
}

function svgMarkup(name, size) {
  const body = ICON_PATHS[name] ?? ICON_PATHS.tag;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

/**
 * A bare inline icon (e.g. inside a button, next to text on the same
 * line). Always `aria-hidden` — never the only identifier for what it's
 * next to.
 * @param {keyof typeof ICON_PATHS} name
 * @param {{size?: number}} [options]
 */
function icon(name, { size = 16 } = {}) {
  const span = document.createElement('span');
  span.className = 'icon';
  span.setAttribute('aria-hidden', 'true');
  span.innerHTML = svgMarkup(name, size);
  return span;
}

/**
 * An icon inside a small tinted rounded chip — used for section-header
 * badges and leading icons on list rows. `color` is a CSS color value
 * (usually a `var(--color-...)` token); the chip's background is a soft
 * tint of that same color via `color-mix`, so adding a new tint never
 * requires a second token.
 * @param {keyof typeof ICON_PATHS} name
 * @param {{color?: string, small?: boolean}} [options]
 */
function iconChip(name, { color = 'var(--color-accent)', small = false } = {}) {
  const span = document.createElement('span');
  span.className = small ? 'icon-chip icon-chip--sm' : 'icon-chip';
  span.style.setProperty('--chip-color', color);
  span.setAttribute('aria-hidden', 'true');
  span.innerHTML = svgMarkup(name, small ? 15 : 18);
  return span;
}

/**
 * A small, square icon-only button (e.g. a row's Edit/Delete actions).
 * Unlike `icon()`, this is a real, focusable `<button>` — icon-only
 * controls must carry their own accessible name since there's no visible
 * text label next to them (docs/TEST-PLAN.md accessibility checklist),
 * so `label` is required, not optional, and becomes `aria-label`.
 * @param {keyof typeof ICON_PATHS} name
 * @param {string} label accessible name, e.g. "Edit Groceries"
 * @param {() => void} onClick
 * @param {{tone?: 'neutral'|'attention'}} [options]
 */
function iconButton(name, label, onClick, { tone = 'neutral' } = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = `icon-btn${tone === 'attention' ? ' icon-btn--attention' : ''}`;
  button.setAttribute('aria-label', label);
  button.title = label;
  button.innerHTML = svgMarkup(name, 16);
  button.addEventListener('click', onClick);
  return button;
}

/**
 * A standard card header: a small icon chip beside an `<h2>`. Used in
 * place of a bare `el('h2', {id}, text)` everywhere a card wants the
 * section-header icon treatment.
 * @param {keyof typeof ICON_PATHS} name
 * @param {string} text
 * @param {string} [id] heading id, for `aria-labelledby` on the parent card
 * @param {{color?: string}} [options]
 */
function sectionHeading(name, text, id, { color } = {}) {
  const wrapper = document.createElement('div');
  wrapper.className = 'section-heading';
  wrapper.appendChild(iconChip(name, { color, small: true }));
  const heading = document.createElement('h2');
  if (id) heading.id = id;
  heading.textContent = text;
  wrapper.appendChild(heading);
  return wrapper;
}

// ---- src/ui/demo-gate.js ----
// ─────────────────────────────────────────────────────────────────────────
//  DEMO BUILD FLAG — the ONE difference between the two shipping builds
// ─────────────────────────────────────────────────────────────────────────
//  DEMO_MODE = true   gated public demo   → docs/index.html   (npm run build:demo)
//  DEMO_MODE = false  full paid build     → its own subdir    (npm run build:full)
//
//  The committed source value is `false` (the safe one — no restrictions).
//  build/build.js rewrites the emitted flag line to true ONLY when
//  invoked with `--demo`; nothing else about the two bundles differs.
//  (The paid build's output subdirectory name is deliberately kept only
//  in build/build.js so it never appears in the demo bundle.)
//
//  This module is imported first from src/main.js purely so the flag lands
//  near the top of the built <script>. When DEMO_MODE is false, every
//  export below short-circuits immediately — the guard, the countdown
//  line, and the limit modal are all unreachable and nothing renders.
// ─────────────────────────────────────────────────────────────────────────


const DEMO_MODE = true;
const DEMO_LIMIT = 25; // most expenses the demo build will create
const DEMO_WARN_AT = 20; // show the quiet countdown line from here on
const ETSY_URL = 'https://www.etsy.com/listing/4562403530/adhd-budget-planner-app-safe-to-spend';

/**
 * How many expenses exist right now — read straight off the live store
 * state, which is loaded from (and saved back to) the app's single
 * localStorage key via the storage adapter. NOT a separate counter.
 * @param {object} state
 * @returns {number}
 */
function demoExpenseCount(state) {
  return Array.isArray(state?.expenses) ? state.expenses.length : 0;
}

/**
 * The single guard every expense-creation path runs through — the Add
 * expense modal (dashboard + Expenses view) and the Brain Dump Inbox's
 * "Convert to expense" flow. Returns true when the create may proceed;
 * returns false AND shows the limit modal when the demo cap is hit.
 * A no-op that always returns true in the full build.
 * @param {object} state
 * @returns {boolean}
 */
function canAddExpense(state) {
  if (!DEMO_MODE) return true;
  if (demoExpenseCount(state) < DEMO_LIMIT) return true;
  showDemoLimit();
  return false;
}

/**
 * The quiet "5 of 25 demo expenses left" line shown under the dashboard
 * once the count reaches DEMO_WARN_AT. Secondary text, not a banner.
 * Returns null (renders nothing) below the threshold or in the full build.
 * @param {object} state
 * @returns {HTMLElement|null}
 */
function renderDemoNotice(state) {
  if (!DEMO_MODE) return null;
  const count = demoExpenseCount(state);
  if (count < DEMO_WARN_AT) return null;
  const left = Math.max(0, DEMO_LIMIT - count);
  const text =
    left > 0
      ? `${left} of ${DEMO_LIMIT} demo expenses left`
      : `You've reached the ${DEMO_LIMIT}-expense demo limit`;
  return el('p', { class: 'demo-countdown' }, text);
}

/**
 * The calm, in-app limit modal — the app's own modal styling (cream/green
 * palette, matching typography), never a browser alert. Appended to
 * <body>, so every card behind it stays visible and no data is touched.
 * Closes on the X, a backdrop click, or Escape.
 */
function showDemoLimit() {
  if (!DEMO_MODE || typeof document === 'undefined') return;
  if (document.getElementById('demo-limit-backdrop')) return; // already open

  const heading = el('h2', { id: 'demo-limit-heading' }, "That's the demo limit");
  const message = el(
    'p',
    { class: 'demo-limit__message' },
    `You've logged ${DEMO_LIMIT} expenses — that's the demo limit. Everything you've entered is still here. The full version has no limit and is yours to keep.`
  );
  const cta = el(
    'a',
    { class: 'btn btn--primary', href: ETSY_URL, target: '_blank', rel: 'noopener noreferrer' },
    'Get the full app'
  );

  const modal = el(
    'div',
    { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'demo-limit-heading' },
    [
      el('div', { class: 'modal__header' }, [heading, iconButton('close', 'Close', closeDemoLimit)]),
      el('div', { class: 'modal__body' }, [message]),
      el('div', { class: 'modal__footer' }, [cta]),
    ]
  );

  const backdrop = el('div', { class: 'modal-backdrop', id: 'demo-limit-backdrop' }, [modal]);
  backdrop.onclick = (event) => {
    if (event.target === backdrop) closeDemoLimit();
  };
  backdrop.onkeydown = (event) => {
    if (event.key === 'Escape') closeDemoLimit();
  };

  document.body.appendChild(backdrop);
  // Lock background scroll. src/ui/shell.js's render() only manages the
  // overflow lock for popups inside <main>; this modal lives on <body>,
  // so it's set here and restored in closeDemoLimit(). A store-driven
  // re-render while the modal is open would clear it — acceptable for a
  // terminal sales moment where nothing else is dispatching.
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => {
    document.body.style.overflow = 'hidden';
    cta.focus();
  });
}

function closeDemoLimit() {
  const backdrop = document.getElementById('demo-limit-backdrop');
  if (backdrop) backdrop.remove();
  document.body.style.overflow = '';
}


// ---- src/core/store.js ----
// The application state store: getState / dispatch / subscribe.
//
// See docs/ARCHITECTURE.md §4 "Application state architecture". This is
// intentionally small — a single in-memory state tree, updated only
// through a pure reducer, with subscribers notified after each real
// change.
//
// Reducer contract: `reducer(state, action)` must be pure, and MUST
// return the *same* state reference when an action produces no change
// (e.g. completing a task that doesn't exist). The store uses reference
// equality to decide whether to notify subscribers, so a reducer that
// always returns a new object defeats the no-op optimization and the
// "don't re-render on no-op" guarantee documented in docs/TEST-PLAN.md.

/**
 * @template S
 * @param {(state: S, action: {type: string, [key: string]: unknown}) => S} reducer
 * @param {S} initialState
 */
function createStore(reducer, initialState) {
  let state = initialState;
  const listeners = new Set();

  function getState() {
    return state;
  }

  function dispatch(action) {
    const nextState = reducer(state, action);
    if (nextState !== state) {
      state = nextState;
      // Snapshot so a listener unsubscribing (itself or another) during
      // notification doesn't skip or double-notify anyone.
      for (const listener of [...listeners]) {
        listener(state, action);
      }
    }
    return action;
  }

  /**
   * @param {(state: S, action: {type: string}) => void} listener
   * @returns {() => void} unsubscribe
   */
  function subscribe(listener) {
    listeners.add(listener);
    return () => listeners.delete(listener);
  }

  return { getState, dispatch, subscribe };
}


// ---- src/core/events.js ----
// A minimal pub/sub event bus.
//
// See docs/ARCHITECTURE.md §4. Used for cross-module signals that aren't
// full state changes — e.g. "a routine instance finished" — so a module
// can react without owning another module's state. State-change
// notifications themselves go through the store's own `subscribe`
// (src/core/store.js), not this bus.

function createEventBus() {
  /** @type {Map<string, Set<(payload: unknown) => void>>} */
  const handlers = new Map();

  /**
   * @param {string} event
   * @param {(payload: unknown) => void} handler
   * @returns {() => void} unsubscribe
   */
  function on(event, handler) {
    let set = handlers.get(event);
    if (!set) {
      set = new Set();
      handlers.set(event, set);
    }
    set.add(handler);
    return () => off(event, handler);
  }

  /**
   * @param {string} event
   * @param {(payload: unknown) => void} handler
   */
  function off(event, handler) {
    const set = handlers.get(event);
    if (!set) return;
    set.delete(handler);
    if (set.size === 0) {
      handlers.delete(event);
    }
  }

  /**
   * @param {string} event
   * @param {unknown} [payload]
   */
  function emit(event, payload) {
    const set = handlers.get(event);
    if (!set) return;
    // Snapshot so a handler that unsubscribes (itself or another) mid-emit
    // doesn't skip or double-call handlers.
    for (const handler of [...set]) {
      handler(payload);
    }
  }

  return { on, off, emit };
}

// Schema version, empty-state shape, and migration registry for the

// and §7 "Schema versioning & migrations" for the policy this implements.
//
// The empty state below is the budget-product shape (docs/PRODUCT.md) —
// every collection empty, settings/budget at their defaults.

const CURRENT_SCHEMA_VERSION = 10;

/** @returns the state tree for a brand-new install, at the current schema version. */
function createEmptyState() {
  const now = new Date().toISOString();

// Each migration transforms state from version (N-1) to version N, and is
// keyed by its *target* version. Per docs/DATA-MODEL.md §6, adding one
// means: bump CURRENT_SCHEMA_VERSION, add `[newVersion]: migrateFn` here,
// and describe the new shape in docs/DATA-MODEL.md, all in the same
// change.
//
// migrateFn shape: (state) => nextState — pure, prefers additive defaults
// over dropping data.

// v1 Task shape (pre-Phase-2, never shipped with a real Tasks UI):
//   { id, title, notes, createdAt, completedAt, dueAt, effortMinutes,
//     energy, context, goalId, source }
// v2 Task shape (Phase 2 — see docs/DATA-MODEL.md "Task"): adds status,
// priority, description, scheduledDate/Time, updatedAt; renames
// dueAt -> dueDate, effortMinutes -> estimatedMinutes, context -> category;
// drops energy/goalId/source (goalId/source will return, additively, when
// the Goals module's own migration lands).
function migrateTaskV1ToV2(task) {
  return {
    id: task.id,
    title: task.title,
    description: null,
    status: task.completedAt ? 'completed' : 'todo',
    priority: 'important',
    dueDate: task.dueAt ?? null,
    scheduledDate: null,
    scheduledTime: null,
    estimatedMinutes: task.effortMinutes ?? null,
    category: task.context ?? null,
    notes: task.notes ?? null,
    createdAt: task.createdAt,
    updatedAt: task.createdAt,
    completedAt: task.completedAt ?? null,
  };
}

// v2 -> v3: the product pivoted from a general life planner (Tasks,
// Routines, Calendar, Goals, Weekly Review) to a focused budget planner
// (docs/PRODUCT.md §9). The two shapes share no real data — a Task has no
// budget equivalent — so this migration deliberately *discards* the old
// tasks/routines/calendarEvents/money/goals/weeklyReviews collections
// rather than transform them, per the exception documented in
// docs/DATA-MODEL.md §7. `settings.payScheduleHint` (free-text) is
// likewise dropped — Income.nextDate replaces it with a structured value.
// What *does* carry over: meta and the settings fields that still apply
// (onboardingCompletedAt/displayName/theme/reducedMotion).
function migrateV2ToV3(state) {
  return {
    meta: state.meta,
    settings: {
      onboardingCompletedAt: state.settings?.onboardingCompletedAt ?? null,
      displayName: state.settings?.displayName ?? null,
      theme: state.settings?.theme ?? 'system',
      reducedMotion: state.settings?.reducedMotion ?? false,
    },
    budget: { currentBalanceCents: 0, savingsAllocationCents: 0, safetyBufferCents: 0 },
    incomes: [],
    bills: [],
    plannedExpenses: [],
  };
}

// v3 -> v4: adds the `expenses` collection (Phase 5 — Expense Tracking).
// Purely additive; nothing else changes shape. See docs/DATA-MODEL.md

function migrateV5ToV6(state) {

}

// to `incomeReceipts`, a real historical log of confirmed payments (one
// record per "Mark paid"), so a period's "Money out" can include what was
// actually paid, not every bill merely *due* in that window. Purely

function migrateV6ToV7(state) {

}

// dump" quick capture (docs/DATA-MODEL.md "ExpenseDraft"). Purely
// additive; nothing else changes shape.
function migrateV7ToV8(state) {

// Tracking (docs/DATA-MODEL.md "Debt" / "DebtPayment"), added ahead of

}

// "Goal"), the rework of the former Budget tab into a Goals tab, at the
// user's explicit request. Purely additive; existing users get `goals: []`
// and see no data loss.
function migrateV9ToV10(state) {
