const migrations = {
  2: (state) => ({ ...state, tasks: (state.tasks ?? []).map(migrateTaskV1ToV2) }),
  3: migrateV2ToV3,
  4: migrateV3ToV4,
  5: migrateV4ToV5,
  6: migrateV5ToV6,
  7: migrateV6ToV7,
  8: migrateV7ToV8,
  9: migrateV8ToV9,
  10: migrateV9ToV10,
};

/**
 * Runs `state` through every migration between its stored version and
 * `currentVersion`, in ascending order, and stamps the result with
 * `currentVersion`.
 *
 * `migrations`/`currentVersion` are overridable so this can be exercised
 * against a fake multi-step migration table in tests without touching the
 * real (currently empty) registry above.
 *
 * @param {{schemaVersion?: number, [key: string]: unknown}} state
 * @param {{migrations?: Record<number, (s: any) => any>, currentVersion?: number}} [options]
 */
function migrate(state, options = {}) {
  const { migrations: migrationTable = migrations, currentVersion = CURRENT_SCHEMA_VERSION } = options;

  const fromVersion = typeof state.schemaVersion === 'number' ? state.schemaVersion : 0;

  if (fromVersion > currentVersion) {
    // Data from a newer build than this one understands. Refuse to guess
    // rather than silently drop fields this code doesn't know about yet —
    // the caller (the storage adapter) treats this as unrecoverable and
    // falls back to a fresh state.
    throw new Error(`stored schemaVersion ${fromVersion} is newer than supported version ${currentVersion}`);
  }

  let migrated = state;
  for (let v = fromVersion + 1; v <= currentVersion; v++) {
    const step = migrationTable[v];
    if (step) {
      migrated = step(migrated);
    }
  }

  return normalizeCollections({ ...migrated, schemaVersion: currentVersion });
}

// The list-shaped collections every list-entity reducer (src/core/
// list-entity.js) expects to be able to spread/index/findIndex into.
// Guaranteeing this once, here — the one place all persisted state passes
// through — means every reducer, selector, and the Safe-to-Spend
// calculation can trust these are always real arrays, even if the raw
// stored value degraded into something else (an object, a string, `null`)
// through hand-editing or a future bug. See Phase 8 QA (docs/QA-REPORT.md).
const ARRAY_COLLECTION_KEYS = ['incomes', 'bills', 'plannedExpenses', 'expenses', 'categoryBudgets', 'incomeReceipts', 'billPayments', 'expenseDrafts', 'debts', 'debtPayments', 'goals'];

function normalizeCollections(state) {
  const normalized = { ...state };
  for (const key of ARRAY_COLLECTION_KEYS) {
    if (!Array.isArray(normalized[key])) normalized[key] = [];
  }
  return normalized;
}


// ---- src/core/storage.js ----
// The storage adapter: the only module allowed to touch localStorage.
// See docs/ARCHITECTURE.md §5 "LocalStorage strategy" for the contract
// this implements — everything else in the app reads/writes persisted
// state through this module, never localStorage directly.
//
// Responsibilities:
//   - Safe JSON serialize/deserialize (never let a parse error crash the
//     app; corrupted data is preserved under a recovery key, not lost).
//   - Run the state through schema migration on load.
//   - Debounce writes so rapid interactions don't hammer localStorage.
//   - A soft size check that warns (via callback) well before the
//     browser's real storage quota.
//
// The `storage` backend (localStorage.getItem/setItem) is passed in
// rather than imported globally, per docs/ARCHITECTURE.md §4 ("no global
// mutable singletons reached via import") — this is also what lets the
// adapter be unit-tested under Node, which has no real localStorage.


const DEFAULT_KEY = 'adhd-planner:v1';
const RECOVERY_KEY_SUFFIX = ':recovery';
const DEFAULT_DEBOUNCE_MS = 300;
// Conservative vs. typical browser localStorage quotas (often 5-10MB per
// origin) — warn well before the user could hit a real QuotaExceededError.
const DEFAULT_SOFT_LIMIT_BYTES = 4 * 1024 * 1024;

/**
 * @param {object} [options]
 * @param {{getItem: Function, setItem: Function, removeItem?: Function}} [options.storage]
 *   Defaults to the global `localStorage` when present (i.e. in a browser).
 * @param {string} [options.key] Root key the whole state tree is stored under.
 * @param {number} [options.debounceMs] Delay before a scheduled save flushes.
 * @param {number} [options.softLimitBytes] Size threshold that triggers onQuotaWarning.
 * @param {(approxBytes: number) => void} [options.onQuotaWarning]
 * @param {(rawValue: string) => void} [options.onCorruptData]
 */
function createStorageAdapter({
  storage = typeof localStorage !== 'undefined' ? localStorage : undefined,
  key = DEFAULT_KEY,
  debounceMs = DEFAULT_DEBOUNCE_MS,
  softLimitBytes = DEFAULT_SOFT_LIMIT_BYTES,
  onQuotaWarning,
  onCorruptData,
} = {}) {
  if (!storage) {
    throw new Error(
      'createStorageAdapter: no storage backend available (pass `storage`, or run where `localStorage` exists)'
    );
  }

  const recoveryKey = `${key}${RECOVERY_KEY_SUFFIX}`;
  let pendingState = null;
  let flushTimer = null;

  /** Reads and migrates the persisted state, or a fresh empty state if there is none / it's unusable. */
  function load() {
    let raw;
    try {
      raw = storage.getItem(key);
    } catch {
      // localStorage unavailable (disabled, some private-browsing modes):
      // degrade to an in-memory-only empty state rather than crash.
      return createEmptyState();
    }

    if (raw == null) {
      return createEmptyState();
    }

    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch {
      recoverCorrupt(raw);
      return createEmptyState();
    }

    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
      recoverCorrupt(raw);
      return createEmptyState();
    }

    try {
      return migrate(parsed);
    } catch {
      // e.g. a schemaVersion newer than this build supports.
      recoverCorrupt(raw);
      return createEmptyState();
    }
  }

  function recoverCorrupt(raw) {
    try {
      storage.setItem(recoveryKey, raw);
    } catch {
      // Best-effort only — if even this write fails, there's nothing more
      // to do; the caller still gets a safe empty state either way.
    }
    onCorruptData?.(raw);
  }

  /** Writes `state` immediately. Prefer `scheduleSave` for interactive use. */
  function save(state) {
    const serialized = JSON.stringify(state);
    storage.setItem(key, serialized);
    checkSize(serialized);
  }

  function checkSize(serialized) {
    if (!onQuotaWarning) return;
    // UTF-16 code units, 2 bytes each — a rough but cheap estimate, not
    // exact byte-accounting.
    const approxBytes = serialized.length * 2;
    if (approxBytes > softLimitBytes) {
      onQuotaWarning(approxBytes);
    }
  }

  /**
   * Queues `state` to be written after `debounceMs` of inactivity,
   * coalescing rapid successive calls into one write. Call `flush()`
   * before the page unloads so the last update isn't lost.
   */
  function scheduleSave(state) {
    pendingState = state;
    if (flushTimer) clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, debounceMs);
  }

  /** Writes any pending scheduled save immediately, if one is queued. */
  function flush() {
    if (flushTimer) {
      clearTimeout(flushTimer);
      flushTimer = null;
    }
    if (pendingState !== null) {
      const toSave = pendingState;
      pendingState = null;
      save(toSave);
    }
  }

  return { load, save, scheduleSave, flush };
}

// ---- src/core/money.js ----
// Money utilities. Every monetary amount in this app is stored as a
// non-negative integer number of cents — never a float — so values users
// need to trust exactly are never subject to floating-point drift (e.g.
// 0.1 + 0.2 !== 0.3 in IEEE 754). See docs/DATA-MODEL.md.

/**
 * Parses a user-entered amount (string or number) into non-negative
 * integer cents. Accepts "2450", "2450.5", "2,450.00", "$1,200". Rejects
 * negative amounts, non-numeric input, and more than 2 fractional digits
 * (rather than silently rounding away precision the user typed).
 * @param {string|number} input
 * @returns {number|null} integer cents, or null if not a valid amount
 */
function parseAmountToCents(input) {
  if (typeof input === 'number') {
    if (!Number.isFinite(input) || input < 0) return null;
    return Math.round(input * 100);
  }
  if (typeof input !== 'string') return null;

  const trimmed = input.trim();
  if (trimmed === '') return null;

  // Strip currency symbols and thousands separators; keep digits/dot/minus
  // so a leading minus can still be detected and rejected explicitly below
  // (rather than silently stripped, which would turn "-5" into "5").
  const cleaned = trimmed.replace(/[^0-9.\-]/g, '');
  if (cleaned === '' || cleaned.startsWith('-')) return null;
  if (!/^\d+(\.\d+)?$/.test(cleaned)) return null;

  const [wholePart, fractionPart = ''] = cleaned.split('.');
  if (fractionPart.length > 2) return null;

  const wholeCents = BigInt(wholePart || '0') * 100n;
  const fractionCents = BigInt(fractionPart.padEnd(2, '0') || '0');
  const totalCents = wholeCents + fractionCents;

  if (totalCents > BigInt(Number.MAX_SAFE_INTEGER)) return null;
  return Number(totalCents);
}

/** @param {*} value @returns {boolean} true if a valid stored amount (non-negative integer cents) */
function isValidAmountCents(value) {
  return Number.isInteger(value) && value >= 0;
}

/**
 * Parses a user-entered balance (string or number) into integer cents,
 * same as parseAmountToCents but permitting a negative result. Only the
 * Current Balance figure uses this — see docs/DATA-MODEL.md "Current
 * Balance model": a balance can legitimately go negative (overdraft-style,
 * or simply having logged more spending than was on hand), and clamping
 * that to $0 would silently misrepresent the user's real position. Every
 * other amount in the app (bills, income, planned expenses, expenses,
 * savings) is a magnitude and must stay non-negative — use
 * parseAmountToCents for those.
 * @param {string|number} input
 * @returns {number|null}
 */
function parseBalanceToCents(input) {
  if (typeof input === 'number') {
    if (!Number.isFinite(input)) return null;
    return Math.round(input * 100);
  }
  if (typeof input !== 'string') return null;

  const trimmed = input.trim();
  if (trimmed === '') return null;

  const isNegative = trimmed.startsWith('-');
  const cleaned = trimmed.replace(/[^0-9.\-]/g, '').replace(/^-/, '');
  if (cleaned === '') return null;
  if (!/^\d+(\.\d+)?$/.test(cleaned)) return null;

  const [wholePart, fractionPart = ''] = cleaned.split('.');
  if (fractionPart.length > 2) return null;

  const wholeCents = BigInt(wholePart || '0') * 100n;
  const fractionCents = BigInt(fractionPart.padEnd(2, '0') || '0');
  const totalCents = wholeCents + fractionCents;

  if (totalCents > BigInt(Number.MAX_SAFE_INTEGER)) return null;
  const magnitude = Number(totalCents);
  return isNegative ? -magnitude : magnitude;
}

/** @param {*} value @returns {boolean} true if a valid stored balance (any-sign integer cents) */
function isValidBalanceCents(value) {
  return Number.isInteger(value);
}

// ISO 4217 codes offered by the currency picker (src/ui/components/
// currency-selector.js) — a deliberately short, common list, not
// exhaustive; adding another is a one-line change here. This is purely a
// *display* preference (docs/DATA-MODEL.md "Settings" — `settings.currency`)
// — every stored amount stays exactly what it always was, one plain
// integer-cents number, with no conversion, no exchange rates, and no
// per-entry currency. Switching currencies only changes the symbol/
// punctuation `formatCents` renders the same number with (see
// `setActiveCurrency` below) — $2,450.00 and €2,450.00 represent the
// identical stored value, deliberately not two different amounts.
const SUPPORTED_CURRENCIES = ['USD', 'EUR', 'GBP', 'JPY', 'CAD', 'AUD'];
const DEFAULT_CURRENCY = 'USD';

// The currency `formatCents` renders amounts in — set once per render
// from the stored `settings.currency` (src/ui/shell.js's `render()`),
// mirroring exactly how the stored theme preference is applied to
// `<html>` once per render rather than threaded as a prop through every
// component that needs it (see base.css's own theme comment). A
// deliberate, narrow exception to this module's otherwise pure-function
// design: `formatCents` is called from roughly a dozen UI files, several
// through nested row-building helpers that don't currently receive
// `state` at all — threading a currency argument through every one of
// them would be a much larger, riskier change for a display-only
// preference than reusing the "set once at the top of a render pass, read
// implicitly for its duration" pattern this app already relies on for
// theme. Safe because every render is fully synchronous, top-to-bottom
// DOM construction (docs/ARCHITECTURE.md) — there is no interleaving that
// could let one render's `formatCents` calls see a different render's
// active currency.
let activeCurrency = DEFAULT_CURRENCY;

/**
 * @param {string} currency an ISO 4217 code, ideally from
 *   `SUPPORTED_CURRENCIES` — anything else (a corrupted stored value, an
 *   unrecognized code) falls back to the default rather than risking a
 *   thrown `Intl.NumberFormat` call blanking the whole dashboard.
 */
function setActiveCurrency(currency) {
  activeCurrency = SUPPORTED_CURRENCIES.includes(currency) ? currency : DEFAULT_CURRENCY;
}

/** @returns {string} the currency `formatCents` is currently rendering amounts in. */
function getActiveCurrency() {
  return activeCurrency;
}

/**
 * The bare symbol for a currency code (e.g. "$", "€", "£", "¥") — used by
 * the currency picker's icon button (src/ui/components/
 * currency-selector.js), which shows the sign itself rather than the
 * 3-letter code. Derived from `Intl.NumberFormat` (`narrowSymbol` —
 * plain "$" rather than e.g. "CA$" for CAD, which `Intl`'s default
 * `symbol` style would disambiguate with) instead of a second hardcoded
 * currency->symbol map, so this and `formatCents` can never disagree
 * about what a given code renders as.
 * @param {string} currency an ISO 4217 code, ideally from
 *   `SUPPORTED_CURRENCIES` — falls back to the default currency's symbol
 *   for anything else, same "never throw" contract as `formatCents`.
 * @returns {string}
 */
function getCurrencySymbol(currency) {
  const code = SUPPORTED_CURRENCIES.includes(currency) ? currency : DEFAULT_CURRENCY;
  try {
    const part = new Intl.NumberFormat('en-US', { style: 'currency', currency: code, currencyDisplay: 'narrowSymbol' })
      .formatToParts(0)
      .find((p) => p.type === 'currency');
    return part?.value ?? code;
  } catch {
    return code;
  }
}

/**
 * @param {number} cents
 * @returns {string} e.g. "$2,450.00" in the active currency (see
 *   `setActiveCurrency`) — locale fixed at `en-US` (thousands/decimal
 *   punctuation, symbol placement) regardless of the browser's own
 *   locale, so output stays deterministic and matches this app's existing
 *   number formatting everywhere else, independent of which currency is
 *   selected. `Intl.NumberFormat` handles each currency's real minor-unit
 *   convention correctly on its own (e.g. JPY has no decimal places) —
 *   this file doesn't hardcode that per currency.
 */
function formatCents(cents) {
  const safe = Number.isFinite(cents) ? cents : 0;
  const rounded = Math.round(safe);
  try {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: activeCurrency }).format(rounded / 100);
  } catch {
    // activeCurrency is only ever set from SUPPORTED_CURRENCIES via
    // setActiveCurrency, so this should be unreachable — kept as a
    // last-resort fallback rather than letting a formatting call throw.
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: DEFAULT_CURRENCY }).format(rounded / 100);
  }
}

/** @param {number} cents @returns {number} plain dollars, e.g. for pre-filling a form input */
function centsToDollarString(cents) {
  return (cents / 100).toFixed(2);
}

// ---- src/ui/components/more-options.js ----
// A "+ More options" progressive-disclosure wrapper (Phase 7 — "is the
// user being asked to make unnecessary decisions?"). Secondary fields
// stay out of the way for the common fast-capture case; editing an
// existing record starts expanded, since there's nothing to hide once
// values are already set.


const FOCUSABLE_TAGS = new Set(['INPUT', 'SELECT', 'TEXTAREA']);

/** Depth-first search for the first focusable field, so opening "+ More
 * options" (or a modal — see src/ui/components/popup.js) via
 * keyboard/click lands focus where the user is about to type next, instead
 * of leaving it stranded on the now-hidden/closed trigger. */
function focusFirstField(container) {
  for (const child of container.children ?? []) {
    if (FOCUSABLE_TAGS.has(child.tagName)) {
      child.focus?.();
      return true;
    }
    if (focusFirstField(child)) return true;
  }
  return false;
}

/**
 * @param {() => HTMLElement[]} buildFields called once per paint to build
 *   the secondary fields — a function, not a static array, so it can
 *   close over live input values if ever needed.
 * @param {{startExpanded?: boolean}} [options]
 * @returns {{ toggle: HTMLElement, details: HTMLElement }} append both to
 *   the form; `toggle` hides itself once expanded.
 */
function renderMoreOptions(buildFields, { startExpanded = false } = {}) {
  let expanded = startExpanded;
  const details = el('div', { class: 'money-form__details' });
  const toggle = el('button', { type: 'button', class: 'btn btn--secondary btn--small money-form__toggle' }, '+ More options');

  function paint() {
    details.innerHTML = '';
    if (expanded) {
      for (const field of buildFields()) details.appendChild(field);
      toggle.hidden = true;
      details.hidden = false;
    } else {
      toggle.hidden = false;
      details.hidden = true;
    }
  }

  toggle.onclick = () => {
    expanded = true;
    paint();
    focusFirstField(details);
  };
  paint();

  return { toggle, details };
}


// ---- src/ui/components/popup.js ----
// A shared popup/modal helper — every "add" form in the app (Quick
// Actions' four buttons, the Safe-to-Spend hero's "+ Add expense") opens
// through this one function, so the open/close/focus/scroll-lock behavior
// only exists once. Built on the modal CSS foundation in
// src/styles/components.css (".modal-backdrop"/".modal", originally laid
// down in Phase 1, first actually used for Quick Actions).


/**
 * @param {object} options
 * @param {string} options.titleId heading id, for the dialog's aria-labelledby
 * @param {string} options.title
 * @param {HTMLElement} options.body usually a `<form>`
 * @param {() => void} options.onClose called on: the header's close
 *   button, clicking the backdrop itself (not a click that started inside
 *   the popup), or Escape while focus is anywhere inside it.
 * @returns {HTMLElement} append this anywhere — it's `position: fixed`,
 *   so it covers the full viewport regardless of where it sits in the DOM
 *   (verified no ancestor in this codebase sets transform/filter/
 *   will-change, which would otherwise break that).
 */
function renderPopup({ titleId, title, body, onClose }) {
  // Background scroll-lock is NOT handled here — see src/ui/shell.js's
  // render(), which derives `document.body.style.overflow` fresh on every
  // render from whether a `.modal-backdrop` is actually present in the
  // DOM. An earlier version locked/restored it right here, capturing
  // "the overflow value to restore" in this closure — which broke the
  // moment a caller's form `onSubmit` closed the popup by calling its own
  // local close() directly (every caller's `onSubmit: (input) => {
  // dispatch(...); close(); }` does exactly this) instead of routing
  // through this function's close — that path never restored the
  // overflow, so submitting *any* popup form left scroll permanently
  // locked. Deriving it from DOM presence instead makes it self-correcting
  // regardless of which of the several ways a popup can close.
  const header = el('div', { class: 'modal__header' }, [el('h2', { id: titleId }, title), iconButton('close', 'Close', onClose)]);
  const modal = el(
    'div',
    { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
    [header, el('div', { class: 'modal__body' }, [body])]
  );
  const backdrop = el('div', { class: 'modal-backdrop' }, [modal]);
  backdrop.onclick = (event) => {
    if (event.target === backdrop) onClose();
  };
  backdrop.onkeydown = (event) => {
    if (event.key === 'Escape') onClose();
  };

  // This whole tree is still detached at this point — the caller's render
  // pass builds it, then attaches it to `document` in one shot afterward
  // (see src/ui/shell.js's `main.appendChild(...)`). Calling `.focus()`
  // on a detached element is a silent no-op in a real browser, so the
  // focus move has to wait until right after that attach actually
  // happens — one animation frame is enough and keeps this framework-free.
  requestAnimationFrame(() => focusFirstField(modal));

  return backdrop;
}


// ---- src/ui/components/single-value-section.js ----

// Which section's "edit" popup (additive mode's `onEditTotal`, or
// `editOnly` mode — see below) is open, if any — transient UI state,
// deliberately outside the store (see docs/ARCHITECTURE.md §4). Holds the
// open section's `id`, not a plain boolean: this component now has two
// simultaneous callers that can each show this popup (Savings,
// Current Balance), and a single shared boolean would let one card's
// popup incorrectly "leak" open on the other the moment both had ever
// been opened in the same session — id-scoping keeps each instance's
// popup independent, same as e.g. inbox-section.js's `convertingDraftId`
// tracking which specific draft is mid-conversion rather than a bare flag.
let editPopupOpenId = null;

/**
 * A small popup form that sets a single money value directly — originally
 * just Savings' "edit total" pencil icon's popup, generalized (still
 * backward-compatible in every default) so `renderSingleValueSection`'s
 * own `editOnly` mode below can reuse the exact same popup-form pattern
 * for Current Balance's pencil instead of duplicating this boilerplate —
 * same reuse precedent as `renderExpenseForm` being shared across
 * multiple callers (docs/ARCHITECTURE.md §7 doesn't restrict this; only
 * reaching into another module's *data* internals is off-limits, not a
 * plain shared UI helper).
 * @param {object} options
 * @param {string} options.title
 * @param {number} options.valueCents
 * @param {(input: string) => number|null} [options.parse] defaults to
 *   non-negative parsing (Savings); pass `parseBalanceToCents` for a value
 *   that can legitimately go negative (Current Balance).
 * @param {string} [options.errorText]
 * @param {string|null} [options.hint] shown under the field if given;
 *   omit (or pass `null`) for none.
 * @param {string} [options.submitLabel] button text — defaults to "Save".
 * @param {boolean} [options.startEmpty] when true the field starts blank
 *   instead of prefilled with `valueCents` — for an "add this amount"
 *   contribution rather than a "correct the total" edit.
 * @param {(cents: number) => void} options.onSave
 */
function renderEditTotalForm({
  title,
  valueCents,
  parse = parseAmountToCents,
  errorText = 'Enter an amount of 0 or more, like 150.00.',
  hint = 'This replaces the total directly — for fixing a mistake or reconciling against a real account, not a regular contribution.',
  submitLabel = 'Save',
  startEmpty = false,
  onSave,
}) {
  const input = el('input', {
    type: 'text',
    inputmode: 'decimal',
    class: 'field__input',
    value: startEmpty ? '' : centsToDollarString(valueCents),
    'aria-label': title,
  });
  const label = el('label', { class: 'field' }, [el('span', { class: 'field__label' }, title), input]);
  const error = el('p', { class: 'field__error', role: 'alert' });

  const form = el('form', { class: 'money-form' }, [
    label,
    error,
    hint ? el('p', { class: 'field__hint' }, hint) : null,
    el('div', { class: 'money-form__buttons' }, [el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, submitLabel)]),
  ].filter(Boolean));

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const cents = parse(input.value);
    if (cents == null) {
      error.textContent = errorText;
      return;
    }
    error.textContent = '';
    onSave(cents);
  });

  return form;
}

/**
 * A card section for a single money figure — Savings (Phase 2 §5) and
 * Current Balance (src/ui/screens/dashboard.js) are the current callers.
 * Current Balance's own history is longer than that sentence suggests: it
 * briefly lived as a hero subtitle, then got its own standalone card
 * (this component), then was folded into the merged "Right now" card
 * (src/ui/components/right-now-section.js) alongside Money in/out, then
 * was split back out into its own standalone card again — this
 * component, unchanged — at the user's later request. See CLAUDE.md
 * "Current status" for the full account. Kept general-purpose, not
 * hardcoded to either caller, precisely because its shape keeps getting
 * reused as the layout evolves.
 * @param {object} options
 * @param {string} options.id used for the heading id and input name
 * @param {string} options.title
 * @param {string} [options.description]
 * @param {number} options.valueCents current stored value
 * @param {(cents: number) => void} options.onSave
 * @param {boolean} [options.allowNegative] for a value that can legitimately go negative
 * @param {string} [options.icon] icon name for the card's section heading
 *   (src/ui/components/icons.js) — defaults to a neutral wallet
 * @param {() => void} [options.requestRender] needed only alongside
 *   `onEditTotal`, to re-render after opening/closing that popup
 * @param {boolean} [options.additive] when true, the form adds `onSave`'s
 *   amount to the existing total instead of replacing it — the field
 *   starts blank ("how much to add," not "what's the new total"), and
 *   copy/button text reflect a contribution rather than a correction. See
 *   `addToSavingsAction` (src/modules/budget/index.js) — the Savings card
 *   uses this.
 * @param {(cents: number) => void} [options.onEditTotal] only meaningful
 *   alongside `additive` — when given, a small pencil icon next to
 *   "Currently saved: $X" opens a popup to set the total directly
 *   (`setSavingsAllocationAction`), for correcting a mistake or
 *   reconciling against a real account, since the card's own form can
 *   only add.
 * @param {boolean} [options.editOnly] when true, skips the inline
 *   field/button form entirely — the card shows only "Currently: $X"
 *   plus a pencil icon that opens a popup (`renderEditTotalForm`) to
 *   change it, the same "no field or Save button visible until you ask
 *   for it" affordance `onEditTotal` gives Savings, but as the *only* way
 *   to edit rather than a secondary one alongside an "add" form. Current
 *   Balance uses this — it was never additive, so there's no separate add
 *   form for a pencil to be an alternative *to*; at the user's request the
 *   inline form was removed outright rather than kept as a redundant
 *   second way to do the same thing. Mutually exclusive with `additive`/
 *   `onEditTotal` in practice (nothing currently combines them, and
 *   `editOnly` takes precedence if it somehow happened).
 * @returns {HTMLElement}
 */
function renderSingleValueSection({ id, title, description, valueCents, onSave, allowNegative = false, icon = 'wallet', additive = false, onEditTotal, editOnly = false, readOnly = false, requestRender }) {
  // `readOnly` (Dashboard summary): the value with no way to change it
  // here — editing lives on the Budget view. Short-circuits everything
  // below.
  if (readOnly) {
    const head = [sectionHeading(icon, title, id)];
    if (description) head.push(el('p', { class: 'section-description' }, description));
    head.push(el('p', { class: 'single-value-form__current' }, `${additive ? 'Currently saved' : 'Currently'}: ${formatCents(valueCents)}`));
    return el('section', { class: 'card card--quiet', 'aria-labelledby': id }, head);
  }

  const parse = allowNegative ? parseBalanceToCents : parseAmountToCents;
  const errorText = allowNegative ? 'Enter a valid amount, like 150.00 or -40.00.' : 'Enter an amount of 0 or more, like 150.00.';

  const currentLine = [el('span', {}, `${additive ? 'Currently saved' : 'Currently'}: ${formatCents(valueCents)}`)];

  const showPencil = editOnly || (additive && onEditTotal);
  let popup = null;
  if (showPencil) {
    const pencilLabel = editOnly ? `Edit ${title.toLowerCase()}` : `Edit ${title.toLowerCase()} total directly`;
    const popupTitle = editOnly ? `Edit ${title.toLowerCase()}` : `Edit ${title.toLowerCase()} total`;
    const saveHandler = editOnly ? onSave : onEditTotal;

    const closeEditPopup = () => {
      editPopupOpenId = null;
      requestRender?.();
    };
    currentLine.push(
      iconButton(
        'edit',
        pencilLabel,
        () => {
          editPopupOpenId = id;
          requestRender?.();
        },
        { tone: 'neutral' }
      )
    );
    if (editPopupOpenId === id) {
      const editForm = renderEditTotalForm({
        title: editOnly ? title : `${title} total`,
        valueCents,
        parse,
        errorText,
        hint: editOnly ? null : undefined, // undefined keeps renderEditTotalForm's own default (additive/Savings) hint text
        onSave: (cents) => {
          saveHandler(cents);
          closeEditPopup();
        },
      });
      popup = renderPopup({ titleId: `${id}-edit-total-heading`, title: popupTitle, body: editForm, onClose: closeEditPopup });
    }
  }

  let form;
  if (editOnly) {
    // No inline field/button at all — the popup above is the only way to
    // change this value (see `editOnly`'s doc comment).
    form = el('p', { class: 'single-value-form__current' }, currentLine);
  } else {
    const field = amountField(additive ? 'Amount to add' : title, { name: id, valueCents: additive ? null : valueCents });
    const error = el('p', { class: 'field__error', role: 'alert' });
    const success = el('p', { class: 'field__success', role: 'status' });

    form = el('form', { class: 'single-value-form' }, [
      el('p', { class: 'single-value-form__current' }, currentLine),
      field,
      error,
      success,
      el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, additive ? '+ Add' : 'Save'),
    ]);

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const cents = parse(field.amountInput.value);
      if (cents == null) {
        error.textContent = errorText;
        return;
      }
      error.textContent = '';
      onSave(cents);
      // The card re-renders with the new "Currently: $X" the moment the
      // store updates (see src/ui/shell.js) — this just confirms the
      // click itself registered, since that re-render replaces this exact
      // element.
      success.textContent = additive ? `Added ${formatCents(cents)}.` : 'Saved.';
    });
  }

  const headChildren = [sectionHeading(icon, title, id)];
  if (description) headChildren.push(el('p', { class: 'section-description' }, description));

  // `.card--quiet` — a side-column "at a glance" figure, not primary
  // content, so it gets the same reduced-visual-weight treatment as its
  // side-column neighbors (the period card, Upcoming Income, Bills Due
  // Soon) instead of the full-weight `.card` styling Categories/Expenses
  // use — see the `.card--quiet` comment in components.css.
  return el('section', { class: 'card card--quiet', 'aria-labelledby': id }, [...headChildren, form, popup].filter(Boolean));
}


// ---- src/modules/budget/actions.js ----
// Action creators for the single-value budget figures: Current Balance,
// Savings allocation (Phase 2 §1, §5; Safety Buffer removed at the user's
// request — see docs/SAFE-TO-SPEND.md). Unlike Incomes/Bills/Planned
// Expenses these aren't lists — one value each.

function setCurrentBalanceAction(amountCents) {
  return { type: 'budget/set', field: 'currentBalanceCents', amountCents };
}

function setSavingsAllocationAction(amountCents) {
  return { type: 'budget/set', field: 'savingsAllocationCents', amountCents };
}

/**
 * Adds to the existing Savings allocation instead of replacing it — the
 * Savings card's own action (src/ui/screens/dashboard.js), so each
 * contribution accumulates rather than overwriting the running total.
 * `setSavingsAllocationAction` still exists for the one place that
 * legitimately wants an absolute value: onboarding's initial target
 * (src/ui/screens/onboarding.js), where there's nothing yet to add to.
 */
function addToSavingsAction(amountCents) {
  return { type: 'budget/add-to-savings', amountCents };
}


// ---- src/modules/budget/selectors.js ----
function getCurrentBalanceCents(state) {
  return state.budget?.currentBalanceCents ?? 0;
}

function getSavingsAllocationCents(state) {
  return state.budget?.savingsAllocationCents ?? 0;
}


// ---- src/modules/budget/reducer.js ----

const FIELDS = ['currentBalanceCents', 'savingsAllocationCents'];

// currentBalanceCents may legitimately be negative (see docs/DATA-MODEL.md
// "Current Balance model") — everything else here is a protected/reserved
// magnitude and must stay non-negative.
const NEGATIVE_ALLOWED_FIELDS = new Set(['currentBalanceCents']);

function createEmptyBudget() {
  return { currentBalanceCents: 0, savingsAllocationCents: 0 };
}

function budgetReducer(budget = createEmptyBudget(), action) {
  switch (action.type) {
    case 'budget/set': {
      if (!FIELDS.includes(action.field)) return budget;
      const isValid = NEGATIVE_ALLOWED_FIELDS.has(action.field)
        ? isValidBalanceCents(action.amountCents)
        : isValidAmountCents(action.amountCents);
      if (!isValid) return budget;
      if (budget[action.field] === action.amountCents) return budget;
      return { ...budget, [action.field]: action.amountCents };
    }
    case 'budget/add-to-savings': {
      if (!isValidAmountCents(action.amountCents)) return budget;
      if (action.amountCents === 0) return budget; // adding nothing is a no-op, not a $0 contribution
      const current = isValidAmountCents(budget.savingsAllocationCents) ? budget.savingsAllocationCents : 0;
      return { ...budget, savingsAllocationCents: current + action.amountCents };
    }
    default:
      return budget;
  }
}


// ---- src/modules/budget/index.js ----
// The Budget module's public interface (Current Balance, Savings
// allocation — Safety Buffer removed at the user's request, see

// ---- src/ui/components/sidebar.js ----
// Left sidebar navigation for the multi-view app. Each item is a distinct
// destination — a hash route (src/ui/router.js), not a scroll anchor.
// The main content area swaps completely between views; the sidebar and
// the header bar are the persistent app shell (composed by
// src/ui/components/app-frame.js).
//
// Desktop: a fixed left rail, collapsible to icons-only (tooltips via
// `title`). Mobile (<1024px): off-canvas, opened as a drawer by the
// header bar's hamburger (src/ui/components/header-bar.js), auto-closing
// on selection. The collapsed / drawer-open flags are ephemeral
// module-level state — the same convention every other UI toggle in this
// app uses (resets on reload); nothing here touches the store or
// localStorage. The active item is driven by the current route, passed
// in as `activeView`.


// id: the route id (src/ui/router.js APP_VIEWS) and the `data-view` hook.
// label/iconName: what's shown. group: the section header it sits under.
const SIDEBAR_ITEMS = [
  { id: 'dashboard', label: 'Dashboard', iconName: 'home', group: 'Main' },
  { id: 'income', label: 'Income', iconName: 'trending-up', group: 'Money' },
  { id: 'expenses', label: 'Expenses', iconName: 'receipt', group: 'Money' },
  { id: 'bills', label: 'Bills', iconName: 'file-text', group: 'Money' },
  { id: 'debts', label: 'Debts', iconName: 'credit-card', group: 'Money' },
  { id: 'goals', label: 'Goals', iconName: 'target', group: 'Planning' },
  { id: 'categories', label: 'Categories', iconName: 'pie-chart', group: 'Planning' },
  { id: 'settings', label: 'Settings', iconName: 'settings', group: 'Other' },
];

// ---- ephemeral view state (see file header) ----
let sidebarCollapsed = false;
let sidebarDrawerOpen = false;
// Which figure's edit popup is open in the footer card ('balance' |
// 'savings' | null) — Current Balance and Savings moved here from the
// former Budget tab (docs/ARCHITECTURE.md, CLAUDE.md "Current status").
let sidebarEditTarget = null;

function isSidebarCollapsed() {
  return sidebarCollapsed;
}
function setSidebarCollapsed(next) {
  sidebarCollapsed = Boolean(next);
}
function isSidebarDrawerOpen() {
  return sidebarDrawerOpen;
}
function setSidebarDrawerOpen(next) {
  sidebarDrawerOpen = Boolean(next);
}

function navButton({ item, activeView, onNavigate }) {
  const isActive = item.id === activeView;
  const btn = el(
    'button',
    {
      type: 'button',
      class: `sidebar__link${isActive ? ' sidebar__link--active' : ''}`,
      'data-view': item.id,
      'aria-label': item.label,
      title: item.label,
      onclick: () => onNavigate(item.id),
    },
    [icon(item.iconName, { size: 18 }), el('span', { class: 'sidebar__label' }, item.label)]
  );
  if (isActive) btn.setAttribute('aria-current', 'page');
  return btn;
}

function navGroup({ name, items, activeView, onNavigate }) {
  return el('div', { class: 'sidebar__group', role: 'group', 'aria-label': name }, [
    el('p', { class: 'sidebar__group-label' }, name),
    ...items.map((item) => navButton({ item, activeView, onNavigate })),
  ]);
}

/**
 * The compact info card at the bottom of the rail — Current Balance and
 * Savings, read-out with a pencil each that opens a small edit popup
 * (`renderEditTotalForm`). Hidden on the collapsed icon rail (CSS). These
 * two used to be full cards on the Budget tab, which is now the Goals tab.
 */
function renderSidebarFooter({ state, requestRender }) {
  const iconBtn = (className, iconName, aria, target) =>
    el(
      'button',
      {
        type: 'button',
        class: className,
        'aria-label': aria,
        title: aria,
        onclick: () => {
          sidebarEditTarget = target;
          requestRender?.();
        },
      },
      [icon(iconName, { size: 14 })]
    );

  const stat = (key, iconName, label, valueCents, extraButtons = []) =>
    el('div', { class: 'sidebar__stat' }, [
      el('span', { class: 'sidebar__stat-label' }, [icon(iconName, { size: 13 }), el('span', {}, label)]),
      el('div', { class: 'sidebar__stat-line' }, [
        el('span', { class: 'sidebar__stat-value' }, formatCents(valueCents)),
        ...extraButtons,
        iconBtn('sidebar__stat-edit', 'edit', `Edit ${label.toLowerCase()}`, key),
      ]),
    ]);

  return el('div', { class: 'sidebar__stats' }, [
    stat('balance', 'wallet', 'Current balance', getCurrentBalanceCents(state)),
    stat('savings', 'target', 'Savings', getSavingsAllocationCents(state), [
      // A real transfer: moving money into savings debits Current Balance
      // (src/main.js `budget/add-to-savings`). The pencil above only
      // corrects the figure, no balance effect. See docs/SAFE-TO-SPEND.md §9.
      iconBtn('sidebar__stat-edit', 'plus', 'Add to savings', 'savings-add'),
    ]),
  ]);
}

function renderSidebarEditPopup({ state, dispatch, requestRender }) {
  if (sidebarEditTarget == null) return null;
  const isBalance = sidebarEditTarget === 'balance';
  const isSavingsAdd = sidebarEditTarget === 'savings-add';
  const close = () => {
    sidebarEditTarget = null;
    requestRender?.();
  };

  let form;
  let popupTitle;
  if (isSavingsAdd) {
    // A contribution — moves money into savings. `budget/add-to-savings`
    // (src/main.js) raises the Savings figure AND debits Current Balance
    // by the same amount, so Safe-to-Spend drops accordingly.
    popupTitle = 'Add to savings';
    form = renderEditTotalForm({
      title: 'Amount to move into savings',
      valueCents: 0,
      startEmpty: true,
      submitLabel: 'Add',
      parse: parseAmountToCents,
      errorText: 'Enter an amount of 0 or more, like 150.00.',
      hint: 'This moves money out of your current balance and into savings — your safe-to-spend drops by this amount.',
      onSave: (cents) => {
        dispatch(addToSavingsAction(cents));
        close();
      },
    });
  } else {
    popupTitle = isBalance ? 'Edit current balance' : 'Edit savings';
    form = renderEditTotalForm({
      title: isBalance ? 'Current balance' : 'Savings',
      valueCents: isBalance ? getCurrentBalanceCents(state) : getSavingsAllocationCents(state),
      parse: isBalance ? parseBalanceToCents : parseAmountToCents,
      errorText: isBalance ? 'Enter a valid amount, like 150.00 or -40.00.' : 'Enter an amount of 0 or more, like 150.00.',
      hint: isBalance ? null : 'This just corrects the recorded figure — it doesn’t move any money, so your balance and safe-to-spend don’t change.',
      onSave: (cents) => {
        dispatch(isBalance ? setCurrentBalanceAction(cents) : setSavingsAllocationAction(cents));
        close();
      },
    });
  }

  return renderPopup({
    titleId: 'sidebar-edit-heading',
    title: popupTitle,
    body: form,
    onClose: close,
  });
}

/**
 * @param {object} options
 * @param {object} options.state used only by the footer card (Current
 *   Balance / Savings read-out + their edit popups)
 * @param {Function} options.dispatch
 * @param {() => void} options.requestRender
 * @param {string} options.activeView the current route id — the item that renders as active
 * @param {() => void} options.onToggleCollapse desktop collapse/expand
 * @param {(viewId: string) => void} options.onNavigate item selected
 * @param {() => void} options.onCloseDrawer mobile drawer dismissed
 * @returns {{ nav: HTMLElement, scrim: HTMLElement, editPopup: HTMLElement|null }}
 *   append all three to the screen root. The scrim + editPopup are
 *   `position: fixed`; the popup is returned separately (not nested in
 *   `nav`) so a transformed mobile drawer can't clip its backdrop.
 */
function renderSidebar({ state, dispatch, requestRender, activeView, onToggleCollapse, onNavigate, onCloseDrawer }) {
  const groups = [];
  const seen = new Set();
  for (const item of SIDEBAR_ITEMS) {
    if (seen.has(item.group)) continue;
    seen.add(item.group);
    groups.push(navGroup({ name: item.group, items: SIDEBAR_ITEMS.filter((x) => x.group === item.group), activeView, onNavigate }));
  }

  const collapseToggle = el(
    'button',
    {
      type: 'button',
      class: 'icon-btn sidebar__toggle',
      'aria-label': sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar',
      'aria-expanded': String(!sidebarCollapsed),
      title: sidebarCollapsed ? 'Expand' : 'Collapse',
      onclick: onToggleCollapse,
    },
    icon(sidebarCollapsed ? 'chevron-right' : 'chevron-left', { size: 18 })
  );

  const closeButton = el(
    'button',
    { type: 'button', class: 'icon-btn sidebar__close', 'aria-label': 'Close navigation', onclick: onCloseDrawer },
    icon('close', { size: 18 })
  );

  const brand = el('div', { class: 'sidebar__brand' }, [renderBrandMark()]);

  const nav = el(
    'nav',
    { class: 'sidebar', id: 'app-sidebar', 'aria-label': 'Primary' },
    [
      el('div', { class: 'sidebar__top' }, [brand, collapseToggle, closeButton]),
      el('div', { class: 'sidebar__nav' }, groups),
      renderSidebarFooter({ state, requestRender }),
    ]
  );

  // Escape closes the drawer when focus is inside it (mobile). Harmless
  // on desktop, where the sidebar is always open.
  nav.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && sidebarDrawerOpen) onCloseDrawer();
  });

  const scrim = el('div', { class: 'sidebar-scrim', 'aria-hidden': 'true', onclick: onCloseDrawer });
  const editPopup = renderSidebarEditPopup({ state, dispatch, requestRender });

  return { nav, scrim, editPopup };
}


// ---- src/ui/components/period-selector.js ----
// The header bar's global period selector — the single source of truth
// for every period-scoped card (This Period, Expenses). Deliberately NOT
// read by Safe-to-Spend or Current Balance, which are always "right now"
// snapshots (see docs/SAFE-TO-SPEND.md and src/ui/components/
// safe-to-spend-hero.js). The selected period itself is owned by
// src/ui/screens/dashboard.js (the one place that already threads shared
// values down to every card that needs them) and passed in here as a
// controlled `{period, from, to}` + `onChange` — this file only owns
// whether its own dropdown panel is open, which nothing else needs to
// know about.


const GLOBAL_PERIODS = ['week', 'month', 'lastMonth', 'all', 'custom'];
const PERIOD_LABEL = { week: 'This week', month: 'This month', lastMonth: 'Last month', all: 'All time', custom: 'Custom range' };

/**
 * The human label for a selected period — the same text this component
 * already shows in its own toggle button/dropdown, exported so other
 * cards that read the header bar's global period filter (e.g. the "Right
 * now" card, src/ui/components/right-now-section.js, and the Expenses
 * view's summary card) can title themselves with it instead of a static
 * label, without duplicating this mapping. Accepts either the full
 * `{period, from, to}` value object or a bare period string.
 * @param {{period: string}|string} value
 * @returns {string}
 */
function getPeriodLabel(value) {
  const key = typeof value === 'string' ? value : value?.period;
  return PERIOD_LABEL[key] ?? 'This month';
}

// Whether the dropdown panel is open — transient UI state, deliberately
// outside the store (see docs/ARCHITECTURE.md §4), same convention as
// every other popup/toggle in this app.
let panelOpen = false;

/**
 * @param {object} options
 * @param {{period: string, from: string|null, to: string|null}} options.value
 * @param {(next: {period: string, from: string|null, to: string|null}) => void} options.onChange
 * @param {() => void} [options.requestRender]
 */
function renderPeriodSelector({ value, onChange, requestRender }) {
  const toggle = iconButton('calendar', `Filter by period: ${getPeriodLabel(value)}`, () => {
    panelOpen = !panelOpen;
    requestRender?.();
  });
  toggle.classList.add('period-selector__toggle');

  const wrapper = el('div', { class: 'period-selector' }, [toggle]);
  if (!panelOpen) return wrapper;

  const close = () => {
    panelOpen = false;
    requestRender?.();
  };
  const choose = (period) => {
    onChange(period === 'custom' ? { period, from: value.from, to: value.to } : { period, from: null, to: null });
    if (period !== 'custom') close();
    else requestRender?.();
  };

  const options = el(
    'div',
    { class: 'period-selector__options', role: 'group', 'aria-label': 'Select a time period' },
    GLOBAL_PERIODS.map((period) =>
      el(
        'button',
        {
          type: 'button',
          class: `period-selector__option${period === value.period ? ' period-selector__option--active' : ''}`,
          onclick: () => choose(period),
        },
        PERIOD_LABEL[period]
      )
    )
  );

  const children = [options];
  if (value.period === 'custom') {
    const fromInput = el('input', {
      type: 'date',
      class: 'field__input period-selector__date',
      'aria-label': 'From date',
      value: value.from || '',
      onchange: (event) => onChange({ period: 'custom', from: event.target.value || null, to: value.to }),
    });
    const toInput = el('input', {
      type: 'date',
      class: 'field__input period-selector__date',
      'aria-label': 'To date',
      value: value.to || '',
      onchange: (event) => onChange({ period: 'custom', from: value.from, to: event.target.value || null }),
    });
    children.push(el('div', { class: 'period-selector__custom-range' }, [fromInput, el('span', {}, 'to'), toInput]));
  }

  // Same sibling scrim+panel structure as src/ui/components/popup.js (a
  // transparent full-page click-catcher behind an anchored panel, instead
  // of popup.js's centered dark backdrop) — closes on a click anywhere
  // outside the panel, or Escape, without a raw `document`-level listener
  // that would outlive this render pass.
  const panel = el('div', { class: 'period-selector__panel', role: 'dialog', 'aria-label': 'Period filter' }, children);
  const scrim = el('div', { class: 'period-selector__scrim' }, [panel]);
  scrim.onclick = (event) => {
    if (event.target === scrim) close();
  };
  scrim.onkeydown = (event) => {
    if (event.key === 'Escape') close();
  };

  wrapper.appendChild(scrim);
  return wrapper;
}

// ---- src/modules/settings/reducer.js ----

// Settings is one of the few slices that predates any feature module
// (docs/DATA-MODEL.md "Settings") but never had its own reducer — every
// field was either a Phase 0 default or (displayName, for a long while)
// never actually set anywhere. Phase 7's onboarding flow is what first
// needed to mutate it; onboarding's "Your name" step is what finally set
// displayName for the first time, later still.
function settingsReducer(settings = {}, action) {
  switch (action.type) {
    case 'settings/complete-onboarding': {
      if (settings.onboardingCompletedAt) return settings; // already completed — no-op
      return { ...settings, onboardingCompletedAt: action.now };
    }
    case 'settings/set-theme': {
      if (!['light', 'dark', 'system'].includes(action.theme)) return settings; // ignore an invalid value rather than storing garbage
      return { ...settings, theme: action.theme };
    }
    case 'settings/set-display-name': {
      const name = typeof action.name === 'string' ? action.name.trim() : '';
      return { ...settings, displayName: name || null };
    }
    case 'settings/set-currency': {
      if (!SUPPORTED_CURRENCIES.includes(action.currency)) return settings; // ignore an invalid/unsupported code rather than storing garbage
      return { ...settings, currency: action.currency };
    }
    default:
      return settings;
  }
}

// ---- src/ui/components/theme-toggle.js ----
// A small icon button in the header bar for an explicit Light/Dark
// preference — wires up the `settings.theme` field (src/modules/settings/)
// that already existed but was never read/written by anything before this
// (see CLAUDE.md "Current status"). No stored preference ('system', the
// default) means "keep following the OS," exactly as before this existed.


/**
 * The theme actually in effect right now — the explicit `settings.theme`
 * choice if there is one, otherwise the OS's own `prefers-color-scheme`.
 * @param {object} state
 * @returns {'light'|'dark'}
 */
function getEffectiveTheme(state) {
  const stored = getTheme(state);
  if (stored === 'light' || stored === 'dark') return stored;
  return typeof window !== 'undefined' && window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

/**
 * @param {object} options
 * @param {object} options.state
 * @param {Function} options.dispatch
 */
function renderThemeToggle({ state, dispatch }) {
  const effective = getEffectiveTheme(state);
  // The icon shown is the mode a click switches *to* — a moon while
  // currently light (tap for dark), a sun while currently dark (tap for
  // light) — the common convention for this control.
  const nextTheme = effective === 'dark' ? 'light' : 'dark';
  const icon = effective === 'dark' ? 'sun' : 'moon';
  const label = effective === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';

  return iconButton(icon, label, () => dispatch(setThemeAction(nextTheme)), { tone: 'neutral' });
}

// ---- src/core/id.js ----
// Client-side unique id generation. See docs/DATA-MODEL.md §7 — timestamp
// + random suffix is sufficient uniqueness for a single-user, single-device
// app; no UUID library dependency needed.
//
// A monotonic counter is layered on top of the timestamp so uniqueness is
// guaranteed even across many synchronous calls within the same
// millisecond, rather than relying on Math.random() alone to avoid
// collisions.

let lastTimestamp = 0;
let callsAtLastTimestamp = 0;

/**
 * @param {string} [prefix] Short entity-type prefix, e.g. 't' for Task,
 *   'g' for Goal. Omit for a bare id.
 * @returns {string}
 */
function createId(prefix = '') {
  const timestamp = Date.now();
  if (timestamp === lastTimestamp) {
    callsAtLastTimestamp += 1;
  } else {
    lastTimestamp = timestamp;
    callsAtLastTimestamp = 0;
  }

  const random = Math.random().toString(36).slice(2, 8);
  const sequence = callsAtLastTimestamp > 0 ? `-${callsAtLastTimestamp.toString(36)}` : '';
  const base = `${timestamp.toString(36)}${sequence}_${random}`;

  return prefix ? `${prefix}_${base}` : base;
}

// ---- src/core/list-entity.js ----
// A small factory for the common "flat list of id-keyed entities with
// create/update/delete/toggle" reducer shape shared by several budget
// modules (Income, Bills, Planned Expenses). Not product-specific — lives
// in /core because it's generic reducer-building logic, same spirit as
// src/core/store.js. See docs/ARCHITECTURE.md §4 (reducers must return the
// same array reference for a no-op) and §7 (module boundaries).

/**
 * @param {object} options
 * @param {string} options.actionPrefix e.g. 'incomes' — actions are
 *   `${actionPrefix}/create|update|delete|toggle`.
 * @param {string} options.entityKey the property on the create action
 *   holding the candidate entity, e.g. 'income'.
 * @param {(candidate: object) => object|null} options.validateNew returns
 *   a cleaned entity to accept, or null to reject (reducer no-op).
 * @param {(changes: object) => object} options.sanitizeChanges whitelists/
 *   validates an update action's `changes`, dropping anything invalid.
 */
function createListReducer({ actionPrefix, entityKey, validateNew, sanitizeChanges }) {
  return function listReducer(items = [], action) {
    switch (action.type) {
      case `${actionPrefix}/create`: {
        const entity = validateNew(action[entityKey]);
        if (!entity) return items;
        return [...items, entity];
      }

      case `${actionPrefix}/update`: {
        const index = items.findIndex((item) => item.id === action.id);
        if (index === -1) return items;
        const changes = sanitizeChanges(action.changes);
        if (Object.keys(changes).length === 0) return items;
        const next = items.slice();
        next[index] = { ...items[index], ...changes, updatedAt: action.now };
        return next;
      }

      case `${actionPrefix}/delete`: {
        const index = items.findIndex((item) => item.id === action.id);
        if (index === -1) return items;
        return items.filter((item) => item.id !== action.id);
      }

      case `${actionPrefix}/toggle`: {
        const index = items.findIndex((item) => item.id === action.id);
        if (index === -1) return items;
        const current = items[index];
        const next = items.slice();
        next[index] = { ...current, [action.field]: !current[action.field], updatedAt: action.now };
        return next;
      }

      default:
        return items;
    }
  };
}

function renderCaptureForm({ dispatch, requestRender }) {
  const input = el('input', {
    type: 'text',
    name: 'text',
    class: 'field__input',
    placeholder: "What's on your mind?",
    autocomplete: 'off',
  });
  const label = el('label', { class: 'field' }, [el('span', { class: 'field__label' }, 'Note'), input]);

  const form = el('form', { class: 'money-form' }, [
    label,
    el('div', { class: 'money-form__buttons' }, [el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, 'Save')]),
  ]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return; // nothing typed — quietly do nothing, no error, no confirmation step either way
    dispatch(createExpenseDraftAction({ text }, { now: new Date() }));

  });

  return form;
}
