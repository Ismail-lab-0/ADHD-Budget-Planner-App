// ---- src/modules/dashboard/index.js ----
// The Dashboard module: composition/selection logic for what the
// dashboard displays, as distinct from the Safe-to-Spend *arithmetic*
// (src/modules/safe-to-spend/), which this module never recomputes or
// duplicates — see docs/ARCHITECTURE.md §7 ("the Dashboard module is the
// only module allowed to depend on many other modules' selectors at
// once"). This file only decides *what to list* and *in what order*;
// every dollar figure the dashboard shows comes from
// `getSafeToSpend(state)` directly.


const DEFAULT_LIMIT = 5;

/**
 * The most relevant upcoming commitments (active, unpaid bills + planned
 * expenses) for a short "at a glance" list — not a full ledger. Dated
 * items sort soonest-first; undated items sort last. See Phase 4 §
 * "Upcoming Commitments" — "do not display a giant transaction table."
 *
 * @param {object} state
 * @param {{limit?: number}} [options]
 * @returns {{items: Array<{id: string, kind: 'bill'|'plannedExpense', name: string, amountCents: number, date: string|null}>, remainingCount: number}}
 */
function getUpcomingCommitments(state, { limit = DEFAULT_LIMIT } = {}) {
  const relevantBills = getAllBills(state)
    .filter((bill) => bill.active && !bill.paid)
    .map((bill) => ({ id: bill.id, kind: 'bill', name: bill.name, amountCents: bill.amountCents, date: bill.dueDate ?? null }));

  const relevantPlannedExpenses = getAllPlannedExpenses(state).map((expense) => ({
    id: expense.id,
    kind: 'plannedExpense',
    name: expense.name,
    amountCents: expense.amountCents,
    date: expense.plannedDate ?? null,
  }));

  const combined = [...relevantBills, ...relevantPlannedExpenses].sort((a, b) => {
    if (a.date && b.date) return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    if (a.date && !b.date) return -1;
    if (!a.date && b.date) return 1;
    return 0;
  });

  return {
    items: combined.slice(0, limit),
    remainingCount: Math.max(combined.length - limit, 0),
  };
}

/**
 * The nearest active, unpaid bills, soonest-due first (undated last) — the
 * subset of `getUpcomingCommitments` that's bills only, for a dedicated
 * "Bills due soon" highlight. Same sort convention, no money arithmetic.
 * @param {object} state
 * @param {{limit?: number}} [options]
 * @returns {{items: Array<{id: string, name: string, amountCents: number, date: string|null}>, totalCount: number}}
 */
function getUpcomingBills(state, { limit = 3 } = {}) {
  const bills = getAllBills(state)
    .filter((bill) => bill.active && !bill.paid)
    .map((bill) => ({ id: bill.id, name: bill.name, amountCents: bill.amountCents, date: bill.dueDate ?? null }))
    .sort((a, b) => {
      if (a.date && b.date) return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      if (a.date && !b.date) return -1;
      if (!a.date && b.date) return 1;
      return 0;
    });

  return { items: bills.slice(0, limit), totalCount: bills.length };
}

/**
 * Total amount currently owed across every active, unpaid bill — the
 * dollar-amount counterpart to `getUpcomingBills`'s `totalCount`. (Kept
 * available; the summary-strip tile that first used it was removed in the
 * reference-based dashboard redesign — see CLAUDE.md.)
 * Same active-and-unpaid filter as `getUpcomingBills`, but unbounded (no
 * `limit`, since a sum needs every matching bill, not just the nearest
 * few) and with no due-date horizon applied — unlike `getSafeToSpend`'s
 * own `upcomingBillsCents` (src/modules/safe-to-spend/calculation.js),
 * which only counts bills due before the next payday, this is every bill
 * currently unpaid, matching what "Bills due" (the neighboring count
 * tile) already means. Skips a corrupted `amountCents` rather than
 * letting one bad value NaN-poison the total, same defensive pattern as
 * `getExpensesTotalCents`.
 * @param {object} state
 * @returns {number}
 */
function getUpcomingBillsTotalCents(state) {
  let totalCents = 0;
  for (const bill of getAllBills(state)) {
    if (!bill || !bill.active || bill.paid) continue;
    if (!isValidAmountCents(bill.amountCents)) continue;
    totalCents += bill.amountCents;
  }
  return totalCents;
}

/**
 * The nearest not-yet-received incomes, soonest-due first — the "Upcoming
 * income" card's shortlist (src/ui/components/upcoming-income.js), same
 * shape/convention as `getUpcomingBills`. Not period-scoped — like Bills
 * due soon, this is always "what's next," regardless of the header bar's
 * global period selector.
 * @param {object} state
 * @param {{limit?: number}} [options]
 * @returns {{items: Array<{id: string, name: string, amountCents: number, date: string|null, frequency: string}>, totalCount: number}}
 */
function getUpcomingIncome(state, { limit = 3 } = {}) {
  const incomes = getUnreceivedIncomes(state)
    .map((income) => ({ id: income.id, name: income.name, amountCents: income.amountCents, date: income.nextDate ?? null, frequency: income.frequency }))
    .sort((a, b) => {
      if (a.date && b.date) return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      if (a.date && !b.date) return -1;
      if (!a.date && b.date) return 1;
      return 0;
    });

  return { items: incomes.slice(0, limit), totalCount: incomes.length };
}

/**
 * The header bar's global period selector feeds every period-scoped card
 * (This Period, Expenses) through this one function — see
 * docs/ARCHITECTURE.md and src/ui/screens/dashboard.js. Deliberately never
 * used by Safe-to-Spend or Current Balance, which are always "right now"
 * snapshots regardless of the selected period.
 *
 * Both figures are sums of a real, dated, historical log — never a
 * projection of what's *scheduled* — so both work identically for any
 * period, bounded or not, with no special-casing between them:
 * - `moneyInCents`: every `IncomeReceipt` (`docs/DATA-MODEL.md`) whose
 *   date falls in range — created automatically each time an Income is
 *   confirmed received ("Mark received"). An Income that's merely
 *   *upcoming* (scheduled but not yet confirmed) never counts here — see
 *   "Upcoming income" (`getUpcomingIncome` below) for that, a
 *   deliberately separate, non-period-scoped concept.
 * - `moneyOutCents`: every logged `Expense` *plus* every `BillPayment`
 *   whose date falls in range — created automatically each time a Bill is
 *   confirmed paid ("Mark paid"). A Bill that's merely *due* in the
 *   period never counts here either — see `billsDueCount` below for that.
 *
 * This used to differ: bounded periods projected from each income's
 * `nextDate`/`frequency` (`getIncomeOccurrencesInRange`) rather than
 * reading confirmed receipts, and bills never contributed to "Money out"
 * at all regardless of paid status. Both were real reported points of
 * confusion — an amount showing as "in"/"out" before it had actually
 * happened. `getIncomeOccurrencesInRange` is kept, unused by this file
 * now, in case a *distinct*, separately-labeled "projected" view is ever
 * wanted later (see its own doc comment).
 *
 * @param {object} state
 * @param {{startDateKey?: string|null, endDateKey?: string|null, now?: Date}} [options]
 * @returns {{moneyInCents: number, moneyOutCents: number, billsDueCount: number}}
 */
function getPeriodSummary(state, { startDateKey = null, endDateKey = null, now = new Date() } = {}) {
  const periodExpenses = getExpensesForPeriod(state, { period: 'custom', from: startDateKey, to: endDateKey, now });
  const periodPayments = getBillPaymentsForPeriod(state, { startDateKey, endDateKey });
  const moneyOutCents = getExpensesTotalCents(periodExpenses) + getBillPaymentsTotalCents(periodPayments);

  const periodReceipts = getIncomeReceiptsForPeriod(state, { startDateKey, endDateKey });
  const moneyInCents = getIncomeReceiptsTotalCents(periodReceipts);

  const billsDueCount = getAllBills(state).filter((bill) => {
    if (!bill || !bill.active || bill.paid) return false;
    if (!bill.dueDate) return true; // no date at all — conservatively always counts, same convention as safe-to-spend/calculation.js
    const dueKey = getCurrentBillDueDate(bill.dueDate, bill.recurrence, now);
    if (dueKey == null) return false;
    if (startDateKey != null && dueKey < startDateKey) return false;
    if (endDateKey != null && dueKey > endDateKey) return false;
    return true;
  }).length;

  return { moneyInCents, moneyOutCents, billsDueCount };
}

/**
 * Everything the Safe-to-Spend hero's "How is this worked out?" panel
 * needs, as one object — the canonical `getSafeToSpend` result plus a
 * `period` block of grouped figures the panel shows row by row. **This
 * module composes; it does not re-derive the Safe-to-Spend arithmetic**
 * (docs/ARCHITECTURE.md §7, CLAUDE.md) — every figure below is either
 * straight off `getSafeToSpend` or a plain sum of a real dated log
 * (`Expense` / `BillPayment` / `IncomeReceipt`), the same logs
 * `getPeriodSummary` already reads.
 *
 * The panel renders (see src/ui/components/safe-to-spend-hero.js):
 *
 *   In checking                         inCheckingCents
 *   + Arrived after that balance        arrivedAfterBalanceCents
 *   − Bills still to land               result.upcomingBillsCents
 *   − Paid and spent after that balance paidAndSpentAfterBalanceCents
 *   − Already set aside                 setAsideCents
 *   ───────────────────────────────
 *   Safe until payday                   result.safeToSpendCents
 *
 * `inCheckingCents` is `currentBalanceCents` with this month's logged
 * balance movements added back (`+ spent + billsPaid − incomeReceived`),
 * so the flow reconciles **exactly, by construction**:
 *
 *   inChecking + arrived − billsStillToLand − paidAndSpent − setAside
 *     === currentBalance − upcomingBills − plannedExpenses − goalsSaved
 *     === netAfterCommittedCents   (then floored at 0 → safeToSpendCents, §10)
 *
 * Anything else that moved the balance this month with no dated log — a
 * savings transfer (`budget/add-to-savings`), a manual balance edit — is
 * absorbed into `inCheckingCents`.
 *
 * Grouping: `paidAndSpentAfterBalanceCents` = this month's `Expense`s
 * (which already include debt-payment expenses, counted once) + this
 * month's `BillPayment`s. `setAsideCents` = `plannedExpensesCents +
 * goalsSavedCents` (NOT `upcomingBillsCents` — that's its own
 * "Bills still to land" row).
 *
 * @param {object} state
 * @param {{now?: Date}} [options]
 * @returns {ReturnType<typeof getSafeToSpend> & {period: {inCheckingCents: number, arrivedAfterBalanceCents: number, paidAndSpentAfterBalanceCents: number, setAsideCents: number}}}
 */
function getSafeToSpendBreakdown(state, { now = new Date() } = {}) {
  const result = getSafeToSpend(state, { now });

  const range = resolvePeriodRange('month', { now }) ?? {};
  const startDateKey = range.startDateKey ?? null;
  const endDateKey = range.endDateKey ?? null;

  const spentThisMonthCents = getExpensesTotalCents(
    getExpensesForPeriod(state, { period: 'custom', from: startDateKey, to: endDateKey, now })
  );
  const billsPaidThisMonthCents = getBillPaymentsTotalCents(getBillPaymentsForPeriod(state, { startDateKey, endDateKey }));
  const incomeReceivedThisMonthCents = getIncomeReceiptsTotalCents(getIncomeReceiptsForPeriod(state, { startDateKey, endDateKey }));

  const inCheckingCents =
    result.currentBalanceCents + spentThisMonthCents + billsPaidThisMonthCents - incomeReceivedThisMonthCents;

  return {
    ...result,
    period: {
      inCheckingCents,
      arrivedAfterBalanceCents: incomeReceivedThisMonthCents,
      paidAndSpentAfterBalanceCents: spentThisMonthCents + billsPaidThisMonthCents,
      setAsideCents: result.plannedExpensesCents + result.goalsSavedCents,
    },
  };
}

/**
 * Money in vs money out for each calendar month of `now`'s year — the
 * Dashboard's "Overview" chart. Composes `getPeriodSummary` per month, so
 * "in" is confirmed `IncomeReceipt`s and "out" is `Expense`s +
 * `BillPayment`s, exactly as the rest of the app defines them. Months
 * with no activity are still returned (a zero bar reads as a quiet
 * month), including months later in the year than today.
 * @param {object} state
 * @param {{now?: Date}} [options]
 * @returns {Array<{key: string, label: string, inCents: number, outCents: number}>}
 */
function getMonthlyInVsOut(state, { now = new Date() } = {}) {
  const year = now.getFullYear();
  const monthName = new Intl.DateTimeFormat('en-US', { month: 'short' });
  const rows = [];
  for (let month = 0; month < 12; month++) {
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const summary = getPeriodSummary(state, { startDateKey: getLocalDateKey(first), endDateKey: getLocalDateKey(last), now });
    rows.push({ key: `${year}-${String(month + 1).padStart(2, '0')}`, label: monthName.format(first), inCents: summary.moneyInCents, outCents: summary.moneyOutCents });
  }
  return rows;
}

/**
 * This calendar month's logged spending vs last month's, with the percent
 * change — the delta chip on the Dashboard's "Total Expenses" stat card.
 * `Expense` records only (a debt payment is already one). `deltaPct` is
 * `null` when last month had no spending (no meaningful base).
 * @param {object} state
 * @param {{now?: Date}} [options]
 * @returns {{thisMonthCents: number, lastMonthCents: number, deltaPct: number|null}}
 */
function getExpensesMonthOverMonth(state, { now = new Date() } = {}) {
  const total = (period) => {
    const range = resolvePeriodRange(period, { now });
    return getExpensesForPeriod(state, { period: 'custom', from: range?.startDateKey ?? null, to: range?.endDateKey ?? null, now }).reduce(
      (sum, expense) => sum + (isValidAmountCents(expense?.amountCents) ? expense.amountCents : 0),
      0
    );
  };
  const thisMonthCents = total('month');
  const lastMonthCents = total('lastMonth');
  const deltaPct = lastMonthCents > 0 ? ((thisMonthCents - lastMonthCents) / lastMonthCents) * 100 : null;
  return { thisMonthCents, lastMonthCents, deltaPct };
}


// ---- src/modules/debts/actions.js ----
// Action creators for the Debts module. Non-deterministic values (id,
// timestamps) are generated here, at dispatch time, so the reducer stays
// pure. See src/modules/bills/actions.js for the same convention.


/**
 * @param {{name: string, originalBalanceCents: number, currentBalanceCents: number, minimumPaymentCents: number, dueDate: number, interestRate?: number|null, paymentFrequency?: string}} input
 * @param {{now?: Date}} [options]
 */
function createDebtAction(input, { now = new Date() } = {}) {
  const timestamp = now.toISOString();
  return {
    type: 'debts/create',
    debt: {
      id: createId('d'),
      name: input?.name ?? '',
      originalBalanceCents: input?.originalBalanceCents,
      currentBalanceCents: input?.currentBalanceCents,
      minimumPaymentCents: input?.minimumPaymentCents,
      dueDate: input?.dueDate,
      interestRate: input?.interestRate ?? null,
      paymentFrequency: input?.paymentFrequency || 'monthly',
      createdAt: timestamp,
      updatedAt: timestamp,
    },
  };
}

function updateDebtAction(id, changes, { now = new Date() } = {}) {
  return { type: 'debts/update', id, changes, now: now.toISOString() };
}

function deleteDebtAction(id) {
  return { type: 'debts/delete', id };
}

/**
 * Records a payment against a debt: reduces its `currentBalanceCents`
 * (clamped at 0 — see reducer.js), logs a linked `Expense` so the money
 * is reflected in the expense history and Current Balance / Safe-to-Spend
 * exactly once (src/modules/debts/payment-effect.js, docs/DATA-MODEL.md
 * §3a / SAFE-TO-SPEND.md §3c), and appends a `DebtPayment` record. All in
 * one atomic state transition, applied by src/main.js's rootReducer.
 * @param {string} debtId
 * @param {{amountCents: number, date?: string, note?: string|null}} input
 * @param {{now?: Date}} [options]
 */
function recordDebtPaymentAction(debtId, input, { now = new Date() } = {}) {
  return {
    type: 'debts/record-payment',
    debtId,
    amountCents: input?.amountCents,
    date: input?.date || getLocalDateKey(now),
    note: input?.note?.trim() || null,
    now: now.toISOString(),
  };
}


// ---- src/modules/debts/selectors.js ----
// Selectors for the Debts module — all pure, DOM-free, derived fresh from
// state every read (never stored), same principle as Category Budgets'
// monthly figures and Safe-to-Spend itself (docs/DATA-MODEL.md §4).
// Nothing here feeds the Safe-to-Spend arithmetic — see
// docs/SAFE-TO-SPEND.md §3c.


function getAllDebts(state) {
  const value = state?.debts;
  return Array.isArray(value) ? value : [];
}

function getAllDebtPayments(state) {
  const value = state?.debtPayments;
  return Array.isArray(value) ? value : [];
}

/**
 * Total still owed across every debt — the sum of current balances.
 * Skips a corrupted `currentBalanceCents` rather than letting one bad
 * value NaN-poison the total, same defensive pattern as every other
 * `*TotalCents` selector in this codebase.
 * @param {object} state
 * @returns {number}
 */
function getTotalDebtCents(state) {
  let totalCents = 0;
  for (const debt of getAllDebts(state)) {
    if (!debt || !isValidAmountCents(debt.currentBalanceCents)) continue;
    totalCents += debt.currentBalanceCents;
  }
  return totalCents;
}

/**
 * Payoff progress for one debt: how much has been paid down, as an amount
 * and a clamped 0–100 percentage, plus whether it's fully cleared.
 * `(originalBalance - currentBalance) / originalBalance`, clamped — see
 * docs/PRODUCT.md §14.
 * @param {{originalBalanceCents: number, currentBalanceCents: number}} debt
 * @returns {{paidCents: number, percentPaid: number, isPaidOff: boolean}}
 */
function getDebtProgress(debt) {
  const original = isValidAmountCents(debt?.originalBalanceCents) ? debt.originalBalanceCents : 0;
  const current = isValidAmountCents(debt?.currentBalanceCents) ? debt.currentBalanceCents : 0;
  const paidCents = Math.max(0, original - current);
  const percentPaid = original > 0 ? Math.min(100, Math.max(0, (paidCents / original) * 100)) : current <= 0 ? 100 : 0;
  return { paidCents, percentPaid, isPaidOff: current <= 0 };
}

/**
 * The next calendar date this debt's payment is due, as "YYYY-MM-DD" —
 * the next occurrence of its day-of-month (`debt.dueDate`, 1–31) on or
 * after today. Clamped to the last day of a short month (e.g. a "due on
 * the 31st" debt lands on Feb 28). Debt payments are treated as
 * monthly-recurring for scheduling purposes regardless of
 * `paymentFrequency` (which only affects the payoff estimate) — a
 * deliberate simplification, see docs/DATA-MODEL.md "Debt".
 * @param {{dueDate: number}} debt
 * @param {Date} [now]
 * @returns {string|null}
 */
function getNextDebtDueDateKey(debt, now = new Date()) {
  const day = debt?.dueDate;
  if (!Number.isInteger(day) || day < 1 || day > 31) return null;
  const year = now.getFullYear();
  const month = now.getMonth();
  const lastDayThisMonth = new Date(year, month + 1, 0).getDate();
  let candidate = new Date(year, month, Math.min(day, lastDayThisMonth));
  if (getLocalDateKey(candidate) < getLocalDateKey(now)) {
    const lastDayNextMonth = new Date(year, month + 2, 0).getDate();
    candidate = new Date(year, month + 1, Math.min(day, lastDayNextMonth));
  }
  return getLocalDateKey(candidate);
}

/**
 * True if a payment for this debt has already been recorded in `now`'s
 * calendar month — used to hide a debt from "Bills due soon" once it's
 * been paid for the current period (docs/PRODUCT.md §8 "Avoid
 * duplicates"). Derived from the `DebtPayment` log, same "derived, not
 * stored" approach as Category Budgets' "spent this month".
 * @param {object} state
 * @param {string} debtId
 * @param {Date} [now]
 */
function hasDebtPaymentInMonth(state, debtId, now = new Date()) {
  const monthKey = getLocalDateKey(now).slice(0, 7);
  return getAllDebtPayments(state).some((payment) => payment?.debtId === debtId && typeof payment?.date === 'string' && payment.date.startsWith(monthKey));
}

/**
 * `DebtPayment` records whose `date` falls within `[startDateKey,
 * endDateKey]` (either bound optional) — the read-only counterpart to
 * `getBillPaymentsForPeriod`, available for a future period-scoped view.
 * Not currently wired into `getPeriodSummary` (a debt payment is already
 * a real `Expense`, so it's counted in "Money out" through that — adding
 * it here too would double-count).
 * @param {object} state
 * @param {{startDateKey?: string|null, endDateKey?: string|null}} [options]
 */
function getDebtPaymentsForPeriod(state, { startDateKey = null, endDateKey = null } = {}) {
  return getAllDebtPayments(state).filter((payment) => {
    if (!payment?.date) return false;
    if (startDateKey && payment.date < startDateKey) return false;
    if (endDateKey && payment.date > endDateKey) return false;
    return true;
  });
}

/** `minimumPaymentCents` normalized to a per-month figure using `paymentFrequency`. */
function normalizedMonthlyPaymentCents(debt) {
  const payment = isValidAmountCents(debt?.minimumPaymentCents) ? debt.minimumPaymentCents : 0;
  if (payment === 0) return 0;
  if (debt.paymentFrequency === 'weekly') return Math.round((payment * 52) / 12);
  if (debt.paymentFrequency === 'biweekly') return Math.round((payment * 26) / 12);
  return payment;
}

/**
 * A rough payoff estimate for a debt, or `null` when one can't be made
 * responsibly (no APR entered, nothing owed, or no payment set) — see
 * docs/PRODUCT.md §9. Standard amortization:
 *   months = -ln(1 - (r·B)/P) / ln(1 + r),  r = APR/100/12
 * with a 0% APR falling back to simple division. If the payment doesn't
 * even cover one month's interest, `months` is null and
 * `coversInterest` is false, so the UI can say so calmly instead of
 * showing an impossible date.
 * @param {object} debt
 * @param {{now?: Date}} [options]
 * @returns {{months: number|null, payoffDateKey: string|null, coversInterest: boolean, monthlyPaymentCents: number}|null}
 */
function estimatePayoff(debt, { now = new Date() } = {}) {
  const balance = isValidAmountCents(debt?.currentBalanceCents) ? debt.currentBalanceCents : 0;
  if (balance <= 0) return null;
  const monthlyPaymentCents = normalizedMonthlyPaymentCents(debt);
  if (monthlyPaymentCents <= 0) return null;
  const apr = typeof debt?.interestRate === 'number' && Number.isFinite(debt.interestRate) && debt.interestRate >= 0 ? debt.interestRate : null;
  if (apr == null) return null;

  const monthlyRate = apr / 100 / 12;
  let months;
  if (monthlyRate === 0) {
    months = Math.ceil(balance / monthlyPaymentCents);
  } else {
    const interestOnly = balance * monthlyRate;
    if (monthlyPaymentCents <= interestOnly) {
      return { months: null, payoffDateKey: null, coversInterest: false, monthlyPaymentCents };
    }
    months = Math.ceil(-Math.log(1 - (monthlyRate * balance) / monthlyPaymentCents) / Math.log(1 + monthlyRate));
  }
  if (!Number.isFinite(months) || months <= 0 || months > 1200) {
    return { months: null, payoffDateKey: null, coversInterest: false, monthlyPaymentCents };
  }
  return { months, payoffDateKey: getLocalDateKey(addMonths(now, months)), coversInterest: true, monthlyPaymentCents };
}

/**
 * Debt minimum-payments to surface in "Bills due soon" — one row per debt
 * that still has a balance, carrying the next due date and the minimum
 * payment amount. Rows already paid for the current month are flagged
 * (`alreadyPaidThisPeriod`) so the card can drop them, matching how a
 * paid Bill drops off (docs/PRODUCT.md §8).
 * @param {object} state
 * @param {{now?: Date}} [options]
 * @returns {Array<{id: string, name: string, amountCents: number, date: string|null, alreadyPaidThisPeriod: boolean}>}
 */
function getUpcomingDebtPayments(state, { now = new Date() } = {}) {
  return getAllDebts(state)
    .filter((debt) => debt && (isValidAmountCents(debt.currentBalanceCents) ? debt.currentBalanceCents : 0) > 0)
    .map((debt) => ({
      id: debt.id,
      name: debt.name,
      amountCents: isValidAmountCents(debt.minimumPaymentCents) ? debt.minimumPaymentCents : 0,
      date: getNextDebtDueDateKey(debt, now),
      alreadyPaidThisPeriod: hasDebtPaymentInMonth(state, debt.id, now),
    }));
}


// ---- src/modules/debts/reducer.js ----
// The Debts module (added ahead of docs/ROADMAP.md's phase order at the
// user's explicit request, same as "Brain dump" before it). A debt is a
// balance the user is paying down over time — a credit card, a loan.
// Deliberately NOT a full debt-management tool (no avalanche/snowball/
// refinance calculators): it answers "how much do I owe, what's due, am I
// making progress?" and nothing more (see docs/PRODUCT.md §4).
//
// Debts never enter the Safe-to-Spend arithmetic directly — see
// docs/SAFE-TO-SPEND.md §3c. The only thing that moves Safe-to-Spend
// because of a debt is a *payment*, which logs a real `Expense`
// (src/modules/debts/payment-effect.js) — so the money is accounted for
// exactly once, through the same Current Balance debit any Expense
// already causes (docs/DATA-MODEL.md §3a), never twice.


const DEBT_PAYMENT_FREQUENCIES = ['monthly', 'biweekly', 'weekly'];
const DEBT_EDITABLE_FIELDS = ['name', 'originalBalanceCents', 'currentBalanceCents', 'minimumPaymentCents', 'dueDate', 'interestRate', 'paymentFrequency'];

/** A day-of-month integer, 1..31 — see docs/DATA-MODEL.md "Debt". */
function isValidDueDate(value) {
  return Number.isInteger(value) && value >= 1 && value <= 31;
}

/** APR is optional: null/undefined (not entered) is valid; a number must be finite and >= 0. */
function isValidInterestRate(value) {
  if (value == null) return true;
  return typeof value === 'number' && Number.isFinite(value) && value >= 0;
}

function validateNewDebt(candidate) {
  if (!candidate) return null;
  const name = typeof candidate.name === 'string' ? candidate.name.trim() : '';
  if (!name) return null;
  if (!isValidAmountCents(candidate.originalBalanceCents)) return null;
  if (!isValidAmountCents(candidate.currentBalanceCents)) return null;
  if (!isValidAmountCents(candidate.minimumPaymentCents)) return null;
  if (!isValidDueDate(candidate.dueDate)) return null;
  if (!isValidInterestRate(candidate.interestRate)) return null;
  const paymentFrequency = DEBT_PAYMENT_FREQUENCIES.includes(candidate.paymentFrequency) ? candidate.paymentFrequency : 'monthly';
  const interestRate = candidate.interestRate == null ? null : candidate.interestRate;
  return { ...candidate, name, interestRate, paymentFrequency };
}

function sanitizeDebtChanges(changes = {}) {
  const sanitized = {};
  for (const field of DEBT_EDITABLE_FIELDS) {
    if (field in changes) sanitized[field] = changes[field];
  }
  if ('name' in sanitized) {
    const trimmed = typeof sanitized.name === 'string' ? sanitized.name.trim() : '';
    if (trimmed) sanitized.name = trimmed;
    else delete sanitized.name;
  }
  for (const field of ['originalBalanceCents', 'currentBalanceCents', 'minimumPaymentCents']) {
    if (field in sanitized && !isValidAmountCents(sanitized[field])) delete sanitized[field];
  }
  if ('dueDate' in sanitized && !isValidDueDate(sanitized.dueDate)) delete sanitized.dueDate;
  if ('interestRate' in sanitized && !isValidInterestRate(sanitized.interestRate)) delete sanitized.interestRate;
  if ('paymentFrequency' in sanitized && !DEBT_PAYMENT_FREQUENCIES.includes(sanitized.paymentFrequency)) delete sanitized.paymentFrequency;
  return sanitized;
}

const baseDebtsReducer = createListReducer({
  actionPrefix: 'debts',
  entityKey: 'debt',
  validateNew: validateNewDebt,
  sanitizeChanges: sanitizeDebtChanges,
});

/**
 * Wraps the generic list reducer with one bespoke case:
 * `debts/record-payment` reduces the debt's `currentBalanceCents` by the
 * payment amount, **clamped at 0** — a debt balance can never go negative
 * (docs/DATA-MODEL.md §15 "Important Edge Cases"). The linked `Expense`
 * and the `DebtPayment` log record are a separate cross-slice effect
 * (src/modules/debts/payment-effect.js), applied atomically by
 * src/main.js's rootReducer, mirroring how confirming an Income/Bill
 * touches three slices at once.
 */
function debtsReducer(items = [], action) {
  if (action.type === 'debts/record-payment') {
    const index = items.findIndex((item) => item.id === action.debtId);
    if (index === -1) return items;
    if (!isValidAmountCents(action.amountCents) || action.amountCents === 0) return items;
    const debt = items[index];
    const currentCents = isValidAmountCents(debt.currentBalanceCents) ? debt.currentBalanceCents : 0;
    const nextCents = Math.max(0, currentCents - action.amountCents);
    if (nextCents === currentCents) return items;
    const next = items.slice();
    next[index] = { ...debt, currentBalanceCents: nextCents, updatedAt: action.now };
    return next;
  }
  return baseDebtsReducer(items, action);
}


// ---- src/modules/debts/payment-effect.js ----
// How recording a Debt payment touches the other slices. Mirrors
// src/modules/bill-payments/create-payment.js + src/modules/incomes/
// balance-effect.js: pure functions that decide *what records to create*,
// never mutating state — src/main.js's rootReducer (the one place with
// full-state visibility) applies them atomically alongside the debt's own
// balance decrement (src/modules/debts/reducer.js).
//
// A debt payment deliberately reuses the ordinary Expense pathway rather
// than inventing a parallel "debt spending" concept: the linked Expense
// is what debits Current Balance (docs/DATA-MODEL.md §3a), so it flows
// into Safe-to-Spend the exact same way any other logged spend does —
// counted once, never twice (docs/SAFE-TO-SPEND.md §3c). The `Debt`
// record's own `currentBalanceCents` is informational only, never read by
// the Safe-to-Spend calculation.


/** The category every debt-payment Expense is filed under (free text, like every Expense category). */
const DEBT_PAYMENT_CATEGORY = 'Debt Payment';

/**
 * The `Expense` a debt payment logs. Shape matches
 * src/modules/expenses/actions.js's `createExpenseAction` output exactly
 * (so every existing Expense selector/edit/delete path treats it
 * identically), plus a `debtId` back-reference for reporting.
 * @param {{id: string, name: string}|undefined} debt
 * @param {{amountCents: number, date: string, note: string|null, now: string}} action the `debts/record-payment` action
 * @returns {object|null} null if there's nothing valid to record
 */
function buildDebtPaymentExpense(debt, action) {
  if (!debt || !isValidAmountCents(action.amountCents) || action.amountCents === 0) return null;
  const description = `Payment: ${debt.name}`;
  return {
    id: createId('e'),
    amountCents: action.amountCents,
    description,
    date: action.date,
    category: DEBT_PAYMENT_CATEGORY,
    notes: action.note || null,
    debtId: debt.id,
    createdAt: action.now,
    updatedAt: action.now,
  };
}

/**
 * The `DebtPayment` log record (docs/DATA-MODEL.md "DebtPayment") — the
 * Debt-side counterpart to `BillPayment`/`IncomeReceipt`. Denormalizes
 * `name` so it still reads correctly if the Debt is later renamed or
 * deleted. Links to the Expense it created so the two can be reconciled.
 * @param {{id: string, name: string}|undefined} debt
 * @param {{amountCents: number, date: string, now: string}} action
 * @param {string|null} expenseId the id of the Expense built by buildDebtPaymentExpense
 * @returns {object|null}
 */
function buildDebtPaymentRecord(debt, action, expenseId) {
  if (!debt || !isValidAmountCents(action.amountCents) || action.amountCents === 0) return null;
  return {
    id: createId('dp'),
    debtId: debt.id,
    name: debt.name,
    amountCents: action.amountCents,
    date: action.date,
    expenseId: expenseId ?? null,
    createdAt: action.now,
  };
}

// ---- src/ui/screens/dashboard.js ----
// The Dashboard — laid out after the reference the user shared:
//   - `.dashboard__top`   — three equal headline stat cards (Total
//     Expenses this month · Total Savings · Total debt to pay)
//   - `.dashboard__mid`   — "Estimated safe to spend" beside the
//     "Income vs Expenses" chart, matched heights (the chart's natural
//     height drives the row; the hero fills it with its disclaimer
//     pinned to the bottom, so there's no dead space under either)
//   - `.dashboard__bottom` — a two-up row (Budget progress · Recent
//     Expenses), then the Inbox and the privacy line
// Each grid collapses to fewer columns on tablet and a single column on
// mobile (breakpoints in responsive.css). Every number comes from the
// existing selectors — no new metrics, no mock data.
//
// The "+ Add expense" action lives at the top of the page — the view
// header's `titleAction` — not on the hero card.
//
// Everything else (full management of income / expenses / bills / debts /
// categories / budget) lives on its own sidebar view.


const GREETING_BY_PERIOD = { morning: 'Good morning', afternoon: 'Good afternoon', evening: 'Good evening' };

// Whether the top-of-page "+ Add expense" popup is open — transient UI
// state, deliberately outside the store (see docs/ARCHITECTURE.md §4).
let dashboardAddExpenseOpen = false;

function greetingText(state, now) {
  const base = GREETING_BY_PERIOD[getGreetingPeriod(now)];
  const name = state?.settings?.displayName;
  return name ? `${base}, ${name}.` : `${base}.`;
}

/**
 * @param {object} options
 * @param {object} options.state
 * @param {Function} options.dispatch
 * @param {Date} [options.now]
 * @param {() => void} [options.requestRender]
 * @returns {HTMLElement}
 */
function renderDashboard({ state, dispatch, now = new Date(), requestRender }) {
  // getSafeToSpendBreakdown = getSafeToSpend(state) + a `period` block so
  // the hero's "How is this worked out?" panel can show this month's
  // spending as visible deductions (it's a superset — every other
  // consumer of `result` reads the same fields as before).
  const result = getSafeToSpendBreakdown(state, { now });
  const period = getSelectedPeriod();

  // ---- headline stat cards ----
  // Total expenses follows the header bar's global period filter; the
  // month-over-month delta chip only makes sense for "This month", so
  // it's shown only then (`mom` compares this vs. last calendar month).
  const mom = getExpensesMonthOverMonth(state, { now });
  const periodExpensesCents = getExpensesTotalCents(
    getExpensesForPeriod(state, { period: period.period, from: period.from, to: period.to, now })
  );
  const expensesCard = renderStatCard({
    icon: 'receipt',
    label: `Total expenses · ${getPeriodLabel(period)}`,
    value: formatCents(periodExpensesCents),
    delta: period.period === 'month' && mom.deltaPct != null ? { pct: mom.deltaPct, isGood: mom.deltaPct <= 0 } : null,
  });
  const savingsCard = renderStatCard({
    icon: 'target',
    label: 'Total savings',
    value: formatCents(getSavingsAllocationCents(state)),
  });
  const debtCard = renderStatCard({
    icon: 'credit-card',
    label: 'Total debt to pay',
    value: formatCents(getTotalDebtCents(state)),
  });

  // ---- Overview: income vs expenses per month ----
  const monthly = getMonthlyInVsOut(state, { now });
  const overviewCard = renderColumnChart({
    title: 'Income vs Expenses',
    subtitle: `Each month · ${now.getFullYear()}`,
    bars: monthly.map((m) => ({ label: m.label, values: [m.inCents, m.outCents] })),
    series: [
      { label: 'Income', color: 'var(--color-chart-income)' },
      { label: 'Expenses', color: 'var(--color-chart-expense)' },
    ],
    emptyMessage: 'No income or expenses logged this year yet.',
  });

  // ---- Recent Expenses (period-scoped, read-only) ----
  const recentCard = renderExpensesSection({
    state,
    dispatch,
    now,
    requestRender,
    period,
    compact: true,
    onViewAll: () => navigateToView('expenses'),
  });

  // ---- Budget progress ----
  const budgetCard = renderCategoryBudgetsSection({
    state,
    dispatch,
    now,
    requestRender,
    compact: true,
    onViewAll: () => navigateToView('categories'),
  });

  // ---- "+ Add expense", top of the page (view-header action) ----
  const closeAddExpense = () => {
    dashboardAddExpenseOpen = false;
    requestRender?.();
  };
  const addExpenseButton = el(
    'button',
    { type: 'button', class: 'btn btn--primary btn--small', onclick: () => { dashboardAddExpenseOpen = true; requestRender?.(); } },
    '+ Add expense'
  );
  const addExpensePopup = dashboardAddExpenseOpen
    ? renderPopup({
        titleId: 'dashboard-add-expense-heading',
        title: 'Add expense',
        body: renderExpenseForm({ state, onSubmit: (input) => {
          if (!canAddExpense(state)) { closeAddExpense(); return; }
          dispatch(createExpenseAction(input, { now }));
          closeAddExpense();
        } }),
        onClose: closeAddExpense,
      })
    : null;

  const body = el('div', { class: 'dashboard' }, [
    el('div', { class: 'dashboard__top' }, [expensesCard, savingsCard, debtCard]),
    el('div', { class: 'dashboard__mid' }, [renderSafeToSpendHero(result), overviewCard]),
    el('div', { class: 'dashboard__bottom' }, [budgetCard, recentCard]),
    renderInboxSection({ state, dispatch, now, requestRender }),
    el('p', { class: 'privacy-note' }, [icon('shield'), 'Your data stays on this device — private, no accounts.']),
    renderDemoNotice(state),
    addExpensePopup,
  ].filter(Boolean));

  return renderAppFrame({
    state,
    dispatch,
    requestRender,
    activeView: 'dashboard',
    title: greetingText(state, now),
    subtitle: formatFriendlyDate(now),
    titleAction: addExpenseButton,
    body,
  });
}


// ---- src/ui/components/income-section.js ----
// The full Income list/edit/delete section was removed at the user's
// request. `renderIncomeForm` survives because it's still reused by the

// upcoming-income.js) — this file is now just that form.


const FREQUENCY_LABEL = { 'one-time': 'One-time', weekly: 'Weekly', biweekly: 'Biweekly', monthly: 'Monthly' };

function frequencyField(value) {
  const select = el(
    'select',
    { name: 'frequency', class: 'field__input' },
    INCOME_FREQUENCIES.map((freq) => el('option', { value: freq, selected: freq === value || undefined }, FREQUENCY_LABEL[freq]))
  );
  return el('label', { class: 'field' }, [el('span', { class: 'field__label' }, 'Frequency'), select]);

function incomeDateField(labelText, { name, value }) {
  const input = el('input', { type: 'date', name, value: value || '', class: 'field__input' });
  return el('label', { class: 'field' }, [el('span', { class: 'field__label' }, labelText), input]);
}

/**
 * Exported for reuse as a compact quick-add form (the dashboard's Quick
 * Actions). Name + Amount + Next date up front — the date matters too
 * much to Safe-to-Spend's payday horizon to bury it — with only Frequency
 * (which defaults sensibly to one-time) behind "+ More options" (Phase 7).
 * Editing starts expanded.
 */
function renderIncomeForm({ income = null, onSubmit, onCancel }) {
  const isEdit = income != null;
  const nameInput = el('input', {
    type: 'text',
    name: 'name',
    class: 'field__input',
    placeholder: 'Income name, e.g. "Paycheck"',
    value: income?.name ?? '',
    'aria-label': 'Income name',
  });
  const amount = amountField('Amount', { name: 'amountCents', valueCents: income?.amountCents ?? null });
  const error = el('p', { class: 'field__error', role: 'alert' });

  const more = renderMoreOptions(() => [frequencyField(income?.frequency ?? 'one-time')], { startExpanded: isEdit });

  const form = el('form', { class: 'money-form' }, [
    nameInput,
    amount,
    incomeDateField('Next date', { name: 'nextDate', value: income?.nextDate }),
    more.toggle,
    more.details,
    error,
    el(
      'div',
      { class: 'money-form__buttons' },
      [
        el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, isEdit ? 'Save' : [icon('trending-up'), 'Add income']),
        isEdit ? el('button', { type: 'button', class: 'btn btn--secondary btn--small', onclick: () => onCancel() }, 'Cancel') : null,
      ].filter(Boolean)
    ),
  ]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = nameInput.value.trim();
    const amountCents = parseAmountToCents(amount.amountInput.value);
    if (!name || amountCents == null) {
      error.textContent = 'Enter a name and a valid amount (0 or more).';
      return;
    }
    error.textContent = '';

    const formData = new FormData(form);
    const payload = { name, amountCents, frequency: formData.get('frequency') };
    const nextDate = formData.get('nextDate');
    if (nextDate) payload.nextDate = nextDate; // omit when blank so an edit never clobbers it with nothing

    onSubmit(payload);
    if (!isEdit) {
      nameInput.value = '';
      amount.amountInput.value = '';
    }
  });

  return form;
}

// Transient UI state (see docs/ARCHITECTURE.md §4): which income row's
// edit popup is open, and whether the "Add income" popup is open.
let editingIncomeId = null;
let addIncomeOpen = false;

const INCOME_VIEW_FREQUENCY_LABEL = { 'one-time': 'One-time', weekly: 'Weekly', biweekly: 'Biweekly', monthly: 'Monthly' };

/** The one global number for this tab — income actually received (logged
 *  as IncomeReceipts) within the header bar's selected period. Tinted
 *  teal ("money in"). */
function renderIncomeSummaryCard(state, now, hasIncome) {
  const period = getSelectedPeriod();
  const range = resolvePeriodRange(period.period, { now, from: period.from, to: period.to }) ?? { startDateKey: null, endDateKey: null };
  const receipts = getIncomeReceiptsForPeriod(state, { startDateKey: range.startDateKey, endDateKey: range.endDateKey });
  const note =
    receipts.length > 0
      ? `${receipts.length} payment${receipts.length === 1 ? '' : 's'} received`
      : hasIncome
        ? 'Nothing received in this period — mark income received when it lands.'
        : 'No income yet — add one with "+ Add income".';
  return renderStatCard({
    icon: 'trending-up',
    label: `Received · ${getPeriodLabel(period)}`,
    value: formatCents(getIncomeReceiptsTotalCents(receipts)),
    note,
    tone: 'positive',
  });
}

function incomeViewRow({ income, dispatch, now, requestRender }) {
  const isReceivedOneTime = income.frequency === 'one-time' && income.received;
  const metaParts = [formatCents(income.amountCents), INCOME_VIEW_FREQUENCY_LABEL[income.frequency] ?? 'One-time'];
  if (income.nextDate) metaParts.push(isReceivedOneTime ? 'Received' : `Next ${income.nextDate}`);
  if (!income.active) metaParts.push('Inactive');

  const actions = [];
  if (!isReceivedOneTime && income.active) {
    actions.push(
      el(
        'button',
        { type: 'button', class: 'btn btn--secondary btn--small', onclick: () => dispatch(markIncomeReceivedAction(income.id, { now })) },
        'Mark received'
      )
    );
  }
  actions.push(
    iconButton('edit', `Edit ${income.name}`, () => {
      editingIncomeId = income.id;
      requestRender?.();
    })
  );
  actions.push(
    iconButton(
      'trash',
      `Delete ${income.name}`,
      () => {
        if (window.confirm(`Delete "${income.name}"? This can't be undone.`)) {
          dispatch(deleteIncomeAction(income.id));
        }
      },
      { tone: 'attention' }
    )
  );

  return el('li', { class: 'money-item' }, [
    el('div', { class: 'money-item__body' }, [
      el('span', { class: 'money-item__title' }, income.name),
      el('span', { class: 'money-item__meta-text' }, metaParts.join(' · ')),
    ]),
    el('div', { class: 'money-item__actions' }, actions),
  ]);
}

function renderIncomeView({ state, dispatch, now = new Date(), requestRender }) {
  const incomes = getAllIncomes(state);
  const close = () => {
    addIncomeOpen = false;
    requestRender?.();
  };

  const addButton = el(
    'button',
    { type: 'button', class: 'btn btn--primary btn--small', onclick: () => { addIncomeOpen = true; requestRender?.(); } },

  const list =

      ? el('ul', { class: 'money-list money-list--cards' }, incomes.map((income) => incomeViewRow({ income, dispatch, now, requestRender })))
      : emptyState('No income yet — use "+ Add income" to add your first one.');

  const popup = addIncomeOpen
    ? renderPopup({
        titleId: 'add-income-view-heading',
        title: 'Add income',
        body: renderIncomeForm({ onSubmit: (input) => { dispatch(createIncomeAction(input, { now })); close(); } }),
        onClose: close,
      })

  const editing = editingIncomeId ? incomes.find((i) => i.id === editingIncomeId) : null;

  };
  const editPopup = editing

        title: 'Edit income',
        body: renderIncomeForm({

            dispatch(updateIncomeAction(editing.id, changes, { now }));

          },

  return renderAppFrame({

// ---- src/ui/components/bills-due-soon.js ----
// Bills. Two modes:
//   - compact (Dashboard summary — currently unused): the "due soon"
//     glance list (nearest unpaid bills + any debt minimum-payment due,
//     capped) inside a tinted card + a "View all bills →" link. Read-only
//     apart from one-tap "Mark paid". Debt Tracking integration
//     (docs/PRODUCT.md §8): a debt's minimum payment shows here as an
//     ordinary row whose "Make payment" routes to the Debts view.
//   - full (the Bills view, src/ui/screens/bills-view.js): a tinted
//     "Bills paid · <period>" summary card (period-scoped, with the
//     outstanding total as its note), then every bill (paid and unpaid)
//     as its own card with Mark paid/unpaid + a pencil to edit (inline
//     form) + a trash to delete — the same row shape as the Income view.
//     No debt rows here; debts live on their own view.


// Which bill's edit popup is open on the Bills view — transient UI
// state, deliberately outside the store (docs/ARCHITECTURE.md §4).
let editingBillId = null;

function dueLabel(dateStr, now) {
  const days = daysBetween(now, parseLocalDate(dateStr));
  if (days === 0) return 'Due today';
  if (days === 1) return 'Due tomorrow';
  if (days > 1) return `Due in ${days} days`;
  return `Due ${dateStr}`;
}

// One row in the compact glance list — a real Bill or a debt's
// minimum-payment. The only differences by kind: the leading icon, and
// the action — a Bill offers "Mark paid" (a one-tap status toggle), a
// debt offers "Make payment" which routes to the Debts view.
function glanceRow({ item, kind, now, dispatch }) {
  const overdue = item.date != null && isOverdue(item.date, now);
  const dateText = item.date == null ? 'No due date' : overdue ? 'Overdue' : dueLabel(item.date, now);
  const iconName = kind === 'debt' ? 'credit-card' : 'file-text';

  return el('div', { class: 'bills-due-soon__row' }, [
    iconChip(iconName, { color: overdue ? 'var(--color-status-attention-text)' : 'var(--color-status-caution-text)' }),
    el('div', { class: 'bills-due-soon__info' }, [
      el('span', { class: 'bills-due-soon__name' }, item.name),
      el('span', { class: `bills-due-soon__date${overdue ? ' bills-due-soon__date--overdue' : ''}` }, dateText),
    ]),
    el('span', { class: 'bills-due-soon__amount' }, formatCents(item.amountCents)),
    kind === 'debt'
      ? el(
          'button',
          { type: 'button', class: 'btn btn--secondary btn--small', onclick: () => navigateToView('debts') },
          'Make payment'
        )
      : el(
          'button',
          { type: 'button', class: 'btn btn--secondary btn--small', onclick: () => dispatch(toggleBillPaidAction(item.id, { now })) },
          'Mark paid'
        ),
  ]);
}

/** Dated soonest-first, undated last — same convention as getUpcomingBills. */
function byDueDate(a, b) {
  if (a.date && b.date) return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  if (a.date && !b.date) return -1;
  if (!a.date && b.date) return 1;
  return 0;
}

const RECURRENCE_META_LABEL = { 'one-time': 'One-time', weekly: 'Weekly', monthly: 'Monthly' };

function manageBillRow({ bill, now, dispatch, requestRender }) {
  const metaParts = [formatCents(bill.amountCents), RECURRENCE_META_LABEL[bill.recurrence] ?? 'One-time'];
  if (bill.dueDate) metaParts.push(bill.dueDate);
  metaParts.push(bill.paid ? 'Paid' : 'Unpaid');

  return el('li', { class: 'money-item' }, [
    el('div', { class: 'money-item__body' }, [
      el('span', { class: 'money-item__title' }, bill.name),
      el('span', { class: 'money-item__meta-text' }, metaParts.join(' · ')),
    ]),
    el('div', { class: 'money-item__actions' }, [
      el(
        'button',
        {
          type: 'button',
          class: 'btn btn--secondary btn--small',
          onclick: () => dispatch(toggleBillPaidAction(bill.id, { now })),
        },
        bill.paid ? 'Mark unpaid' : 'Mark paid'
      ),
      iconButton('edit', `Edit ${bill.name}`, () => {
        editingBillId = bill.id;
        requestRender?.();
      }),
      iconButton(
        'trash',
        `Delete ${bill.name}`,
        () => {
          if (window.confirm(`Delete "${bill.name}"? This can't be undone.`)) {
            dispatch(deleteBillAction(bill.id));
          }
        },
        { tone: 'attention' }
      ),
    ]),
  ]);
}

/** Unpaid first, then soonest due date. */
function billSortOrder(a, b) {
  if (!!a.paid !== !!b.paid) return a.paid ? 1 : -1;
  const ad = a.dueDate || '';
  const bd = b.dueDate || '';
  return ad < bd ? -1 : ad > bd ? 1 : 0;
}

/**
 * @param {object} options
 * @param {object} options.state
 * @param {Function} options.dispatch
 * @param {Date} [options.now]
 * @param {() => void} [options.requestRender]
 * @param {boolean} [options.compact] Dashboard summary mode — glance list
 *   + "View all bills →", no management. Default false (the Bills view).
 * @param {() => void} [options.onViewAll] where the "View all bills →"
 *   link goes (compact mode only).
 */
function renderBillsDueSoon({ state, dispatch, now = new Date(), requestRender, compact = false, onViewAll }) {
  if (compact) {
    // Dashboard summary — the "due soon" glance: nearest unpaid bills +
    // any debt minimum-payment due (docs/PRODUCT.md §8), capped, inside a
    // tinted card. Read-only apart from one-tap "Mark paid".
    const { items: billItems } = getUpcomingBills(state, { limit: 5 });
    const debtItems = getUpcomingDebtPayments(state, { now }).filter((d) => !d.alreadyPaidThisPeriod);
    const combined = [
      ...billItems.map((item) => ({ item, kind: 'bill' })),
      ...debtItems.map((item) => ({ item, kind: 'debt' })),
    ]
      .sort((a, b) => byDueDate(a.item, b.item))
      .slice(0, 4);

    const body =
      combined.length === 0
        ? emptyState('No unpaid bills right now.')
        : el('div', { class: 'bills-due-soon__list' }, combined.map(({ item, kind }) => glanceRow({ item, kind, now, dispatch })));

    const headerAction = onViewAll
      ? el('button', { type: 'button', class: 'link-button', onclick: onViewAll }, 'View all bills →')
      : null;

    return el('section', { class: 'card card--quiet bills-due-soon', 'aria-labelledby': 'bills-due-soon-heading' }, [
      el('div', { class: 'card__header-row' }, [
        sectionHeading('file-text', 'Bills due soon', 'bills-due-soon-heading', { color: 'var(--color-status-caution-text)' }),
        headerAction,
      ].filter(Boolean)),
      body,
    ].filter(Boolean));
  }

  // Full (Bills view): a tinted summary card ("Bills paid" over the
  // selected period, with the outstanding total as its note), then every
  // bill as its own card — Mark paid/unpaid + a pencil to edit (in a
  // popup) + a trash to delete. Unpaid & soonest-due sort to the top.
  const bills = [...getAllBills(state)].sort(billSortOrder);
  const list =
    bills.length > 0
      ? el('ul', { class: 'money-list money-list--cards' }, bills.map((bill) => manageBillRow({ bill, now, dispatch, requestRender })))
      : emptyState('No bills yet — use "+ Add bill" to add your first one.');

  const editing = editingBillId ? bills.find((b) => b.id === editingBillId) : null;
  const closeEdit = () => {
    editingBillId = null;
    requestRender?.();
  };
  const editPopup = editing
    ? renderPopup({
        titleId: 'edit-bill-heading',
        title: 'Edit bill',
        body: renderBillForm({
          bill: editing,
          onSubmit: (changes) => {
            dispatch(updateBillAction(editing.id, changes, { now }));
            closeEdit();
          },
          onCancel: closeEdit,
        }),
        onClose: closeEdit,
      })
    : null;

  return el('div', { class: 'view-stack' }, [renderBillsSummaryCard(state, now), list, editPopup].filter(Boolean));
}

/** The Bills view's global number — bills actually paid (logged as
 *  BillPayments) within the header bar's selected period; the note keeps
 *  the still-outstanding total in view. Tinted like an obligation. */
function renderBillsSummaryCard(state, now) {
  const period = getSelectedPeriod();
  const range = resolvePeriodRange(period.period, { now, from: period.from, to: period.to }) ?? { startDateKey: null, endDateKey: null };
  const paidCents = getBillPaymentsTotalCents(getBillPaymentsForPeriod(state, { startDateKey: range.startDateKey, endDateKey: range.endDateKey }));
  const unpaidCount = getAllBills(state).filter((bill) => bill && bill.active && !bill.paid).length;
  return renderStatCard({
    icon: 'file-text',
    label: `Bills paid · ${getPeriodLabel(period)}`,
    value: formatCents(paidCents),
    note:
      unpaidCount > 0
        ? `${unpaidCount} unpaid · ${formatCents(getUpcomingBillsTotalCents(state))} still to pay`
        : 'All bills are paid.',
    tone: 'attention',
  });
}

// ---- src/ui/components/debts-section.js ----
// The "Debt overview" card — a per-debt progress bar answering "how much
// do I owe, am I making progress?". Two modes:
//   - compact (Dashboard summary — currently unused): progress bars only
//     + a "View all debts →" link that routes to the Debts view. No
//     actions.
//   - full (the Debts view, src/ui/screens/debts-view.js): a tinted
//     "Still owed" summary card, then each debt as its own card with a
//     "Make payment" button (a popup that logs a real Expense —
//     src/modules/debts/payment-effect.js, so the money hits Current
//     Balance / Safe-to-Spend exactly once) plus a pencil to edit
//     (inline form) and a trash to delete — the same row shape as the
//     Income view.
//
// Tone stays calm and non-judgmental (docs/PRODUCT.md §10): "amount
// remaining", "paid off", "making progress" — never "you owe".


// Transient UI state for the Debts view (see docs/ARCHITECTURE.md §4):
// which debt row is being edited inline, and which one's "Make payment"
// popup is open. Distinct names — the bundler concatenates every module
// into one scope (build/build.js).
let editingDebtId = null;
let payingDebtId = null;

const DEBT_FREQUENCY_LABEL = { monthly: 'Monthly', biweekly: 'Every 2 weeks', weekly: 'Weekly' };
const PAYOFF_MONTH_FMT = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' });

function payoffLine(debt, now) {
  const estimate = estimatePayoff(debt, { now });
  if (!estimate) return null;
  if (!estimate.coversInterest || !estimate.payoffDateKey) {
    return el('p', { class: 'debt-row__payoff' }, "Estimate: this payment doesn't cover the interest yet.");
  }
  const when = PAYOFF_MONTH_FMT.format(parseLocalDate(estimate.payoffDateKey));
  return el('p', { class: 'debt-row__payoff' }, `Estimated payoff: around ${when} (estimate)`);
}

function debtRow({ debt, now, dispatch, requestRender, compact }) {
  const progress = getDebtProgress(debt);
  const percent = Math.round(progress.percentPaid);

  const top = el('div', { class: 'debt-row__top' }, [
    el('span', { class: 'debt-row__name' }, debt.name),
    el('span', { class: 'debt-row__percent' }, progress.isPaidOff ? 'Paid off 🎉' : `${percent}% paid off`),
  ]);

  const balances = el(
    'div',
    { class: 'debt-row__balances' },
    `${formatCents(debt.currentBalanceCents)} remaining · ${formatCents(debt.originalBalanceCents)} original`
  );

  const bar = el('div', { class: 'debt-row__bar' }, [
    el('div', { class: 'debt-row__bar-fill', style: `width: ${progress.percentPaid}%` }),
  ]);

  const bodyChildren = [top, balances, bar];
  let iconActions = null;
  if (!compact) {
    const payoff = progress.isPaidOff ? null : payoffLine(debt, now);

/**
 * The add/edit form for a debt. Required up front: name, original
 * balance, current balance, minimum payment, due day. APR (optional) and
 * payment frequency sit behind "+ More options". Editing starts expanded.
 * @param {object} options
 * @param {object|null} [options.debt]
 * @param {(input: object) => void} options.onSubmit
 * @param {() => void} [options.onCancel]
 */
function renderDebtForm({ debt = null, onSubmit, onCancel }) {
  const isEdit = debt != null;

  const nameInput = el('input', {
    type: 'text',
    name: 'name',
    class: 'field__input',
    placeholder: 'Debt name, e.g. "Visa Card"',
    value: debt?.name ?? '',
    'aria-label': 'Debt name',
  });
  const original = amountField('Original balance', { name: 'originalBalanceCents', valueCents: debt?.originalBalanceCents ?? null });
  const current = amountField('Current balance', { name: 'currentBalanceCents', valueCents: debt?.currentBalanceCents ?? null });
  const minimum = amountField('Minimum payment', { name: 'minimumPaymentCents', valueCents: debt?.minimumPaymentCents ?? null });
  const dueDay = dueDayField(debt?.dueDate);
  const apr = aprField(debt?.interestRate);
  const freq = debtFrequencyField(debt?.paymentFrequency ?? 'monthly');
  const error = el('p', { class: 'field__error', role: 'alert' });

  const more = renderMoreOptions(() => [apr, freq], { startExpanded: isEdit });

  const form = el('form', { class: 'money-form' }, [
    nameInput,
    original,
    current,
    minimum,
    dueDay,
    more.toggle,
    more.details,
    error,
    el(
      'div',
      { class: 'money-form__buttons' },
      [
        el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, isEdit ? 'Save' : [icon('wallet'), 'Add debt']),
        isEdit ? el('button', { type: 'button', class: 'btn btn--secondary btn--small', onclick: () => onCancel() }, 'Cancel') : null,
      ].filter(Boolean)
    ),
  ]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = nameInput.value.trim();
    const originalBalanceCents = parseAmountToCents(original.amountInput.value);
    const currentBalanceCents = parseAmountToCents(current.amountInput.value);
    const minimumPaymentCents = parseAmountToCents(minimum.amountInput.value);
    const dueDate = Number.parseInt(dueDay.dueDayInput.value, 10);
    const aprRaw = apr.aprInput.value.trim();
    const interestRate = aprRaw === '' ? null : Number(aprRaw);

    if (!name || originalBalanceCents == null || currentBalanceCents == null || minimumPaymentCents == null) {
      error.textContent = 'Enter a name and valid amounts (0 or more) for the balances and minimum payment.';
      return;
    }
    if (!Number.isInteger(dueDate) || dueDate < 1 || dueDate > 31) {
      error.textContent = 'Enter a payment due day between 1 and 31.';
      return;
    }
    if (interestRate != null && (!Number.isFinite(interestRate) || interestRate < 0)) {
      error.textContent = 'Interest rate must be 0 or more, or left blank.';
      return;
    }
    error.textContent = '';

    onSubmit({
      name,
      originalBalanceCents,
      currentBalanceCents,
      minimumPaymentCents,
      dueDate,
      interestRate,
      // Read straight off the captured <select> (the same node is reused
      // across "+ More options" repaints), not FormData — the field isn't
      // in the DOM while "+ More options" is still collapsed.
      paymentFrequency: freq.selectInput.value,
    });

    if (!isEdit) {
      nameInput.value = '';
      original.amountInput.value = '';
      current.amountInput.value = '';
      minimum.amountInput.value = '';
      dueDay.dueDayInput.value = '';
      apr.aprInput.value = '';
    }
  });

  return form;
}

/**
 * @param {object} options
 * @param {object} options.state
 * @param {Function} options.dispatch
 * @param {Date} [options.now]
 * @param {() => void} [options.requestRender]
 * @param {boolean} [options.compact] Dashboard summary mode — progress
 *   bars only + "View all debts →". Default false (the Debts view).
 * @param {() => void} [options.onViewAll] target of the "View all debts →" link (compact only).
 */
function renderDebtsSection({ state, dispatch, now = new Date(), requestRender, compact = false, onViewAll }) {
  const debts = getAllDebts(state);

  const body =
    debts.length === 0
      ? emptyState('No debts tracked yet — add your first debt to see where you stand and track your progress over time.')
      : el('ul', { class: 'debt-list' }, debts.map((debt) => debtRow({ debt, now, dispatch, requestRender, compact })));

  const headerAction =
    compact && onViewAll ? el('button', { type: 'button', class: 'link-button', onclick: onViewAll }, 'View all debts →') : null;

  const payingDebt = !compact && payingDebtId ? debts.find((d) => d.id === payingDebtId) : null;
  const closePayment = () => {
    payingDebtId = null;
    requestRender?.();
  };
  const paymentPopup = payingDebt
    ? renderPopup({
        titleId: 'debt-payment-heading',
        title: 'Make a payment',
        body: renderDebtPaymentForm({
          debt: payingDebt,
          now,
          onSubmit: (input) => {
            dispatch(recordDebtPaymentAction(payingDebt.id, input, { now }));
            closePayment();
          },
        }),
        onClose: closePayment,
      })
    : null;

  const editingDebt = !compact && editingDebtId ? debts.find((d) => d.id === editingDebtId) : null;
  const closeEdit = () => {
    editingDebtId = null;
    requestRender?.();
  };
  const editPopup = editingDebt
    ? renderPopup({
        titleId: 'edit-debt-heading',
        title: 'Edit debt',
        body: renderDebtForm({
          debt: editingDebt,
          onSubmit: (changes) => {
            dispatch(updateDebtAction(editingDebt.id, changes, { now }));
            closeEdit();
          },
          onCancel: closeEdit,
        }),
        onClose: closeEdit,
      })

  if (compact) {

      el('div', { class: 'card__header-row' }, [sectionHeading('credit-card', 'Debt overview', 'debts-heading'), headerAction].filter(Boolean)),
      body,
    ].filter(Boolean));
  }

  // Full (Debts view): a "Still owed" summary card (the one global
  // number), then — no outer container card — each debt as its own
  // card (.debt-row) with a "Make payment" button plus a pencil to edit
  // (in a popup) and a trash to delete. When there are no debts the
  // summary card's own note is the empty state, so the list's
  // placeholder line is dropped to avoid saying it twice.
  return el('div', { class: 'view-stack' }, [
    renderStillOwedCard(state),
    debts.length > 0 ? body : null,

/** The Debts view's single global number — total still owed across every
 *  debt (`getTotalDebtCents`), as a `renderStatCard` with a supporting

function renderStillOwedCard(state) {
  const owing = getAllDebts(state).filter((debt) => !getDebtProgress(debt).isPaidOff).length;
  return renderStatCard({
    icon: 'credit-card',

    note:
      owing === 0
        ? 'Nothing owed here — add one only if you want a payoff plan.'
        : `Across ${owing} ${owing === 1 ? 'debt' : 'debts'}`,
  });
}

// ---- src/modules/goals/actions.js ----
// Action creators for the Goals module (savings goals — a named money
// target with an amount needed, an amount already put away, and a rough
// monthly pace). Non-deterministic values (id, timestamps) are generated
// here at dispatch time so the reducer stays pure — same convention as
// every other list-entity module (see src/modules/debts/actions.js).


/**
 * @param {{name: string, targetCents: number, savedCents: number, monthlyPaceCents?: number|null}} input
 * @param {{now?: Date}} [options]
 */
function createGoalAction(input, { now = new Date() } = {}) {
  const timestamp = now.toISOString();
  return {
    type: 'goals/create',
    goal: {
      id: createId('g'),
      name: input?.name ?? '',
      targetCents: input?.targetCents,
      savedCents: input?.savedCents,
      monthlyPaceCents: input?.monthlyPaceCents ?? null,
      createdAt: timestamp,
      updatedAt: timestamp,
    },
  };
}

function updateGoalAction(id, changes, { now = new Date() } = {}) {
  return { type: 'goals/update', id, changes, now: now.toISOString() };
}

function deleteGoalAction(id) {
  return { type: 'goals/delete', id };
}


// ---- src/modules/goals/selectors.js ----

function getAllGoals(state) {
  const value = state?.goals;
  return Array.isArray(value) ? value : [];
}

/**
 * Sum of every goal's "already put away" amount — the protected/committed
 * figure Safe-to-Spend subtracts (docs/SAFE-TO-SPEND.md §3d). Skips a
 * corrupted `savedCents` rather than letting one bad value NaN-poison the
 * total (same defensive pattern as every other *TotalCents helper).
 * @param {object} state
 * @returns {number}
 */
function getTotalGoalsSavedCents(state) {
  let totalCents = 0;
  for (const goal of getAllGoals(state)) {
    if (!goal || !isValidAmountCents(goal.savedCents)) continue;
    totalCents += goal.savedCents;
  }
  return totalCents;
}

/**
 * Progress toward a goal: `savedCents / targetCents`, clamped, plus a
 * rough "months to go" from the monthly pace when one is set.
 * @param {{targetCents: number, savedCents: number, monthlyPaceCents?: number|null}} goal
 * @returns {{savedCents: number, targetCents: number, remainingCents: number, percentSaved: number, isReached: boolean, monthsToGo: number|null}}
 */
function getGoalProgress(goal) {
  const targetCents = isValidAmountCents(goal?.targetCents) ? goal.targetCents : 0;
  const savedCents = isValidAmountCents(goal?.savedCents) ? goal.savedCents : 0;
  const remainingCents = Math.max(0, targetCents - savedCents);
  const percentSaved = targetCents > 0 ? Math.min(100, Math.max(0, (savedCents / targetCents) * 100)) : savedCents > 0 ? 100 : 0;
  const isReached = targetCents > 0 && savedCents >= targetCents;
  const pace = isValidAmountCents(goal?.monthlyPaceCents) ? goal.monthlyPaceCents : 0;
  const monthsToGo = !isReached && pace > 0 && remainingCents > 0 ? Math.ceil(remainingCents / pace) : null;
  return { savedCents, targetCents, remainingCents, percentSaved, isReached, monthsToGo };
}


// ---- src/modules/goals/reducer.js ----
// The Goals module — savings goals (a "sinking fund" per target: an
// emergency fund, a new laptop). Added ahead of docs/ROADMAP.md's phase
// order at the user's explicit request (and after confirming savings
// goals are in scope — distinct from the retired "ADHD Life Planner"
// life-goals; see docs/PRODUCT.md §4/§5).
//
// Unlike Debts and Category Budgets, a goal's "already put away" amount
// DOES reduce Safe-to-Spend — it's protected/committed money
// (docs/SAFE-TO-SPEND.md §3d). The formula reads `state.goals` directly;
// there is no cross-slice effect and creating a goal never debits Current
// Balance. NOTE: the flat Savings figure (`budget.savingsAllocationCents`)
// used to get this exact same treatment, but no longer subtracts from
// Safe-to-Spend at all — it became a separate-account reference figure
// (docs/SAFE-TO-SPEND.md §9). Goals kept the subtraction; the flat
// Savings figure did not.


const GOAL_EDITABLE_FIELDS = ['name', 'targetCents', 'savedCents', 'monthlyPaceCents'];

/** Pace is optional: null/undefined (not set) is valid; otherwise a non-negative integer-cents value. */
function isValidPace(value) {
  return value == null || isValidAmountCents(value);
}

function validateNewGoal(candidate) {
  if (!candidate) return null;
  const name = typeof candidate.name === 'string' ? candidate.name.trim() : '';
  if (!name) return null;
  if (!isValidAmountCents(candidate.targetCents)) return null;
  if (!isValidAmountCents(candidate.savedCents)) return null;
  if (!isValidPace(candidate.monthlyPaceCents)) return null;
  const monthlyPaceCents = candidate.monthlyPaceCents == null ? null : candidate.monthlyPaceCents;
  return { ...candidate, name, monthlyPaceCents };
}

function sanitizeGoalChanges(changes = {}) {
  const sanitized = {};
  for (const field of GOAL_EDITABLE_FIELDS) {
    if (field in changes) sanitized[field] = changes[field];
  }
  if ('name' in sanitized) {
    const trimmed = typeof sanitized.name === 'string' ? sanitized.name.trim() : '';
    if (trimmed) sanitized.name = trimmed;
    else delete sanitized.name;
  }
  for (const field of ['targetCents', 'savedCents']) {
    if (field in sanitized && !isValidAmountCents(sanitized[field])) delete sanitized[field];
  }
  if ('monthlyPaceCents' in sanitized && !isValidPace(sanitized.monthlyPaceCents)) delete sanitized.monthlyPaceCents;
  return sanitized;
}

const goalsReducer = createListReducer({
  actionPrefix: 'goals',
  entityKey: 'goal',
  validateNew: validateNewGoal,
  sanitizeChanges: sanitizeGoalChanges,
});

// Transient UI state (see docs/ARCHITECTURE.md §4): which goal row is

let editingGoalId = null;
let addGoalOpen = false;

/**
 * The add / edit form for a goal — Name, Amount needed, Already put

function renderGoalForm({ goal = null, onSubmit, onCancel }) {

  const saved = amountField('Already put away', { name: 'savedCents', valueCents: goal?.savedCents ?? null });
  const pace = amountField('Pace (roughly, per month)', { name: 'monthlyPaceCents', valueCents: goal?.monthlyPaceCents ?? null });

function goalRow({ goal, dispatch, requestRender }) {

  ]);

    el('div', { class: 'goal-row__bar-fill', style: `width: ${progress.percentSaved}%` }),
  ]);

  const amounts = el('div', { class: 'goal-row__amounts' }, `${formatCents(goal.savedCents)} of ${formatCents(goal.targetCents)}`);

  const bodyChildren = [top, bar, amounts];

  if (goal.monthlyPaceCents != null && goal.monthlyPaceCents > 0) {
    const paceText = progress.monthsToGo
      ? `~${formatCents(goal.monthlyPaceCents)}/month · about ${progress.monthsToGo} month${progress.monthsToGo === 1 ? '' : 's'} to go`
      : `~${formatCents(goal.monthlyPaceCents)}/month`;
    bodyChildren.push(el('p', { class: 'goal-row__pace' }, paceText));
  }

  const actions = el('div', { class: 'goal-row__actions' }, [
    iconButton('edit', `Edit ${goal.name}`, () => {
      editingGoalId = goal.id;
      requestRender?.();
    }),
    iconButton(
      'trash',
      `Delete ${goal.name}`,
      () => {
        if (window.confirm(`Delete "${goal.name}"? This can't be undone.`)) {
          dispatch(deleteGoalAction(goal.id));
        }
      },
      { tone: 'attention' }
    ),
  ]);

  return el('li', { class: `goal-row${progress.isReached ? ' goal-row--reached' : ''}` }, [
    el('div', { class: 'goal-row__body' }, bodyChildren),
    actions,
  ]);
}

function renderGoalsView({ state, dispatch, now = new Date(), requestRender }) {
  const goals = getAllGoals(state);
  const closeAdd = () => {
    addGoalOpen = false;
    requestRender?.();
  };

  const addButton = el(
    'button',
    { type: 'button', class: 'btn btn--primary btn--small', onclick: () => { addGoalOpen = true; requestRender?.(); } },
    '+ Add a goal'
  );

  const list =
    goals.length > 0
      ? el('ul', { class: 'goal-list' }, goals.map((goal) => goalRow({ goal, dispatch, requestRender })))
      : emptyState('No goals yet — use "+ Add a goal" to set your first target.');

  const popup = addGoalOpen
    ? renderPopup({
        titleId: 'add-goal-heading',
        title: 'Add a goal',
        body: renderGoalForm({
          onSubmit: (input) => {
            dispatch(createGoalAction(input, { now }));
            closeAdd();
          },
          onCancel: closeAdd,
        }),
        onClose: closeAdd,
      })
    : null;

  const editing = editingGoalId ? goals.find((g) => g.id === editingGoalId) : null;
  const closeEdit = () => {
    editingGoalId = null;
    requestRender?.();
  };
  const editPopup = editing
    ? renderPopup({
        titleId: 'edit-goal-heading',
        title: 'Edit goal',
        body: renderGoalForm({
          goal: editing,
          onSubmit: (changes) => {
            dispatch(updateGoalAction(editing.id, changes, { now }));
            closeEdit();
          },
          onCancel: closeEdit,
        }),
        onClose: closeEdit,
      })
    : null;

  return renderAppFrame({
    state,
    dispatch,
    requestRender,
    activeView: 'goals',
    title: 'Goals',
    titleAction: addButton,
    body: el('div', {}, [list, popup, editPopup].filter(Boolean)),
  });
}

// ---- src/ui/screens/settings-view.js ----
// The Settings view — a dedicated screen consolidating the app's
// existing preferences: display name (greeting copy), theme, and display
// currency. These already existed as `settings.*` state (see
// src/modules/settings/) and as scattered header-bar controls; this view
// just gathers them in one place. No new settings are introduced.


const THEME_OPTIONS = [
  { value: 'system', label: 'System' },
  { value: 'light', label: 'Light' },
  { value: 'dark', label: 'Dark' },
];

function nameSection({ state, dispatch, requestRender }) {
  const input = el('input', {
    type: 'text',

    sectionHeading('edit', 'Your name', 'settings-name-heading'),
    el('p', { class: 'section-description' }, 'Optional — shown in the dashboard greeting, e.g. "Good morning, Ismail."'),
    form,
  ]);
}

function themeSection({ state, dispatch }) {
  const current = getTheme(state);
  const buttons = THEME_OPTIONS.map((opt) =>
    el(
      'button',
      {
        type: 'button',
        class: `btn btn--small ${opt.value === current ? 'btn--primary' : 'btn--secondary'}`,
        'aria-pressed': String(opt.value === current),

      },

  return el('section', { class: 'card', 'aria-labelledby': 'settings-theme-heading' }, [

}

function currencySection({ state, dispatch }) {
  const current = getCurrency(state);
  const select = el(
    'select',
    { class: 'field__input', 'aria-label': 'Display currency', onchange: (event) => dispatch(setCurrencyAction(event.target.value)) },
    SUPPORTED_CURRENCIES.map((code) => el('option', { value: code, selected: code === current || undefined }, code))
  );
