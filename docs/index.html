// ---- src/ui/screens/onboarding.js ----
// A short, entirely optional first-run flow (Phase 7). One question at a
// time, centered on the screen — submitting a step's form (whether it's
// filled in or left blank) advances to the next one. "Skip for now" (top)
// still jumps straight to the dashboard from any step. No decisions are
// asked here beyond what's genuinely useful for a fast start (name, for
// the greeting; balance/savings; next payday incl. how often it repeats,
// and any others; bills, any number of them; debts, any number of them) —
// everything else stays reachable, not required, further down the
// dashboard (docs/PRODUCT.md §3).


// Which step is showing — transient UI state, deliberately outside the
// store (see docs/ARCHITECTURE.md §4). Resets to the start on reload;
// nothing is lost by that, since anything already saved on an earlier
// step is already in the store, independent of where this counter is.
let currentStep = 0;

const PAYDAY_FREQUENCY_LABEL = { 'one-time': 'One-time', weekly: 'Weekly', biweekly: 'Biweekly', monthly: 'Monthly' };

function onboardingCard(title, description, children) {
  return el('section', { class: 'card', 'aria-labelledby': 'onboarding-step-heading' }, [
    el('h2', { id: 'onboarding-step-heading' }, title),
    description ? el('p', { class: 'section-description' }, description) : null,
    ...children,
  ].filter(Boolean));
}

function continueButton(label = 'Continue') {
  return el('div', { class: 'money-form__buttons' }, [el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, label)]);
}

/** A compact "what's already been added" list — same row shape used by every other simple list in this app (money-item.js's own markup, not the component, since no actions are needed here). */
function addedItemsList(items) {
  if (items.length === 0) return null;
  return el(
    'ul',
    { class: 'money-list' },
    items.map((item) =>
      el('li', { class: 'money-item' }, [
        el('div', { class: 'money-item__body' }, [
          el('span', { class: 'money-item__title' }, item.title),
          el('span', { class: 'money-item__meta-text' }, item.meta),
        ]),
      ])
    )
  );
}

/** What's your name? — purely for greeting copy; entirely optional. */
function renderNameStep({ dispatch, goNext }) {
  const nameInput = el('input', { type: 'text', name: 'displayName', class: 'field__input', placeholder: 'Optional' });
  const label = el('label', { class: 'field' }, [el('span', { class: 'field__label' }, 'Your name'), nameInput]);
  const form = el('form', { class: 'money-form' }, [label, continueButton()]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = nameInput.value.trim();
    if (name) dispatch(setDisplayNameAction(name));
    goNext();
  });

  return onboardingCard('Your name', "So the dashboard can greet you by name — e.g. \"Good morning, Alex.\" Leave blank if you'd rather skip this.", [form]);
}

/** Current Balance + optional Current Savings — one combined form. */
function renderBasicsStep({ dispatch, goNext }) {
  const balance = amountField('Current balance', { name: 'balance' });
  const savings = amountField('Current savings (optional)', { name: 'savings' });
  const error = el('p', { class: 'field__error', role: 'alert' });

  const form = el('form', { class: 'money-form' }, [
    balance,
    savings,
    el('p', { class: 'field__hint' }, "Current balance is what's in your checking account right now. Savings is what's already in a separate savings account — enter it for reference; it won't be subtracted from your safe-to-spend."),
    error,
    continueButton(),
  ]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    // Every field here is optional — a blank one is simply skipped, not an error.
    const balanceCents = balance.amountInput.value.trim() ? parseBalanceToCents(balance.amountInput.value) : undefined;
    const savingsCents = savings.amountInput.value.trim() ? parseAmountToCents(savings.amountInput.value) : undefined;

    if (balance.amountInput.value.trim() && balanceCents == null) {
      error.textContent = 'Current balance: enter a valid amount, like 150.00 or -40.00.';
      return;
    }
    if (savings.amountInput.value.trim() && savingsCents == null) {
      error.textContent = 'Current savings: enter a valid amount of 0 or more.';
      return;
    }
    error.textContent = '';

    // Each value is stored exactly as entered — Current Balance is the
    // checking-account figure, Savings is a separate account balance
    // tracked for reference. Neither touches the other: the Savings
    // figure is display-only and does NOT reduce Safe-to-Spend
    // (docs/SAFE-TO-SPEND.md §9) — only a later "Add to savings" transfer
    // (which debits Current Balance) does. So entering $1,000 balance +
    // $12,000 savings here leaves Safe-to-Spend at $1,000, not −$11,000.
    if (balanceCents != null) dispatch(setCurrentBalanceAction(balanceCents));
    if (savingsCents != null) dispatch(setSavingsAllocationAction(savingsCents));

    goNext();
  });

  return onboardingCard('Current balance & savings', "What you have, and (optionally) what you're setting aside. Leave either blank if you're not ready.", [form]);
}

/**
 * Next payday(s) — amount + date + how often it repeats, now with a name
 * field (defaults to "Paycheck") and no auto-advance, so more than one
 * income source can be added here (e.g. a paycheck and a side job) — at
 * the user's request. Submitting the form adds one and stays on this
 * step; a separate "Continue" moves on whenever the user is done.
 */
function renderPaydayStep({ state, dispatch, now, goNext, requestRender }) {
  const incomes = getAllIncomes(state);
  const list = addedItemsList(incomes.map((income) => ({ title: income.name, meta: `${formatCents(income.amountCents)} · ${PAYDAY_FREQUENCY_LABEL[income.frequency] ?? income.frequency}` })));

  const nameInput = el('input', {
    type: 'text',
    name: 'incomeName',
    class: 'field__input',
    value: incomes.length === 0 ? 'Paycheck' : '',
    placeholder: 'e.g. "Paycheck", "Side gig"',
  });
  const nameField = el('label', { class: 'field' }, [el('span', { class: 'field__label' }, 'Name'), nameInput]);
  const amount = amountField('Amount', { name: 'paydayAmount' });
  const dateInput = el('input', { type: 'date', name: 'paydayDate', value: getLocalDateKey(now), class: 'field__input' });
  const dateField = el('label', { class: 'field' }, [el('span', { class: 'field__label' }, 'Next payday date'), dateInput]);
  const frequencySelect = el(
    'select',
    { name: 'paydayFrequency', class: 'field__input' },
    INCOME_FREQUENCIES.map((frequency) => el('option', { value: frequency, selected: frequency === 'monthly' || undefined }, PAYDAY_FREQUENCY_LABEL[frequency]))
  );
  const frequencyField = el('label', { class: 'field' }, [el('span', { class: 'field__label' }, 'How often'), frequencySelect]);
  const error = el('p', { class: 'field__error', role: 'alert' });

  const form = el('form', { class: 'money-form' }, [
    nameField,
    amount,
    dateField,
    frequencyField,
    error,
    el('div', { class: 'money-form__buttons' }, [el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, incomes.length > 0 ? 'Add another income' : 'Add income')]),
  ]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!amount.amountInput.value.trim()) {
      error.textContent = 'Enter an amount, or use Continue below to skip this.';
      return;
    }
    const cents = parseAmountToCents(amount.amountInput.value);
    if (cents == null) {
      error.textContent = 'Enter a valid amount of 0 or more.';
      return;
    }
    error.textContent = '';
    dispatch(createIncomeAction({ amountCents: cents, nextDate: dateInput.value, frequency: frequencySelect.value, name: nameInput.value.trim() || 'Paycheck' }, { now }));
    requestRender?.(); // stay on this step — refreshes the added-so-far list and resets the form for another entry
  });

  const continueBtn = el(
    'button',
    { type: 'button', class: incomes.length > 0 ? 'btn btn--secondary btn--small' : 'link-button', onclick: goNext },
    incomes.length > 0 ? 'Continue' : "I don't have income to add right now"
  );

  return onboardingCard(
    'Next payday',
    'When and roughly how much, and how often it repeats — add as many income sources as you have. This is what Safe-to-Spend uses to figure out how long your money needs to last.',
    [list, form, continueBtn].filter(Boolean)
  );
}

/** Upcoming bills — reuses the real Bill form (a bill genuinely needs a name); add as many as you have, one at a time. */
function renderBillsStep({ state, dispatch, now, goNext, requestRender }) {
  const bills = getAllBills(state);
  const list = addedItemsList(bills.map((bill) => ({ title: bill.name, meta: formatCents(bill.amountCents) })));

  const form = renderBillForm({
    onSubmit: (input) => {
      dispatch(createBillAction(input, { now }));
      requestRender?.(); // stay on this step — refreshes the added-so-far list and resets the form for another entry
    },
  });

  const continueBtn = el(
    'button',
    { type: 'button', class: bills.length > 0 ? 'btn btn--secondary btn--small' : 'link-button', onclick: goNext },
    bills.length > 0 ? 'Continue' : "I don't have any bills to add right now"
  );

  return onboardingCard('Upcoming bills', 'Add one, or a few — you can always add more later.', [list, form, continueBtn].filter(Boolean));
}

/** Debts you're paying down — reuses the real Debt form; add as many as you have, one at a time. Entirely optional. */
function renderDebtsStep({ state, dispatch, now, goNext, requestRender }) {
  const debts = getAllDebts(state);
  const list = addedItemsList(debts.map((debt) => ({ title: debt.name, meta: `${formatCents(debt.currentBalanceCents)} owed · ${formatCents(debt.minimumPaymentCents)}/mo min` })));

  const form = renderDebtForm({
    onSubmit: (input) => {
      dispatch(createDebtAction(input, { now }));
      requestRender?.(); // stay on this step — refreshes the added-so-far list and resets the form for another entry
    },
  });

  const continueBtn = el(
    'button',
    { type: 'button', class: debts.length > 0 ? 'btn btn--secondary btn--small' : 'link-button', onclick: goNext },
    debts.length > 0 ? 'Continue' : "I don't have any debts to add right now"
  );

  return onboardingCard(
    'Debts',
    "Anything you're paying down — a credit card, a loan. Add the balance, the minimum payment, and which day of the month it's due. This is just for tracking; it doesn't change your Safe-to-Spend.",
    [list, form, continueBtn].filter(Boolean)
  );
}

/**
 * @param {object} options
 * @param {object} options.state
 * @param {Function} options.dispatch
 * @param {Date} [options.now]
 * @param {() => void} [options.requestRender]
 * @returns {HTMLElement}
 */
function renderOnboarding({ state, dispatch, now = new Date(), requestRender }) {
  const finish = () => dispatch(completeOnboardingAction({ now }));
  const goNext = () => {
    currentStep += 1;
    requestRender?.();
  };

  const steps = [
    () => renderNameStep({ dispatch, goNext }),
    () => renderBasicsStep({ dispatch, goNext }),
    () => renderPaydayStep({ state, dispatch, now, goNext, requestRender }),
    () => renderBillsStep({ state, dispatch, now, goNext, requestRender }),
    () => renderDebtsStep({ state, dispatch, now, goNext, requestRender }),
  ];

  const onLastStep = currentStep >= steps.length;
  const body = onLastStep
    ? el('section', { class: 'card onboarding-finish' }, [
        el('p', { class: 'section-description' }, "That's it — you can change any of this anytime."),
        el('button', { type: 'button', class: 'btn btn--primary', onclick: finish }, 'Finish setup'),
      ])
    : steps[currentStep]();

  return el('div', { class: 'screen screen--onboarding' }, [
    el('header', { class: 'onboarding-header' }, [
      el('h1', {}, "Let's set up your budget"),
      el('p', { class: 'section-description' }, 'A few quick questions, and every one is optional — fill in what you know now, skip the rest.'),
      onLastStep ? null : el('p', { class: 'onboarding-progress' }, `Step ${currentStep + 1} of ${steps.length}`),
      // Not shown on the finish screen — "Finish setup" there is already
      // the same action (completeOnboardingAction), so a second "Skip for
      // now" button next to it would just be a redundant duplicate.
      onLastStep ? null : el('button', { type: 'button', class: 'btn btn--secondary', onclick: finish }, 'Skip for now'),
    ].filter(Boolean)),
    body,
  ]);
}


// ---- src/ui/shell.js ----
// The UI shell: mounts the current view into <main> and re-renders it on
// every store change and every route change. See docs/ARCHITECTURE.md §6.
//
// The app is a real multi-view application again (src/ui/router.js): the
// sidebar (src/ui/components/sidebar.js) switches between dedicated
// screens, each of which wraps its content in the shared app frame
// (src/ui/components/app-frame.js — sidebar + header bar). Routing is
// hash-based and completely independent of the store, so switching
// views, refreshing, and Back/Forward never touch application data.


// Form fields the global "N" shortcut below must never hijack typing in.
const TYPING_TAGS = new Set(['INPUT', 'TEXTAREA', 'SELECT']);

const VIEW_RENDERERS = {
  dashboard: renderDashboard,
  income: renderIncomeView,
  expenses: renderExpensesView,
  bills: renderBillsView,
  debts: renderDebtsView,
  goals: renderGoalsView,
  categories: renderCategoriesView,
  settings: renderSettingsView,
};

/**
 * @param {object} options
 * @param {HTMLElement} options.container
 * @param {import('../core/store.js').createStore} options.store
 * @param {ReturnType<typeof import('../core/events.js').createEventBus>} [options.bus]
 * @param {boolean} [options.persistenceUnavailable]
 * @returns {{ render: () => void }}
 */
function mountShell({ container, store, bus, persistenceUnavailable = false }) {
  container.innerHTML = '';

  const banner = persistenceUnavailable
    ? el(
        'p',
        { class: 'app-banner', role: 'status' },
        "Changes won't be saved on this device right now."
      )
    : null;

  const main = el('main', { class: 'app-main', id: 'main-content' });

  if (banner) container.appendChild(banner);
  container.appendChild(main);

  function render() {
    const state = store.getState();
    const screenProps = { state, dispatch: store.dispatch, now: new Date(), requestRender: render };

    // An explicit theme choice overrides the OS; 'system' (the default)
    // removes both classes so src/styles/base.css's `prefers-color-scheme`
    // media query keeps driving it. A class on <html>, not an attribute.
    const theme = getTheme(state);
    document.documentElement.classList.toggle('theme-dark', theme === 'dark');
    document.documentElement.classList.toggle('theme-light', theme === 'light');

    // Set the active display currency once per render — every `formatCents`
    // call while building the tree below picks it up implicitly. See
    // src/core/money.js's `setActiveCurrency`.
    setActiveCurrency(getCurrency(state));

    main.innerHTML = '';

    // Onboarding takes over the whole screen (no sidebar) until finished
    // or skipped; the route is ignored while it's showing.
    const onboarded = hasCompletedOnboarding(state);
    if (!onboarded) {
      main.appendChild(renderOnboarding(screenProps));
    } else {
      const renderView = VIEW_RENDERERS[getCurrentView()] || renderDashboard;
      main.appendChild(renderView(screenProps));
    }

    // The sidebar (src/ui/components/sidebar.js) is `position: fixed` and
    // its collapsed / drawer-open state is ephemeral module state; the
    // CSS keys off these <body> classes so `.app-main` can offset for the
    // rail and the mobile scrim can show/hide.
    document.body.classList.toggle('has-sidebar', onboarded);
    document.body.classList.toggle('sidebar-collapsed', onboarded && isSidebarCollapsed());
    document.body.classList.toggle('sidebar-drawer-open', onboarded && isSidebarDrawerOpen());

    // Background scroll-lock, derived fresh every render from whether a
    // popup (src/ui/components/popup.js) is present — plus the mobile nav
    // drawer, which locks scroll the same way.
    const lockScroll = main.querySelector('.modal-backdrop') || (onboarded && isSidebarDrawerOpen());
    document.body.style.overflow = lockScroll ? 'hidden' : '';
  }

  // Global "N" shortcut — opens Brain Dump capture from anywhere (the same
  // popup the header's "+ Brain dump" button opens). Attached once, at
  // mount time. Guarded against hijacking typing and against firing
  // during onboarding.
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'n' && event.key !== 'N') return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const target = event.target;
    const isTyping = target instanceof HTMLElement && (TYPING_TAGS.has(target.tagName) || target.isContentEditable);
    if (isTyping) return;
    if (!hasCompletedOnboarding(store.getState())) return;
    event.preventDefault();
    openBrainDumpCapture(render);
  });

  // Route changes (sidebar clicks set location.hash; Back/Forward change
  // it too) re-render and scroll the new view to the top — docs/PRODUCT.md
  // §15/§17. Application data is untouched by any of this.
  initViewRouter(() => {
    render();
    if (typeof window !== 'undefined') window.scrollTo({ top: 0 });
  });

  store.subscribe(render);
  render();

  return { render };
}


// ---- src/main.js ----
// Dev entry point: wires core services + UI shell together. See
// docs/ARCHITECTURE.md §3 and §6. This file is also the build entry point
// for build/build.js.
//
// `rootReducer` and `initAppState` are exported so the store-wiring logic
// (independent of the DOM) can be unit-tested directly — see
// docs/TEST-PLAN.md §2 ("application initialization", "state
// initialization", "storage save/load", "state persistence after reload").

// Imported first (its exports are used by the UI, not here) so the
// DEMO_MODE build flag lands near the top of the built bundle — see
// src/ui/demo-gate.js and build/build.js's --demo flag.

// Each entry delegates one state slice to its module's own reducer,
// keyed by the action-type namespace (e.g. 'incomes/create' -> the
// `incomes` slice). Adding a module means adding one line here, per
// docs/ARCHITECTURE.md §7.
const SLICE_REDUCERS = [
  { key: 'incomes', prefix: 'incomes/', reducer: incomesReducer },
  { key: 'bills', prefix: 'bills/', reducer: billsReducer },
  { key: 'plannedExpenses', prefix: 'plannedExpenses/', reducer: plannedExpensesReducer },
  { key: 'budget', prefix: 'budget/', reducer: budgetReducer },
  { key: 'categoryBudgets', prefix: 'categoryBudgets/', reducer: categoryBudgetsReducer },
  // Brain Dump quick-capture data (docs/DATA-MODEL.md "ExpenseDraft") —
  // deliberately plain, generic slice routing, not a cross-slice special
  // case like expenses/incomes/bills above: creating or deleting a draft
  // never touches budget.currentBalanceCents itself. "Convert to expense"
  // (src/ui/components/inbox-section.js) dispatches a real
  // `expenses/create` (which *does* go through the special case above)
  // followed by `expenseDrafts/delete`, as two ordinary dispatches, not
  // one atomic transition — a draft is not money on its own, so there's
  // nothing for these two slices to ever be transiently inconsistent
  // about the way currentBalanceCents would be.
  { key: 'expenseDrafts', prefix: 'expenseDrafts/', reducer: expenseDraftsReducer },
  // Debt Tracking (docs/DATA-MODEL.md "Debt"). Ordinary create/update/
  // delete/toggle route generically here; only `debts/record-payment` is
  // a cross-slice special case (below), because a payment also logs an
  // Expense and debits Current Balance.
  { key: 'debts', prefix: 'debts/', reducer: debtsReducer },
  // Savings goals (docs/DATA-MODEL.md "Goal"). Plain generic slice
  // routing — no cross-slice effect: a goal's "already put away" amount
  // reduces Safe-to-Spend by being read straight out of `state.goals` by
  // the formula (docs/SAFE-TO-SPEND.md §3d), and creating one never
  // debits Current Balance. (The flat Savings figure used to work the
  // same way; it no longer subtracts from Safe-to-Spend — §9 — and
  // `budget/add-to-savings` *does* now debit the balance, handled as a
  // cross-slice special case in rootReducer below.)
  { key: 'goals', prefix: 'goals/', reducer: goalsReducer },
  { key: 'settings', prefix: 'settings/', reducer: settingsReducer },
];

// Basic app bookkeeping (docs/DATA-MODEL.md §1 already defines
// `meta.lastOpenedAt`) plus delegation to each feature module's own
// reducer. Unknown actions are a no-op by contract (see src/core/store.js).
function rootReducer(state, action) {
  if (action.type === 'meta/touch-last-opened') {
    return { ...state, meta: { ...state.meta, lastOpenedAt: action.now } };
  }

  // Expenses get special handling, not the generic single-slice routing
  // below: logging/editing/deleting one also adjusts Current Balance
  // (docs/DATA-MODEL.md "Current Balance model") — a genuine cross-slice
  // effect that must land in the same state transition as the `expenses`
  // update, computed by src/modules/expenses/balance-effect.js and
  // applied here, the one place with visibility into both slices.
  if (action.type.startsWith('expenses/')) {
    const prevExpenses = state.expenses ?? [];
    const nextExpenses = expensesReducer(prevExpenses, action);
    const deltaCents = computeBalanceDelta(action, prevExpenses, nextExpenses);
    if (nextExpenses === prevExpenses && deltaCents === 0) return state;
    const prevBalanceCents = state.budget?.currentBalanceCents ?? 0;
    return {
      ...state,
      expenses: nextExpenses,
      budget: { ...state.budget, currentBalanceCents: prevBalanceCents + deltaCents },
    };
  }

  // Confirming an Income as received also gets special handling, same
  // shape as the Expenses case above, but touching *three* slices in one
  // transition, not two: the balance effect
  // (src/modules/incomes/balance-effect.js, docs/DATA-MODEL.md "Current
  // Balance model") plus a new historical record
  // (src/modules/income-receipts/, docs/DATA-MODEL.md "IncomeReceipt") —
  // the real log an unbounded period ("All time") sums from, instead of
  // projecting a schedule that has no meaningful "forever" total. Every
  // other `incomes/*` action (create/update/delete/toggle-active) falls
  // through to the generic routing below unchanged, exactly as before
  // this existed.
  if (action.type === 'incomes/mark-received') {
    const prevIncomes = state.incomes ?? [];
    const nextIncomes = incomesReducer(prevIncomes, action);
    const deltaCents = computeIncomeBalanceDelta(action, prevIncomes, nextIncomes);
    if (nextIncomes === prevIncomes && deltaCents === 0) return state;
    const prevBalanceCents = state.budget?.currentBalanceCents ?? 0;
    // Read from prevIncomes — the confirmed income's amount/name don't
    // change during this mutation, but the pre-mutation slice is
    // guaranteed to contain it (the reducer only got this far because a
    // matching id was found).
    const confirmedIncome = prevIncomes.find((income) => income.id === action.id);
    const receipt = createIncomeReceipt(confirmedIncome, new Date(action.now));
    const prevReceipts = state.incomeReceipts ?? [];
    return {
      ...state,
      incomes: nextIncomes,
      incomeReceipts: receipt ? [...prevReceipts, receipt] : prevReceipts,
      budget: { ...state.budget, currentBalanceCents: prevBalanceCents + deltaCents },
    };
  }

  // Marking a Bill paid/unpaid also gets special handling, same shape as
  // the Income case above — touching three slices, not two: the balance
  // effect (src/modules/bills/balance-effect.js, docs/DATA-MODEL.md
  // "Current Balance model" — without this, paying a bill removed it from
  // Safe-to-Spend's `upcomingBillsCents` subtraction but never actually
  // debited the balance, so the money looked like it "came back," a real
  // reported bug) plus a new historical record
  // (src/modules/bill-payments/, docs/DATA-MODEL.md "BillPayment") — the
  // real log a period's "Money out" sums from, so it reflects what was
  // actually paid, not merely what was due. Un-marking a bill (paid ->
  // unpaid again) removes the most recent payment logged for it, undoing
  // the log entry for the specific payment being reversed — a bill can
  // cycle paid/unpaid more than once, and only that one entry corresponds
  // to *this* reversal. Every other `bills/*` action (create/update/
  // delete/toggle-active) falls through to the generic routing below
  // unchanged.
  if (action.type === 'bills/toggle' && action.field === 'paid') {
    const prevBills = state.bills ?? [];
    const nextBills = billsReducer(prevBills, action);
    const deltaCents = computeBillBalanceDelta(action, prevBills, nextBills);
    if (nextBills === prevBills && deltaCents === 0) return state;
    const prevBalanceCents = state.budget?.currentBalanceCents ?? 0;
    const prevPayments = state.billPayments ?? [];
    const confirmedBill = nextBills.find((bill) => bill.id === action.id);
    let nextPayments = prevPayments;
    if (confirmedBill?.paid) {
      // Read from prevBills — the confirmed bill's amount/name don't
      // change during this mutation, but the pre-mutation slice is
      // guaranteed to contain it (the reducer only got this far because a
      // matching id was found).
      const beforeBill = prevBills.find((bill) => bill.id === action.id);
      const payment = createBillPayment(beforeBill, new Date(action.now));
      if (payment) nextPayments = [...prevPayments, payment];
    } else {
      const lastIndex = prevPayments.map((payment) => payment.billId).lastIndexOf(action.id);
      if (lastIndex !== -1) nextPayments = [...prevPayments.slice(0, lastIndex), ...prevPayments.slice(lastIndex + 1)];
    }
    return {
      ...state,
      bills: nextBills,
      billPayments: nextPayments,
      budget: { ...state.budget, currentBalanceCents: prevBalanceCents + deltaCents },
    };
  }

  // Recording a Debt payment: same three-slice-plus-balance shape as the
  // Income/Bill cases above. The debt's own `currentBalanceCents` drops
  // (clamped at 0 — src/modules/debts/reducer.js); a real `Expense` is
  // appended so the money shows in the expense history and reduces
  // Current Balance -> Safe-to-Spend exactly once, through the ordinary
  // Expense pathway (docs/DATA-MODEL.md §3a, SAFE-TO-SPEND.md §3c) — the
  // debt balance itself is never read by the Safe-to-Spend calculation,
  // so there's no double count; and a `DebtPayment` log record is added,
  // the Debt-side counterpart to `BillPayment`. All atomic.
  if (action.type === 'debts/record-payment') {
    const prevDebts = state.debts ?? [];
    const nextDebts = debtsReducer(prevDebts, action);
    if (nextDebts === prevDebts) return state; // no-op: unknown debt, $0/invalid amount, or already at $0
    const debt = prevDebts.find((d) => d.id === action.debtId);
    const expense = buildDebtPaymentExpense(debt, action);
    if (!expense) return { ...state, debts: nextDebts }; // debt balance changed but nothing valid to log — shouldn't happen, guard anyway
    const record = buildDebtPaymentRecord(debt, action, expense.id);
    const prevBalanceCents = state.budget?.currentBalanceCents ?? 0;
    return {
      ...state,
      debts: nextDebts,
      expenses: [...(state.expenses ?? []), expense],
      debtPayments: record ? [...(state.debtPayments ?? []), record] : (state.debtPayments ?? []),
      budget: { ...state.budget, currentBalanceCents: prevBalanceCents - expense.amountCents },
    };
  }

  // Adding money to Savings is a real transfer out of Current Balance,
  // not a bookkeeping label — same cross-slice shape as the cases above,
  // touching two slices in one transition. `budgetReducer` raises
  // `savingsAllocationCents`; here we also debit `currentBalanceCents` by
  // the same amount, so the money reaches Safe-to-Spend exactly once (via
  // the reduced balance — the Savings figure itself is display-only,
  // docs/SAFE-TO-SPEND.md §9). `setSavingsAllocationAction`
  // ('budget/set') — used by onboarding and the "correct the total"
  // pencil — is a plain record edit with NO balance effect, and falls
  // through to the generic routing below unchanged.
  if (action.type === 'budget/add-to-savings') {
    const prevBudget = state.budget ?? {};
    const nextBudget = budgetReducer(prevBudget, action);
    if (nextBudget === prevBudget) return state; // rejected: invalid / $0 / negative
    const prevBalanceCents = prevBudget.currentBalanceCents ?? 0;
    return {
      ...state,
      budget: { ...nextBudget, currentBalanceCents: prevBalanceCents - action.amountCents },
    };
  }

  for (const { key, prefix, reducer } of SLICE_REDUCERS) {
    if (action.type.startsWith(prefix)) {
      const nextSlice = reducer(state[key], action);
      if (nextSlice === state[key]) return state;
      return { ...state, [key]: nextSlice };
    }
  }
  return state;
}

/**
 * A returning user who already had real budget data before onboarding
 * existed (Phases 2-6) shouldn't be interrupted by a "let's set up your
 * budget" flow implying they haven't started anything yet — see
 * src/ui/screens/onboarding.js. Used once, at load, to backfill
 * `onboardingCompletedAt` for such users rather than showing the flow.
 */
function hasExistingBudgetData(state) {
  const budget = state.budget ?? {};
  return (
    (budget.currentBalanceCents ?? 0) !== 0 ||
    (budget.savingsAllocationCents ?? 0) !== 0 ||
    (budget.safetyBufferCents ?? 0) !== 0 ||
    (state.incomes?.length ?? 0) > 0 ||
    (state.bills?.length ?? 0) > 0 ||
    (state.plannedExpenses?.length ?? 0) > 0 ||
    (state.expenses?.length ?? 0) > 0 ||
    (state.categoryBudgets?.length ?? 0) > 0 ||
    (state.incomeReceipts?.length ?? 0) > 0 ||
    (state.billPayments?.length ?? 0) > 0 ||
    (state.debts?.length ?? 0) > 0
  );
}

/**
 * Wires the storage adapter to a fresh store: loads persisted state (or a
 * safe empty state), creates the store, keeps every dispatched change
 * persisted, and records that the app was opened. Pure composition, no
 * DOM — safe to call from tests.
 *
 * @param {object} [options]
 * @param {ReturnType<typeof createStorageAdapter>} [options.storageAdapter]
 * @param {object} [options.storageOptions] passed to createStorageAdapter if storageAdapter isn't given
 * @param {Date} [options.now]
 */
function initAppState(options = {}) {
  const adapter = options.storageAdapter ?? createStorageAdapter(options.storageOptions);
  const now = options.now ?? new Date();
  const initialState = adapter.load();
  const store = createStore(rootReducer, initialState);
  store.subscribe((nextState) => adapter.scheduleSave(nextState));
  store.dispatch({ type: 'meta/touch-last-opened', now: now.toISOString() });
  if (!hasCompletedOnboarding(store.getState()) && hasExistingBudgetData(store.getState())) {
    store.dispatch(completeOnboardingAction({ now }));
  }
  return { store, adapter };
}

/**
 * initAppState(), but degrades to an in-memory-only store rather than
 * throwing if localStorage is unavailable (private-browsing edge cases,
 * storage disabled) — see docs/ARCHITECTURE.md §8.
 */
function initResilientAppState() {
  try {
    const { store, adapter } = initAppState();
    return { store, adapter, persistenceUnavailable: false };
  } catch (error) {
    console.warn('ADHD Budget Planner: local storage is unavailable; continuing without persistence.', error);
    const store = createStore(rootReducer, createEmptyState());
    return { store, adapter: null, persistenceUnavailable: true };
  }
}

/**
 * @param {HTMLElement} container
 * @param {unknown} [error] shown collapsed, for troubleshooting — never
 *   the primary message (docs/PRODUCT.md's calm-not-alarming principle
 *   still applies), but visible without needing dev tools, which turned
 *   out to be the real blocker: getting the actual error out of Safari's
 *   panels via description alone was unreliable in practice.
 */
function renderFatalError(container, error) {
  container.innerHTML = '';
  const message = document.createElement('p');
  message.className = 'fatal-error';
  message.setAttribute('role', 'alert');
  message.textContent =
    'Something went wrong loading the app. Your data is safe on this device — try reloading the page.';
  container.appendChild(message);

  if (error) {
    const details = document.createElement('details');
    details.className = 'fatal-error__details';
    const summary = document.createElement('summary');
    summary.textContent = 'Technical details';
    const pre = document.createElement('pre');
    pre.textContent = error?.stack || `${error?.name || 'Error'}: ${error?.message || String(error)}`;
    details.appendChild(summary);
    details.appendChild(pre);
    container.appendChild(details);
  }
}

function init() {
  const container = document.getElementById('app');
  if (!container) return;

  let adapter = null;
  try {
    const bus = createEventBus();
    const resilient = initResilientAppState();
    adapter = resilient.adapter;
    mountShell({
      container,
      store: resilient.store,
      bus,
      persistenceUnavailable: resilient.persistenceUnavailable,
    });
  } catch (error) {
    // Fail gracefully rather than leaving a blank screen — see
    // docs/ARCHITECTURE.md §8 and CLAUDE.md's error-handling expectations.
    // The real error goes to the console for developers; the user only
    // sees a calm, non-technical message.
    console.error('ADHD Budget Planner failed to start:', error);
    renderFatalError(container, error);
    return;
  }

  if (adapter) {
    const flush = () => adapter.flush();
    // Flush any debounced save on page hide/unload so the last change
    // isn't lost — see docs/ARCHITECTURE.md §5.
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flush();
    });
  }
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}

})();
    </script>
