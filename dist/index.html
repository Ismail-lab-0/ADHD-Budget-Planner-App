  label.categoryInput = input;
  return label;
}

function dateField(labelText, { name, value }) {
  const input = el('input', { type: 'date', name, value: value || '', class: 'field__input' });
  return el('label', { class: 'field' }, [el('span', { class: 'field__label' }, labelText), input]);
}

function expenseTextField(labelText, { name, value, placeholder }) {
  const input = el('input', { type: 'text', name, value: value || '', class: 'field__input', placeholder });
  return el('label', { class: 'field' }, [el('span', { class: 'field__label' }, labelText), input]);
}

/**
 * The fast-add / edit form: Amount + Category up front, everything else
 * (description/date/notes) behind "+ More options" — Phase 7's explicit
 * fast-path is "+ Add Expense → Amount → Category → Save". Editing starts
 * expanded, since there's nothing to hide once values already exist.
 * Exported for reuse by the hero's inline "+ Add expense" form
 * (src/ui/components/safe-to-spend-hero.js).
 * @param {object} options
 * @param {object} options.state used only to build the category field's
 *   suggestions (`getKnownCategories`) — this form reads no other state.
 */
function renderExpenseForm({ state, expense = null, onSubmit, onCancel }) {
  const isEdit = expense != null;
  const amount = amountField('Amount', { name: 'amountCents', valueCents: expense?.amountCents ?? null });
  const category = categoryField(expense?.category, getKnownCategories(state));
  const error = el('p', { class: 'field__error', role: 'alert' });

  const more = renderMoreOptions(
    () => [
      expenseTextField('Description', { name: 'description', value: expense?.description, placeholder: 'Optional' }),
      dateField('Date', { name: 'date', value: expense?.date }),
      expenseTextField('Notes', { name: 'notes', value: expense?.notes, placeholder: 'Optional' }),
    ],
    { startExpanded: isEdit }
  );

  const form = el('form', { class: 'money-form' }, [
    amount,
    category,
    more.toggle,
    more.details,
    error,
    el(
      'div',
      { class: 'money-form__buttons' },
      [
        el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, isEdit ? 'Save' : [icon('receipt'), 'Add expense']),
        isEdit ? el('button', { type: 'button', class: 'btn btn--secondary btn--small', onclick: () => onCancel() }, 'Cancel') : null,
      ].filter(Boolean)
    ),
  ]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const amountCents = parseAmountToCents(amount.amountInput.value);
    if (amountCents == null) {
      error.textContent = 'Enter an amount of 0 or more, like 12.50.';
      return;
    }
    error.textContent = '';

    const formData = new FormData(form);
    const payload = {
      amountCents,
      category: formData.get('category')?.trim() || null,
      description: formData.get('description')?.trim() || null,
      notes: formData.get('notes')?.trim() || null,
    };
    const date = formData.get('date');
    if (date) payload.date = date; // omit when blank so an edit never clobbers it with nothing

    onSubmit(payload);
    if (!isEdit) {
      amount.amountInput.value = '';
      category.categoryInput.value = '';
    }
  });

  return form;
}

/**
 * @param {object} options
 * @param {object} options.state
 * @param {Function} options.dispatch
 * @param {() => void} [options.requestRender]
 * @param {{period: string, from: string|null, to: string|null}} options.period
 *   the header bar's global period selector (src/ui/components/
 *   period-selector.js) — the single source of truth for which stretch of
 *   time this list shows; no per-card filter here anymore.
 */
function renderExpensesSection({ state, dispatch, requestRender, period }) {
  const expenses = getExpensesForPeriod(state, { period: period.period, from: period.from, to: period.to });

  const items = expenses.map((expense) => {
    if (expense.id === editingExpenseId) {
      return el('li', { class: 'money-item money-item--editing' }, [
        renderExpenseForm({
          state,
          expense,
          onSubmit: (changes) => {
            dispatch(updateExpenseAction(expense.id, changes, { now: new Date() }));
            editingExpenseId = null;
            requestRender?.();
          },
          onCancel: () => {
            editingExpenseId = null;
            requestRender?.();
          },
        }),
      ]);
    }
    return renderMoneyItem({
      icon: categoryIconChip(expense.category),
      title: expense.description || expense.category || 'Expense',
      meta: [formatCents(expense.amountCents), expense.category, `${expense.date}`],
      actions: [
        el(
          'button',
          {
            type: 'button',
            class: 'btn btn--secondary btn--small',
            onclick: () => {
              editingExpenseId = expense.id;
              requestRender?.();
            },
          },
          'Edit'
        ),
        el(
          'button',
          {
            type: 'button',
            class: 'btn btn--secondary btn--small',
            onclick: () => {
              if (window.confirm('Delete this expense? Its amount will be added back to your current balance.')) {
                dispatch(deleteExpenseAction(expense.id));
              }
            },
          },
          'Delete'
        ),
      ],
    });
  });

  const list = expenses.length > 0 ? el('ul', { class: 'money-list' }, items) : emptyState('No spending in that period.');

  // Always shown — the header bar's period is always some explicit
  // selection now (no more implicit "Recent" default), so a total is
  // always meaningful.
  const total =
    expenses.length > 0
      ? el('p', { class: 'expenses-filter__total' }, `Total: ${formatCents(getExpensesTotalCents(expenses))} · ${expenses.length} expense${expenses.length === 1 ? '' : 's'}`)
      : null;

  // No add-expense form here — that's the hero's job now (its own inline
  // "+ Add expense" button, src/ui/components/safe-to-spend-hero.js), and
  // no per-card period filter — that's the header bar's job now
  // (src/ui/components/period-selector.js). This section is purely the
  // expenses list + inline edit/delete for whatever period is selected.
  return el(
    'section',
    { class: 'card', 'aria-labelledby': 'expenses-heading' },
    [sectionHeading('receipt', 'Expenses', 'expenses-heading'), total, list].filter(Boolean)
  );
}


// ---- src/ui/components/popup.js ----
// A shared popup/modal helper — every "add" form in the app (Quick
// Actions' four buttons, the Safe-to-Spend hero's "+ Add expense") opens
// through this one function, so the open/close/focus/scroll-lock behavior
// only exists once. Built on the modal CSS foundation in
// src/styles/components.css (".modal-backdrop"/".modal", originally laid
// down in Phase 1, first actually used for Quick Actions).


/**
 * @param {object} options
 * @param {string} options.titleId heading id, for the dialog's aria-labelledby
 * @param {string} options.title
 * @param {HTMLElement} options.body usually a `<form>`
 * @param {() => void} options.onClose called on: the header's close
 *   button, clicking the backdrop itself (not a click that started inside
 *   the popup), or Escape while focus is anywhere inside it.
 * @returns {HTMLElement} append this anywhere — it's `position: fixed`,
 *   so it covers the full viewport regardless of where it sits in the DOM
 *   (verified no ancestor in this codebase sets transform/filter/
 *   will-change, which would otherwise break that).
 */
function renderPopup({ titleId, title, body, onClose }) {
  // Background scroll-lock is NOT handled here — see src/ui/shell.js's
  // render(), which derives `document.body.style.overflow` fresh on every
  // render from whether a `.modal-backdrop` is actually present in the
  // DOM. An earlier version locked/restored it right here, capturing
  // "the overflow value to restore" in this closure — which broke the
  // moment a caller's form `onSubmit` closed the popup by calling its own
  // local close() directly (every caller's `onSubmit: (input) => {
  // dispatch(...); close(); }` does exactly this) instead of routing
  // through this function's close — that path never restored the
  // overflow, so submitting *any* popup form left scroll permanently
  // locked. Deriving it from DOM presence instead makes it self-correcting
  // regardless of which of the several ways a popup can close.
  const header = el('div', { class: 'modal__header' }, [el('h2', { id: titleId }, title), iconButton('close', 'Close', onClose)]);
  const modal = el(
    'div',
    { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
    [header, el('div', { class: 'modal__body' }, [body])]
  );
  const backdrop = el('div', { class: 'modal-backdrop' }, [modal]);
  backdrop.onclick = (event) => {
    if (event.target === backdrop) onClose();
  };
  backdrop.onkeydown = (event) => {
    if (event.key === 'Escape') onClose();
  };

  // This whole tree is still detached at this point — the caller's render
  // pass builds it, then attaches it to `document` in one shot afterward
  // (see src/ui/shell.js's `main.appendChild(...)`). Calling `.focus()`
  // on a detached element is a silent no-op in a real browser, so the
  // focus move has to wait until right after that attach actually
  // happens — one animation frame is enough and keeps this framework-free.
  requestAnimationFrame(() => focusFirstField(modal));

  return backdrop;
}


// ---- src/modules/safe-to-spend/recurrence.js ----
// Date-occurrence resolution for recurring/one-time Income and Bill
// records. See docs/SAFE-TO-SPEND.md for the full reasoning — income and
// bills are deliberately NOT treated symmetrically for a past one-time
// date: a past one-time income is presumed already received (excluded —
// it can't be a future payday), while a past one-time bill is presumed
// still owed if unpaid (included — overdue debt doesn't stop being debt).


const RECURRING_STEPPERS = {
  weekly: (d) => addDays(d, 7),
  biweekly: (d) => addDays(d, 14),
  monthly: (d) => addMonths(d, 1),
};

/** Rolls a recurring date forward to the first occurrence on/after `today`. */
function rollForwardRecurring(dateStr, frequency, today) {
  const stepper = RECURRING_STEPPERS[frequency];
  if (!stepper) return null;
  let date = parseLocalDate(dateStr);
  const todayKey = getLocalDateKey(today);
  let iterations = 0;
  // Guards against pathological input; a real recurring record should
  // never need more than a couple thousand steps (~38 years weekly) to
  // reach "today".
  while (getLocalDateKey(date) < todayKey && iterations < 2000) {
    date = stepper(date);
    iterations += 1;
  }
  return getLocalDateKey(date);
}

/**
 * When does this income next arrive, on or after `today`? A past
 * one-time income has no next occurrence (presumed already received —
 * see docs/SAFE-TO-SPEND.md "how recurring income is handled").
 * @param {string|null} dateStr YYYY-MM-DD
 * @param {'one-time'|'weekly'|'biweekly'|'monthly'} frequency
 * @param {Date} today
 * @returns {string|null} YYYY-MM-DD
 */
function getNextIncomeDate(dateStr, frequency, today) {
  if (!dateStr) return null;
  if (frequency === 'one-time' || !frequency) {
    const key = getLocalDateKey(parseLocalDate(dateStr));
    return key >= getLocalDateKey(today) ? key : null;
  }
  return rollForwardRecurring(dateStr, frequency, today);
}

/**
 * When is this bill currently due? A one-time bill keeps its own date
 * even if it's in the past (still owed if unpaid) — only recurring bills
 * roll forward to their current cycle.
 * @param {string|null} dateStr YYYY-MM-DD
 * @param {'one-time'|'weekly'|'monthly'} recurrence
 * @param {Date} today
 * @returns {string|null} YYYY-MM-DD
 */
function getCurrentBillDueDate(dateStr, recurrence, today) {
  if (!dateStr) return null;
  if (recurrence === 'one-time' || !recurrence) {
    return getLocalDateKey(parseLocalDate(dateStr));
  }
  return rollForwardRecurring(dateStr, recurrence, today);
}

/**
 * Every occurrence of a recurring (or one-time) income landing within
 * `[startKey, endKey]` (inclusive). Originally used for the dashboard's
 * period-scoped "money in" figure; **not currently called by anything** —
 * `getPeriodSummary` (src/modules/dashboard/index.js) switched to summing
 * real `IncomeReceipt` records instead, since a *projection* of scheduled
 * income read as "money in" when it was really "money about to arrive," a
 * real reported point of confusion. Kept, still fully tested
 * (tests/unit/safe-to-spend-recurrence.test.js), in case a distinct,
 * separately-labeled "projected/expected income" view is ever wanted
 * later — same "still a working, reusable primitive" precedent as
 * `categoryEmojiBadge` (src/ui/components/icons.js).
 *
 * Important limitation, inherent to the data model, not this function:
 * Income records aren't logged transaction history, only a forward-looking
 * schedule (`nextDate` + `frequency`) — there is nothing to roll
 * *backward*. This never returns a date before `today`, so a period
 * entirely in the past (e.g. "Last month") correctly yields `[]` rather
 * than a fabricated number. `endKey` is required (not optional) for the
 * same reason `getNextIncomeDate` never runs unbounded: an open-ended
 * range would mean "every future paycheck forever," which isn't a
 * meaningful sum — callers with no concrete end date should treat
 * "money in" as not applicable for that period rather than call this.
 *
 * @param {string|null} dateStr YYYY-MM-DD
 * @param {'one-time'|'weekly'|'biweekly'|'monthly'} frequency
 * @param {Date} today
 * @param {string|null} startKey YYYY-MM-DD, or null for "from today"
 * @param {string} endKey YYYY-MM-DD, required
 * @returns {string[]} occurrence dates, ascending
 */
function getIncomeOccurrencesInRange(dateStr, frequency, today, startKey, endKey) {
  if (!dateStr || endKey == null) return [];
  const todayKey = getLocalDateKey(today);
  const effectiveStart = startKey && startKey > todayKey ? startKey : todayKey; // never before today — see doc comment above
  if (effectiveStart > endKey) return [];

  if (frequency === 'one-time' || !frequency) {
    const key = getLocalDateKey(parseLocalDate(dateStr));
    return key >= effectiveStart && key <= endKey ? [key] : [];
  }

  const stepper = RECURRING_STEPPERS[frequency];
  if (!stepper) return [];

  let date = parseLocalDate(dateStr);
  let iterations = 0;
  // Same 2000-iteration guard as rollForwardRecurring, for the same reason.
  while (getLocalDateKey(date) < effectiveStart && iterations < 2000) {
    date = stepper(date);
    iterations += 1;
  }

  const occurrences = [];
  iterations = 0;
  while (getLocalDateKey(date) <= endKey && iterations < 2000) {
    occurrences.push(getLocalDateKey(date));
    date = stepper(date);
    iterations += 1;
  }
  return occurrences;
}


// ---- src/modules/safe-to-spend/calculation.js ----
// The Safe-to-Spend calculation. Pure function of (state, now) — no DOM,
// no side effects. See docs/SAFE-TO-SPEND.md for the full reasoning
// behind every decision here; this file implements that document, it
// doesn't redefine it. Money in, money out, all in integer cents (see
// src/core/money.js).


// Every collection read below is guarded with `Array.isArray(x) ? x : []`
// rather than the narrower `x ?? []` — a corrupted/hand-edited localStorage
// value can be *present but the wrong type* (an object, a string), not just
// missing, and `for...of` on a non-iterable throws. See Phase 8 QA
// (docs/QA-REPORT.md) — this function must never throw regardless of what
// shape a stored collection has degraded into.

/**
 * Sum of active, unpaid bills due on/before `horizonKey` (or all of them if
 * `horizonKey` is null). **Display-only as of the "bills only reduce
 * Safe-to-Spend once marked paid" change (see docs/SAFE-TO-SPEND.md §2/§6)
 * — this total is no longer part of `totalCommittedCents`/`safeToSpendCents`.**
 * An unpaid bill has zero effect on Safe-to-Spend; only the Current Balance
 * debit that happens when a bill is actually marked paid
 * (`src/modules/bills/balance-effect.js`) moves the number, the same way
 * an Expense does. Kept (and still returned as `upcomingBillsCents`) so a
 * future UI can show "$X in upcoming bills" the same way `upcomingIncomeCents`
 * already does.
 */
function sumUpcomingBills(bills, today, horizonKey) {
  let totalCents = 0;
  for (const bill of Array.isArray(bills) ? bills : []) {
    if (!bill || !bill.active || bill.paid) continue;
    if (!isValidAmountCents(bill.amountCents)) continue;
    if (!bill.dueDate) {
      totalCents += bill.amountCents; // no date at all — conservatively always counts
      continue;
    }
    const dueKey = getCurrentBillDueDate(bill.dueDate, bill.recurrence, today);
    if (dueKey == null) continue;
    if (horizonKey == null || dueKey <= horizonKey) totalCents += bill.amountCents;
  }
  return totalCents;
}

/** Sum of planned expenses due on/before `horizonKey` (undated ones always count — see docs/SAFE-TO-SPEND.md). */
function sumCommittedPlannedExpenses(plannedExpenses, horizonKey) {
  let totalCents = 0;
  for (const expense of Array.isArray(plannedExpenses) ? plannedExpenses : []) {
    if (!expense || !isValidAmountCents(expense.amountCents)) continue;
    if (!expense.plannedDate || horizonKey == null || expense.plannedDate <= horizonKey) {
      totalCents += expense.amountCents;
    }
  }
  return totalCents;
}

/** The earliest upcoming occurrence across all active income sources, or null if none. */
function findNextPaydayDate(incomes, today) {
  let earliest = null;
  for (const income of Array.isArray(incomes) ? incomes : []) {
    if (!income || !income.active) continue;
    const occurrence = getNextIncomeDate(income.nextDate, income.frequency, today);
    if (occurrence != null && (earliest == null || occurrence < earliest)) {
      earliest = occurrence;
    }
  }
  return earliest;
}

/**
 * Sum of active income landing exactly on `horizonKey` (i.e. the income(s)
 * that *are* the next payday). Purely informational, for display — see
 * docs/SAFE-TO-SPEND.md §3: this is never added to `safeToSpendCents`.
 */
function sumIncomeAtHorizon(incomes, today, horizonKey) {
  if (horizonKey == null) return 0;
  let totalCents = 0;
  for (const income of Array.isArray(incomes) ? incomes : []) {
    if (!income || !income.active) continue;
    if (!isValidAmountCents(income.amountCents)) continue;
    const occurrence = getNextIncomeDate(income.nextDate, income.frequency, today);
    if (occurrence === horizonKey) totalCents += income.amountCents;
  }
  return totalCents;
}

/**
 * @param {object} state
 * @param {{now?: Date}} [options]
 * @returns {{
 *   currentBalanceCents: number,
 *   upcomingIncomeCents: number,
 *   upcomingBillsCents: number, // display-only — see sumUpcomingBills; not part of safeToSpendCents
 *   plannedExpensesCents: number,
 *   savingsAllocationCents: number,
 *   safeToSpendCents: number,
 *   nextPaydayDate: string|null,
 *   daysUntilPayday: number|null,
 *   dailyAllowanceCents: number|null,
 *   isNegative: boolean,
 * }}
 */
function getSafeToSpend(state, { now = new Date() } = {}) {
  const budget = state?.budget ?? {};
  // A balance may legitimately be negative (docs/DATA-MODEL.md "Current
  // Balance model") — using the non-negative-only guard here would
  // silently zero out a real negative balance, corrupting the result.
  const currentBalanceCents = isValidBalanceCents(budget.currentBalanceCents) ? budget.currentBalanceCents : 0;
  const savingsAllocationCents = isValidAmountCents(budget.savingsAllocationCents) ? budget.savingsAllocationCents : 0;

  const nextPaydayDate = findNextPaydayDate(state?.incomes, now);
  const daysUntilPayday = nextPaydayDate != null ? daysBetween(now, parseLocalDate(nextPaydayDate)) : null;

  const upcomingBillsCents = sumUpcomingBills(state?.bills, now, nextPaydayDate);
  const plannedExpensesCents = sumCommittedPlannedExpenses(state?.plannedExpenses, nextPaydayDate);
  const upcomingIncomeCents = sumIncomeAtHorizon(state?.incomes, now, nextPaydayDate);

  // upcomingBillsCents is deliberately NOT part of this sum — see the
  // sumUpcomingBills doc comment above and docs/SAFE-TO-SPEND.md §2/§6.
  // A bill only reduces Safe-to-Spend once it's actually marked paid,
  // via the Current Balance debit already baked into currentBalanceCents.
  const totalCommittedCents = plannedExpensesCents + savingsAllocationCents;
  const safeToSpendCents = currentBalanceCents - totalCommittedCents; // upcomingIncomeCents deliberately excluded — see docs/SAFE-TO-SPEND.md §3

  // Same-day payday (0 days) is treated as a 1-day window for the daily
  // rate rather than dividing by zero — see docs/SAFE-TO-SPEND.md.
  const dailyAllowanceCents =
    daysUntilPayday == null ? null : Math.round(safeToSpendCents / Math.max(daysUntilPayday, 1));

  return {
    currentBalanceCents,
    upcomingIncomeCents,
    upcomingBillsCents,
    plannedExpensesCents,
    savingsAllocationCents,
    // The exact sum already used above to derive safeToSpendCents — the UI
    // needs this to show "how much is committed" (e.g. a progress bar), and
    // must never re-derive it itself (see docs/SAFE-TO-SPEND.md §11b and
    // CLAUDE.md — money arithmetic belongs in this module, not src/ui/).
    totalCommittedCents,
    safeToSpendCents,
    nextPaydayDate,
    daysUntilPayday,
    dailyAllowanceCents,
    isNegative: safeToSpendCents < 0,
  };
}

/**
 * Convenience accessor matching docs/ARCHITECTURE.md's documented
 * `getSpendingAllowance(state)` interface — derived from the same
 * calculation, not recomputed separately.
 */
function getSpendingAllowance(state, options) {
  return getSafeToSpend(state, options).dailyAllowanceCents;
}

// Never "you can afford this" — always framed as an estimate, since it's

const PLANNING_DISCLAIMER =
  "This is a planning estimate based on what you've entered — the app doesn't connect to or verify your bank accounts.";

/**
 * Extra context copy for the negative/zero cases, where showing the raw
 * number alone risks reading as either a data error or (if ever clamped)
 * misleading positive guidance. Neutral, non-judgmental — states what's
 * true without blaming the user. Returns null for an ordinary positive
 * result, where the number speaks for itself.
 * @param {ReturnType<typeof import('./calculation.js').getSafeToSpend>} result
 * @returns {string|null}
 */
function getSafeToSpendMessage(result) {
  if (result.safeToSpendCents < 0) {
    const overBy = formatCents(Math.abs(result.safeToSpendCents));

  if (result.safeToSpendCents === 0) {
    return "Nothing is estimated as safe to spend right now — everything available is already committed.";
  }
  return null;
}

// ---- src/modules/bills/reducer.js ----

const BILL_RECURRENCES = ['one-time', 'weekly', 'monthly'];
const BILL_EDITABLE_FIELDS = ['name', 'amountCents', 'dueDate', 'recurrence'];

function validateNewBill(candidate) {
  if (!candidate) return null;
  const name = typeof candidate.name === 'string' ? candidate.name.trim() : '';
  if (!name || !isValidAmountCents(candidate.amountCents)) return null;
  const recurrence = BILL_RECURRENCES.includes(candidate.recurrence) ? candidate.recurrence : 'one-time';
  return { ...candidate, name, recurrence };
}

function sanitizeBillChanges(changes = {}) {
  const sanitized = {};
  for (const field of BILL_EDITABLE_FIELDS) {
    if (field in changes) sanitized[field] = changes[field];
  }
  if ('name' in sanitized) {
    const trimmed = typeof sanitized.name === 'string' ? sanitized.name.trim() : '';
    if (trimmed) sanitized.name = trimmed;
    else delete sanitized.name;
  }
  if ('amountCents' in sanitized && !isValidAmountCents(sanitized.amountCents)) {
    delete sanitized.amountCents;
  }
  if ('recurrence' in sanitized && !BILL_RECURRENCES.includes(sanitized.recurrence)) {
    delete sanitized.recurrence;
  }
  return sanitized;
}

const billsReducer = createListReducer({
  actionPrefix: 'bills',
  entityKey: 'bill',

// ---- src/modules/bills/balance-effect.js ----
// How marking a Bill paid/unpaid affects the Current Balance checkpoint.
// See docs/DATA-MODEL.md "Current Balance model" — mirrors src/modules/
// expenses/balance-effect.js and src/modules/incomes/balance-effect.js's
// pattern exactly (a pure function deciding *how much* to adjust, applied
// atomically by src/main.js's rootReducer), but for the single `bills/
// toggle` action with `field: 'paid'`. Ordinary create/update/delete and
// the `field: 'active'` toggle never touch the balance, same as before
// this existed.
//
// Why this exists: originally added to fix a real reported bug, back when
// `sumCommittedBills` (src/modules/safe-to-spend/calculation.js) excluded
// paid bills from a subtracted `upcomingBillsCents` term — without this
// effect, nothing ever actually left Current Balance when a bill was
// marked paid, so Safe-to-Spend visibly went *up* by that amount, as if
// the money had "come back." As of a later, explicit user request, bills
// no longer subtract from Safe-to-Spend at all while unpaid (see
// docs/SAFE-TO-SPEND.md §2/§7) — so this debit is no longer "canceling
// out" an earlier subtraction, it's the *only* time a bill's amount ever
// reduces Safe-to-Spend, the first and only time it counts. Un-marking a
// bill as paid (toggling back to unpaid) symmetrically refunds it,
// mirroring an Expense delete.
//
// Deliberately narrower than Expenses, same simplification already
// documented for Income: editing a bill's amount or deleting it after
// it's been marked paid does not retroactively adjust the balance. Also
// worth knowing: if a payment is *both* marked paid here *and* separately
// logged as an Expense, that's a double deduction — this app doesn't link
// the two, consistent with `docs/PRODUCT.md` §5's "not a full accounting/
// double-entry bookkeeping system" non-goal. Use one or the other for a
// given real-world payment, not both.


/**
 * @param {{type: string, id?: string, field?: string}} action
 * @param {Array} prevBills the `bills` slice before this action
 * @param {Array} nextBills the `bills` slice after this action
 * @returns {number} signed cents to add to currentBalanceCents (negative = paid, positive = un-marked/refunded)
 */
function computeBillBalanceDelta(action, prevBills, nextBills) {
  if (action.type !== 'bills/toggle' || action.field !== 'paid') return 0;
  if (nextBills === prevBills) return 0; // the reducer no-op'd (unknown id) — nothing to apply

  const after = nextBills.find((bill) => bill.id === action.id);
  if (!after || !isValidAmountCents(after.amountCents)) return 0;

  return after.paid ? -after.amountCents : after.amountCents;
}

/**
 * Exported for reuse as a compact quick-add form (the dashboard's Quick
 * Actions, and the onboarding flow's "Upcoming bills" step). Name + Amount
 * up front; Due date/Recurrence behind "+ More options" (Phase 7 — fewer
 * decisions for the common case; sensible defaults apply automatically if
 * left collapsed). Editing starts expanded.
 */
function renderBillForm({ bill = null, onSubmit, onCancel }) {
  const isEdit = bill != null;
  const nameInput = el('input', {
    type: 'text',
    name: 'name',
    class: 'field__input',
    placeholder: 'Bill name, e.g. "Rent"',
    value: bill?.name ?? '',
    'aria-label': 'Bill name',
  });
  const amount = amountField('Amount', { name: 'amountCents', valueCents: bill?.amountCents ?? null });
  const error = el('p', { class: 'field__error', role: 'alert' });

  const more = renderMoreOptions(
    () => [billDateField('Due date', { name: 'dueDate', value: bill?.dueDate }), recurrenceField(bill?.recurrence ?? 'one-time')],
    { startExpanded: isEdit }
  );

  const form = el('form', { class: 'money-form' }, [
    nameInput,
    amount,
    more.toggle,
    more.details,
    error,
    el(
      'div',
      { class: 'money-form__buttons' },
      [
        el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, isEdit ? 'Save' : [icon('file-text'), 'Add bill']),
        isEdit ? el('button', { type: 'button', class: 'btn btn--secondary btn--small', onclick: () => onCancel() }, 'Cancel') : null,
      ].filter(Boolean)
    ),
  ]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = nameInput.value.trim();
    const amountCents = parseAmountToCents(amount.amountInput.value);
    if (!name || amountCents == null) {
      error.textContent = 'Enter a name and a valid amount (0 or more).';
      return;
    }
    error.textContent = '';

    const formData = new FormData(form);
    const payload = { name, amountCents, recurrence: formData.get('recurrence') };
    const dueDate = formData.get('dueDate');
    if (dueDate) payload.dueDate = dueDate;

    onSubmit(payload);
    if (!isEdit) {
      nameInput.value = '';
      amount.amountInput.value = '';
    }
  });

  return form;
}

const INCOME_FREQUENCIES = ['one-time', 'weekly', 'biweekly', 'monthly'];
const INCOME_EDITABLE_FIELDS = ['name', 'amountCents', 'frequency', 'nextDate'];

function validateNewIncome(candidate) {
  if (!candidate) return null;
  const name = typeof candidate.name === 'string' ? candidate.name.trim() : '';
  if (!name || !isValidAmountCents(candidate.amountCents)) return null;
  const frequency = INCOME_FREQUENCIES.includes(candidate.frequency) ? candidate.frequency : 'one-time';
  return { ...candidate, name, frequency };
}

function sanitizeIncomeChanges(changes = {}) {
  const sanitized = {};
  for (const field of INCOME_EDITABLE_FIELDS) {
    if (field in changes) sanitized[field] = changes[field];
  }
  if ('name' in sanitized) {
    const trimmed = typeof sanitized.name === 'string' ? sanitized.name.trim() : '';
    if (trimmed) sanitized.name = trimmed;
    else delete sanitized.name;
  }
  if ('amountCents' in sanitized && !isValidAmountCents(sanitized.amountCents)) {
    delete sanitized.amountCents;
  }
  if ('frequency' in sanitized && !INCOME_FREQUENCIES.includes(sanitized.frequency)) {
    delete sanitized.frequency;
  }
  return sanitized;
}

const baseIncomesReducer = createListReducer({
  actionPrefix: 'incomes',
  entityKey: 'income',
  validateNew: validateNewIncome,
  sanitizeChanges: sanitizeIncomeChanges,
});

/**
 * Wraps the generic list reducer with one bespoke case:
 * `incomes/mark-received` isn't a plain field toggle (see
 * src/modules/incomes/actions.js `markIncomeReceivedAction`) — a one-time
 * income becomes permanently `received: true`, while a recurring income's
 * `nextDate` advances to its next cycle instead, so it never gets
 * permanently "stuck" as received. The actual Current Balance credit is a
 * separate cross-slice effect (src/modules/incomes/balance-effect.js),
 * applied atomically by src/main.js's rootReducer, mirroring how Expenses
 * affect the balance.
 */
function incomesReducer(items = [], action) {
  if (action.type === 'incomes/mark-received') {
    const index = items.findIndex((item) => item.id === action.id);
    if (index === -1) return items;
    const income = items[index];
    const next = items.slice();
    if (income.frequency === 'one-time' || !income.frequency) {
      if (income.received) return items; // already received — no-op
      next[index] = { ...income, received: true, updatedAt: action.now };
    } else {
      if (!income.nextDate) return items; // nothing to advance from
      const advanced = advanceByFrequency(parseLocalDate(income.nextDate), income.frequency);
      next[index] = { ...income, nextDate: getLocalDateKey(advanced), updatedAt: action.now };
    }
    return next;
  }
  return baseIncomesReducer(items, action);
}


// ---- src/modules/incomes/balance-effect.js ----
// How confirming an Income as received affects the Current Balance
// checkpoint. See docs/DATA-MODEL.md "Current Balance model" — mirrors
// src/modules/expenses/balance-effect.js's pattern exactly (a pure
// function deciding *how much* to credit, applied atomically by
// src/main.js's rootReducer), but only for the single `incomes/
// mark-received` action; ordinary create/update/delete/toggle on an
// Income never touch the balance, same as before this existed.
//
// Deliberately narrower than the Expense version: editing or deleting an
// income that was already marked received does NOT retroactively adjust
// the balance (an already-recurring income doesn't even keep a durable
// "received" marker to hang that adjustment on — see reducer.js). This
// keeps scope narrow, consistent with docs/PRODUCT.md §5's non-goal "not
// a full accounting/double-entry bookkeeping system" — the same
// simplification Bills' `paid` flag already has no balance-linkage at
// all. If this ever needs to change, it's a deliberate product decision,
// not a bug.


/**
 * @param {{type: string, id?: string}} action
 * @param {Array} prevIncomes the `incomes` slice before this action
 * @param {Array} nextIncomes the `incomes` slice after this action
 * @returns {number} cents to add to currentBalanceCents (always >= 0 — income only ever credits)
 */
function computeIncomeBalanceDelta(action, prevIncomes, nextIncomes) {
  if (action.type !== 'incomes/mark-received') return 0;
  if (nextIncomes === prevIncomes) return 0; // the reducer no-op'd (already received, unknown id, etc.) — nothing to credit

  const before = prevIncomes.find((income) => income.id === action.id);
  // Corrupted stored amountCents (hand-edited/pre-validation localStorage
  // data) contributes 0 rather than NaN-poisoning currentBalanceCents —
  // same defensive pattern as expenses/balance-effect.js.
  return before && isValidAmountCents(before.amountCents) ? before.amountCents : 0;
}

/**

 *   effect in this codebase uses, so a bad stored value can't
 *   NaN-poison a receipt).

function createIncomeReceipt(income, now) {

function getIncomeReceiptsForPeriod(state, { startDateKey = null, endDateKey = null } = {}) {

    if (!receipt?.date) return false;

/**
 * Sum of a list of receipts' amounts, skipping any with a corrupted/
 * invalid `amountCents` rather than letting one bad value NaN-poison the
 * total (same defensive pattern as every other *TotalCents helper in this
 * codebase).

function getIncomeReceiptsTotalCents(receipts) {

    totalCents += receipt.amountCents;
  }

}

// The Bill Payments module's public interface. See docs/ARCHITECTURE.md
// §7 and docs/DATA-MODEL.md "BillPayment". Not a user-facing CRUD module
// — no create/update/delete actions — just the automatic historical log
// created/un-created by src/modules/bills/ "Mark paid"/"Mark unpaid" and
// read by src/modules/dashboard/index.js's `getPeriodSummary`.



// ---- src/modules/dashboard/index.js ----
// The Dashboard module: composition/selection logic for what the
// dashboard displays, as distinct from the Safe-to-Spend *arithmetic*
// (src/modules/safe-to-spend/), which this module never recomputes or
// duplicates — see docs/ARCHITECTURE.md §7 ("the Dashboard module is the
// only module allowed to depend on many other modules' selectors at
// once"). This file only decides *what to list* and *in what order*;
// every dollar figure the dashboard shows comes from
// `getSafeToSpend(state)` directly.


const DEFAULT_LIMIT = 5;

/**
 * The most relevant upcoming commitments (active, unpaid bills + planned
 * expenses) for a short "at a glance" list — not a full ledger. Dated
 * items sort soonest-first; undated items sort last. See Phase 4 §
 * "Upcoming Commitments" — "do not display a giant transaction table."
 *
 * @param {object} state
 * @param {{limit?: number}} [options]
 * @returns {{items: Array<{id: string, kind: 'bill'|'plannedExpense', name: string, amountCents: number, date: string|null}>, remainingCount: number}}
 */
function getUpcomingCommitments(state, { limit = DEFAULT_LIMIT } = {}) {
  const relevantBills = getAllBills(state)
    .filter((bill) => bill.active && !bill.paid)
    .map((bill) => ({ id: bill.id, kind: 'bill', name: bill.name, amountCents: bill.amountCents, date: bill.dueDate ?? null }));

  const relevantPlannedExpenses = getAllPlannedExpenses(state).map((expense) => ({
    id: expense.id,
    kind: 'plannedExpense',
    name: expense.name,
    amountCents: expense.amountCents,
    date: expense.plannedDate ?? null,
  }));

  const combined = [...relevantBills, ...relevantPlannedExpenses].sort((a, b) => {
    if (a.date && b.date) return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    if (a.date && !b.date) return -1;
    if (!a.date && b.date) return 1;
    return 0;
  });

  return {
    items: combined.slice(0, limit),
    remainingCount: Math.max(combined.length - limit, 0),
  };
}

/**
 * The nearest active, unpaid bills, soonest-due first (undated last) — the
 * subset of `getUpcomingCommitments` that's bills only, for a dedicated
 * "Bills due soon" highlight. Same sort convention, no money arithmetic.
 * @param {object} state
 * @param {{limit?: number}} [options]
 * @returns {{items: Array<{id: string, name: string, amountCents: number, date: string|null}>, totalCount: number}}
 */
function getUpcomingBills(state, { limit = 3 } = {}) {
  const bills = getAllBills(state)
    .filter((bill) => bill.active && !bill.paid)
    .map((bill) => ({ id: bill.id, name: bill.name, amountCents: bill.amountCents, date: bill.dueDate ?? null }))
    .sort((a, b) => {
      if (a.date && b.date) return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      if (a.date && !b.date) return -1;
      if (!a.date && b.date) return 1;
      return 0;
    });

  return { items: bills.slice(0, limit), totalCount: bills.length };
}

/**
 * The nearest not-yet-received incomes, soonest-due first — the "Upcoming
 * income" card's shortlist (src/ui/components/upcoming-income.js), same
 * shape/convention as `getUpcomingBills`. Not period-scoped — like Bills
 * due soon, this is always "what's next," regardless of the header bar's
 * global period selector.
 * @param {object} state
 * @param {{limit?: number}} [options]
 * @returns {{items: Array<{id: string, name: string, amountCents: number, date: string|null, frequency: string}>, totalCount: number}}
 */
function getUpcomingIncome(state, { limit = 3 } = {}) {
  const incomes = getUnreceivedIncomes(state)
    .map((income) => ({ id: income.id, name: income.name, amountCents: income.amountCents, date: income.nextDate ?? null, frequency: income.frequency }))
    .sort((a, b) => {
      if (a.date && b.date) return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      if (a.date && !b.date) return -1;
      if (!a.date && b.date) return 1;
      return 0;
    });

  return { items: incomes.slice(0, limit), totalCount: incomes.length };
}

/**
 * The header bar's global period selector feeds every period-scoped card
 * (This Period, Expenses) through this one function — see
 * docs/ARCHITECTURE.md and src/ui/screens/dashboard.js. Deliberately never
 * used by Safe-to-Spend or Current Balance, which are always "right now"
 * snapshots regardless of the selected period.
 *
 * Both figures are sums of a real, dated, historical log — never a
 * projection of what's *scheduled* — so both work identically for any
 * period, bounded or not, with no special-casing between them:
 * - `moneyInCents`: every `IncomeReceipt` (`docs/DATA-MODEL.md`) whose
 *   date falls in range — created automatically each time an Income is
 *   confirmed received ("Mark received"). An Income that's merely
 *   *upcoming* (scheduled but not yet confirmed) never counts here — see
 *   "Upcoming income" (`getUpcomingIncome` below) for that, a
 *   deliberately separate, non-period-scoped concept.
 * - `moneyOutCents`: every logged `Expense` *plus* every `BillPayment`
 *   whose date falls in range — created automatically each time a Bill is
 *   confirmed paid ("Mark paid"). A Bill that's merely *due* in the
 *   period never counts here either — see `billsDueCount` below for that.
 *
 * This used to differ: bounded periods projected from each income's
 * `nextDate`/`frequency` (`getIncomeOccurrencesInRange`) rather than
 * reading confirmed receipts, and bills never contributed to "Money out"
 * at all regardless of paid status. Both were real reported points of
 * confusion — an amount showing as "in"/"out" before it had actually
 * happened. `getIncomeOccurrencesInRange` is kept, unused by this file
 * now, in case a *distinct*, separately-labeled "projected" view is ever
 * wanted later (see its own doc comment).
 *
 * @param {object} state
 * @param {{startDateKey?: string|null, endDateKey?: string|null, now?: Date}} [options]
 * @returns {{moneyInCents: number, moneyOutCents: number, billsDueCount: number}}
 */
function getPeriodSummary(state, { startDateKey = null, endDateKey = null, now = new Date() } = {}) {
  const periodExpenses = getExpensesForPeriod(state, { period: 'custom', from: startDateKey, to: endDateKey, now });
  const periodPayments = getBillPaymentsForPeriod(state, { startDateKey, endDateKey });
  const moneyOutCents = getExpensesTotalCents(periodExpenses) + getBillPaymentsTotalCents(periodPayments);

  const periodReceipts = getIncomeReceiptsForPeriod(state, { startDateKey, endDateKey });
  const moneyInCents = getIncomeReceiptsTotalCents(periodReceipts);

  const billsDueCount = getAllBills(state).filter((bill) => {
    if (!bill || !bill.active || bill.paid) return false;
    if (!bill.dueDate) return true; // no date at all — conservatively always counts, same convention as safe-to-spend/calculation.js
    const dueKey = getCurrentBillDueDate(bill.dueDate, bill.recurrence, now);
    if (dueKey == null) return false;
    if (startDateKey != null && dueKey < startDateKey) return false;
    if (endDateKey != null && dueKey > endDateKey) return false;
    return true;
  }).length;

  return { moneyInCents, moneyOutCents, billsDueCount };
}

/**
 * Exported for reuse as a compact quick-add form (the dashboard's Quick
 * Actions). Name + Amount + Next date up front — the date matters too
 * much to Safe-to-Spend's payday horizon to bury it — with only Frequency
 * (which defaults sensibly to one-time) behind "+ More options" (Phase 7).
 * Editing starts expanded.
 */
function renderIncomeForm({ income = null, onSubmit, onCancel }) {
  const isEdit = income != null;
  const nameInput = el('input', {
    type: 'text',
    name: 'name',
    class: 'field__input',
    placeholder: 'Income name, e.g. "Paycheck"',
    value: income?.name ?? '',
    'aria-label': 'Income name',
  });
  const amount = amountField('Amount', { name: 'amountCents', valueCents: income?.amountCents ?? null });
  const error = el('p', { class: 'field__error', role: 'alert' });

  const more = renderMoreOptions(() => [frequencyField(income?.frequency ?? 'one-time')], { startExpanded: isEdit });

  const form = el('form', { class: 'money-form' }, [
    nameInput,
    amount,
    incomeDateField('Next date', { name: 'nextDate', value: income?.nextDate }),
    more.toggle,
    more.details,
    error,
    el(
      'div',
      { class: 'money-form__buttons' },
      [
        el('button', { type: 'submit', class: 'btn btn--primary btn--small' }, isEdit ? 'Save' : [icon('trending-up'), 'Add income']),
        isEdit ? el('button', { type: 'button', class: 'btn btn--secondary btn--small', onclick: () => onCancel() }, 'Cancel') : null,
      ].filter(Boolean)
    ),
  ]);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = nameInput.value.trim();
    const amountCents = parseAmountToCents(amount.amountInput.value);
    if (!name || amountCents == null) {
      error.textContent = 'Enter a name and a valid amount (0 or more).';
      return;
    }
    error.textContent = '';

    const formData = new FormData(form);
    const payload = { name, amountCents, frequency: formData.get('frequency') };
    const nextDate = formData.get('nextDate');
    if (nextDate) payload.nextDate = nextDate; // omit when blank so an edit never clobbers it with nothing

    onSubmit(payload);
    if (!isEdit) {
      nameInput.value = '';
      amount.amountInput.value = '';
    }
  });

  return form;
}

// ---- src/modules/category-budgets/selectors.js ----
// Selectors for Category Budgets (Phase 6). "Spent" is always derived
// live from Expenses dated in the current calendar month — there is no
// explicit monthly reset step or stored "spent so far" figure. The month
// simply changes which expenses count, automatically, the moment `now`
// rolls into a new month. This also means these figures can never drift
// out of sync with the Expenses they're computed from (same "derived, not
// stored" principle as Safe-to-Spend — see docs/DATA-MODEL.md §4).
//
// These are purely a planning/visibility layer — see docs/SAFE-TO-SPEND.md
// for why they deliberately do NOT feed into the Safe-to-Spend arithmetic.


/** Spending at/above this fraction of the limit (but not yet over) is "approaching". */
const APPROACHING_THRESHOLD_RATIO = 0.8;

function getAllCategoryBudgets(state) {
  const value = state?.categoryBudgets;
  return Array.isArray(value) ? value : [];
}

/** "YYYY-MM" — a simple string-prefix month key, comparable against Expense.date ("YYYY-MM-DD"). */
function monthKeyFor(date) {
  return getLocalDateKey(date).slice(0, 7);
}

function sumSpentForCategory(expenses, category, monthKey) {
  let totalCents = 0;
  // Array.isArray, not `?? []` — a corrupted stored value can be present
  // but the wrong type, not just missing; see src/modules/safe-to-spend/
  // calculation.js's identical guard and docs/QA-REPORT.md (Phase 8).
  for (const expense of Array.isArray(expenses) ? expenses : []) {
    if (!expense || expense.category !== category) continue;
    if (!expense.date || !expense.date.startsWith(monthKey)) continue;
    // A corrupted/invalid amountCents (e.g. hand-edited or pre-validation
    // localStorage data) is skipped rather than summed — an unguarded `+=`
    // here would let a single bad value NaN-poison the whole month's
    // "spent" figure and status, matching the defensive pattern already
    // used by src/modules/safe-to-spend/calculation.js.
    if (!isValidAmountCents(expense.amountCents)) continue;
    totalCents += expense.amountCents;
  }
  return totalCents;
}

function statusFor(spentCents, limitCents) {
  if (limitCents <= 0) return spentCents > 0 ? 'exceeded' : 'on-track';
  if (spentCents > limitCents) return 'exceeded';
  if (spentCents >= limitCents * APPROACHING_THRESHOLD_RATIO) return 'approaching';
  return 'on-track';
}

/**
 * Each category budget's progress for the current calendar month.
 * @param {object} state
 * @param {{now?: Date}} [options]
 * @returns {Array<{id: string, category: string, limitCents: number, spentCents: number, remainingCents: number, status: 'on-track'|'approaching'|'exceeded'}>}
 */
function getCategoryBudgetProgress(state, { now = new Date() } = {}) {
  const monthKey = monthKeyFor(now);
  return getAllCategoryBudgets(state).map((budget) => {
    const spentCents = sumSpentForCategory(state.expenses, budget.category, monthKey);
    const remainingCents = budget.limitCents - spentCents;
    return {
      id: budget.id,
      category: budget.category,
      limitCents: budget.limitCents,
      spentCents,
      remainingCents,
      status: statusFor(spentCents, budget.limitCents),
    };
  });
}

/**
 * The Monthly View (Phase 6): totals across *budgeted* categories only —
 * spending in a category with no budget defined isn't part of this
 * summary (it's still visible on the Recent Expenses list, just not
 * folded into "total spent" here, which would otherwise make "remaining"
 * mean something different than "budget minus spend").
 * @param {object} state
 * @param {{now?: Date}} [options]
 */
function getMonthlyBudgetSummary(state, { now = new Date() } = {}) {
  const categories = getCategoryBudgetProgress(state, { now });
  const totalPlannedCents = categories.reduce((sum, c) => sum + c.limitCents, 0);
  const totalSpentCents = categories.reduce((sum, c) => sum + c.spentCents, 0);
  return {
    totalPlannedCents,
    totalSpentCents,
    totalRemainingCents: totalPlannedCents - totalSpentCents,
    categories,
  };
}


// ---- src/modules/category-budgets/reducer.js ----

const CATEGORY_BUDGET_EDITABLE_FIELDS = ['category', 'limitCents'];

function validateNewCategoryBudget(candidate) {
  if (!candidate) return null;
  const category = typeof candidate.category === 'string' ? candidate.category.trim() : '';
  if (!category || !isValidAmountCents(candidate.limitCents)) return null;
  return { ...candidate, category };
}

function sanitizeCategoryBudgetChanges(changes = {}) {
  const sanitized = {};
  for (const field of CATEGORY_BUDGET_EDITABLE_FIELDS) {
    if (field in changes) sanitized[field] = changes[field];
  }
  if ('category' in sanitized) {
    const trimmed = typeof sanitized.category === 'string' ? sanitized.category.trim() : '';
    if (trimmed) sanitized.category = trimmed;
    else delete sanitized.category;
  }
  if ('limitCents' in sanitized && !isValidAmountCents(sanitized.limitCents)) {
    delete sanitized.limitCents;
  }
  return sanitized;
}

// Note: this reducer doesn't enforce one-budget-per-category — creating a
// second budget for the same category is allowed; each record is tracked
// and displayed independently (both would report the same "spent this
// month" figure, computed fresh from Expenses each time — see
// getCategoryBudgetProgress). The add form steers users toward picking an
// unbudgeted category without a hard block, keeping this reducer simple
// (Phase 6 is deliberately "lightweight").
const categoryBudgetsReducer = createListReducer({
  actionPrefix: 'categoryBudgets',
  entityKey: 'categoryBudget',
  validateNew: validateNewCategoryBudget,
  sanitizeChanges: sanitizeCategoryBudgetChanges,
});
