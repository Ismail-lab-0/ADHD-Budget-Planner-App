<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADHD Budget Planner</title>
    <style>
/* ---- src/styles/base.css ---- */
/* Design tokens + reset. See CLAUDE.md "Design system" — calm, minimal,
   modern, low cognitive load. Colors are semantic tokens so components
   never hardcode a raw color, and dark mode is a token swap, not a
   parallel stylesheet.

   Color system: the canonical tokens (`--bg`, `--surface`, `--border`,
   `--text-primary`, `--text-secondary`, `--accent`, `--accent-bg`,
   `--warning`, `--warning-bg`, `--danger`, `--progress-track`) are the
   ones to change if the palette itself ever changes — nothing else in
   this codebase should. Every existing `--color-*` name a component
   already uses is kept as a plain alias of one of these (`--color-bg:
   var(--bg)`, etc.), so the ~180 existing `var(--color-*)` references
   across components.css/responsive.css never needed a rename; only the
   values above do. `--danger-bg` and `--color-accent-contrast` aren't
   part of the given palette (a background tint for danger, and the
   text color used *on* accent-colored buttons) — derived/kept to match
   the pattern of the tokens that are. Never pure black/white for
   `--text-primary`/`--bg` in either mode — see the values below. */

:root {
  /* ---- Color: light (default) ---- */
  --bg: #faf7f2;
  --surface: #ffffff;
  --border: #eae4da;
  --text-primary: #2b2a28;
  --text-secondary: #8b8579;
  --accent: #4a7c59;
  --accent-bg: #e8f0e9;
  --warning: #c08a3e;
  --warning-bg: #fbf1e1;
  --danger: #b5654a;
  --danger-bg: #fbeae3;
  --progress-track: #efeae2;

  /* ---- Legacy/semantic aliases — every existing component reads these;
     keeping them means the palette above is the only thing that ever
     needs to change. `accent` doubles as the one "positive/safe" signal
     color everywhere (income, a positive Safe-to-Spend, progress fills)
     — never a separate brand color competing with it. */
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-text: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-border: var(--border);
  --color-accent: var(--accent);
  --color-accent-contrast: #ffffff;
  --color-accent-muted: var(--accent-bg);
  --color-focus: var(--accent);
  --color-status-attention-bg: var(--danger-bg);
  --color-status-attention-text: var(--danger);
  --color-status-positive-bg: var(--accent-bg);
  --color-status-positive-text: var(--accent);
  --color-status-caution-bg: var(--warning-bg);
  --color-status-caution-text: var(--warning);
  --shadow-sm: 0 1px 3px rgba(43, 38, 32, 0.06), 0 1px 2px rgba(43, 38, 32, 0.04);
  --shadow-md: 0 10px 28px rgba(43, 38, 32, 0.1);

  /* Category accent colors — distinct, warm/pastel hues so a list of mixed
     categories reads as organized rather than a rainbow. Deliberately not
     reusing --accent (income/Safe-to-Spend) or --danger (warnings/
     overdue) — those stay the only two colors with a specific meaning
     attached; category colors are purely identifying, not judgmental
     (docs/PRODUCT.md §3). Applied via `iconChip()`/`categoryIconChip()`
     (src/ui/components/icons.js), never hardcoded per-component. Outside
     the palette given for the rest of the app — a fixed set of hues has
     to stay stable for recognizability regardless of theme, the same
     reason these aren't swapped by the toggle below either, only tuned
     for contrast against each surface. */
  --color-cat-groceries: #4a9c7a;
  --color-cat-eating-out: #c17847;
  --color-cat-transport: #4a7fb8;
  --color-cat-shopping: #c96f95;
  --color-cat-entertainment: #8f6bb8;
  --color-cat-health: #c17262;
  --color-cat-subscriptions: #6478b0;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  /* Serif, system-only (no web font — see CLAUDE.md "no network request in
     normal use") — used sparingly, just the Safe-to-Spend hero amount, for
     a warmer, more editorial focal point than an all-sans page would give. */
  --font-serif: Georgia, Cambria, 'Times New Roman', Times, serif;
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.375rem;
  --font-size-2xl: 1.75rem;
  --font-size-hero: clamp(2.75rem, 9vw, 3.75rem);
  --line-height-base: 1.5;
  --line-height-tight: 1.25;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 999px;

  /* Touch target minimum (mobile-first) */
  --tap-target-min: 44px;
}

/* Dark theme tokens — a warm dark charcoal, not a neutral/blue-gray dark
   (the same warm identity as the light theme, not a different app in dark
   mode), deliberately desaturated/lower-contrast relative to a typical
   "technical" dark UI to match the light theme's calm, low-cognitive-load
   feel (CLAUDE.md "Design system"). Applied two ways so both an explicit
   in-app choice (src/ui/components/theme-toggle.js, `settings.theme`,
   persisted through the existing storage adapter — see docs/DATA-MODEL.md,
   already the app's one localStorage path) and the OS-level
   `prefers-color-scheme` work, with the explicit choice always winning.
   The toggle works by adding a class to <html> (`src/ui/shell.js`), not
   an inline style or a second stylesheet:
   - no stored preference ('system', the default): follows the OS, via the
     media query below, guarded so an explicit *light* choice on a
     dark-OS device isn't overridden by it;
   - an explicit 'dark' choice: applied regardless of the OS, via the
     plain `.theme-dark` class right after. */
@media (prefers-color-scheme: dark) {
  :root:not(.theme-light) {
    --bg: #1c1b19;
    --surface: #242320;
    --border: #38362f;
    --text-primary: #efeae2;
    --text-secondary: #9c9689;
    --accent: #7fae8c;
    --accent-bg: #26332a;
    --warning: #d4a05c;
    --warning-bg: #332b1e;
    --danger: #c97f63;
    --danger-bg: #382920;
    --progress-track: #312f2a;

    --color-bg: var(--bg);
    --color-surface: var(--surface);
    --color-text: var(--text-primary);
    --color-text-secondary: var(--text-secondary);
    --color-border: var(--border);
    --color-accent: var(--accent);
    --color-accent-contrast: #16241c;
    --color-accent-muted: var(--accent-bg);
    --color-focus: var(--accent);
    --color-status-attention-bg: var(--danger-bg);
    --color-status-attention-text: var(--danger);
    --color-status-positive-bg: var(--accent-bg);
    --color-status-positive-text: var(--accent);
    --color-status-caution-bg: var(--warning-bg);
    --color-status-caution-text: var(--warning);
    /* Dark surfaces need a real (if subtle) shadow too, not `none` — a
       flat dark card next to a dark background has no depth cue at all
       without one — but kept softer than a typical near-black dark theme. */
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.38);

    /* Same hue identity as the light-mode set, tuned for contrast against
       a dark surface without the higher saturation a "technical" dark UI
       would use. */
    --color-cat-groceries: #6bad91;
    --color-cat-eating-out: #c99a75;
    --color-cat-transport: #7d9dc4;
    --color-cat-shopping: #c791a6;
    --color-cat-entertainment: #a08cc4;
    --color-cat-health: #c9948a;
    --color-cat-subscriptions: #8996bf;
  }
}

:root.theme-dark {
  --bg: #1c1b19;
  --surface: #242320;
  --border: #38362f;
  --text-primary: #efeae2;
  --text-secondary: #9c9689;
  --accent: #7fae8c;
  --accent-bg: #26332a;
  --warning: #d4a05c;
  --warning-bg: #332b1e;
  --danger: #c97f63;
  --danger-bg: #382920;
  --progress-track: #312f2a;

  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-text: var(--text-primary);
  --color-text-secondary: var(--text-secondary);
  --color-border: var(--border);
  --color-accent: var(--accent);
  --color-accent-contrast: #16241c;
  --color-accent-muted: var(--accent-bg);
  --color-focus: var(--accent);
  --color-status-attention-bg: var(--danger-bg);
  --color-status-attention-text: var(--danger);
  --color-status-positive-bg: var(--accent-bg);
  --color-status-positive-text: var(--accent);
  --color-status-caution-bg: var(--warning-bg);
  --color-status-caution-text: var(--warning);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.38);
  --color-cat-groceries: #6bad91;
  --color-cat-eating-out: #c99a75;
  --color-cat-transport: #7d9dc4;
  --color-cat-shopping: #c791a6;
  --color-cat-entertainment: #a08cc4;
  --color-cat-health: #c9948a;
  --color-cat-subscriptions: #8996bf;
}


*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  min-height: 100%;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p {
  margin: 0 0 var(--space-3) 0;
  line-height: var(--line-height-tight);
}

h1 {
  font-size: var(--font-size-2xl);
  font-weight: 700;
}

h2 {
  font-size: var(--font-size-lg);
  font-weight: 600;
}

p {
  line-height: var(--line-height-base);
}

img,
svg {
  max-width: 100%;
  display: block;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

a {
  color: inherit;
}

ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

/* Visible focus for every interactive element — never rely on color alone
   and never suppress the browser's default without replacing it. */
:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}


/* ---- src/styles/components.css ---- */
/* Reusable component styles. See CLAUDE.md "Design system": typography,
   spacing, radius, buttons, cards, inputs, navigation, modal structure,
   empty states, status indicators. Base (non-breakpoint-specific) look
   only — layout changes by screen size live in responsive.css. */

/* ---- App shell ---- */

.app-banner {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  background: var(--color-accent-muted);
  color: var(--color-text);
  font-size: var(--font-size-sm);
  text-align: center;
}

.app-main {
  padding: var(--space-4);
}

/* ---- Cards ---- */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  margin-bottom: var(--space-5);
  box-shadow: var(--shadow-sm);
}

.card:last-child {
  margin-bottom: 0;
}

/* ---- Icons (src/ui/components/icons.js) ---- */

.icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 0;
  flex-shrink: 0;
}

/* A small tinted rounded chip behind an icon — the chip's background is
   a soft tint of `--chip-color` via color-mix, so every new use just sets
   one color instead of a whole bg/fg pair. */
.icon-chip {
  --chip-color: var(--color-accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  background: var(--color-accent-muted); /* fallback for browsers without color-mix() */
  background: color-mix(in srgb, var(--chip-color) 16%, transparent);
  color: var(--chip-color);
  flex-shrink: 0;
}

.icon-chip--sm {
  width: 30px;
  height: 30px;
}

/* A bigger, friendlier rounded-square badge showing a real emoji — same
   tint approach as .icon-chip, just larger and with emoji sized to match
   (see categoryEmojiBadge, src/ui/components/icons.js). */
.emoji-badge {
  --chip-color: var(--color-accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background: var(--color-accent-muted);
  background: color-mix(in srgb, var(--chip-color) 18%, transparent);
  font-size: 1.375rem;
  line-height: 1;
  flex-shrink: 0;
}

/* A small, square, icon-only action button (e.g. a row's Edit/Delete) —
   distinct from .btn, which always carries visible text. */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--tap-target-min);
  height: var(--tap-target-min);
  padding: 0;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-secondary);
  cursor: pointer;
}

.icon-btn:hover {
  color: var(--color-text);
  border-color: var(--color-text-secondary);
}

.icon-btn--attention:hover {
  color: var(--color-status-attention-text);
  border-color: var(--color-status-attention-text);
}

/* A card's standard header: icon chip + <h2>, replacing a bare heading
   wherever a card wants the icon treatment. */
.section-heading {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.section-heading h2 {
  margin-bottom: 0;
}

/* ---- Buttons ---- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--tap-target-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font-size: var(--font-size-base);
  font-weight: 600;
  cursor: pointer;
}

.btn--primary {
  background: var(--color-accent);
  color: var(--color-accent-contrast);
}

.btn--secondary {
  background: transparent;
  border-color: var(--color-border);
  color: var(--color-text);
}

/* ---- Inputs ---- */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.field__label {
  font-size: var(--font-size-sm);
  font-weight: 600;
}

.field__input {
  min-height: var(--tap-target-min);
  padding: 0 var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-size: var(--font-size-base);
}

.field__hint {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

/* ---- Modal structure (src/ui/components/popup.js — every "add" form in
   the app opens through this one shared popup) ---- */

@keyframes modal-backdrop-fade-in {
  from {
    opacity: 0;
  }
}

@keyframes modal-pop-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
  z-index: 100;
  /* `prefers-reduced-motion: reduce` already forces every animation's
     duration to ~0 globally (src/styles/base.css) — nothing extra needed
     here to respect it. */
  animation: modal-backdrop-fade-in 0.16s ease-out;
}

.modal {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  overscroll-behavior: contain; /* scrolling a tall form to its end doesn't also scroll the page behind it */
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  animation: modal-pop-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-5);
  border-bottom: 1px solid var(--color-border);
}

.modal__header h2 {
  margin-bottom: 0;
}

.modal__body {
  padding: var(--space-5);
}

.modal__footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  padding: var(--space-5);
  border-top: 1px solid var(--color-border);
}

/* ---- Empty states ---- */

.empty-state {
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
  margin: 0;
}

/* ---- Status indicators ---- */
/* Always paired with a visible text label by whoever uses these classes —
   color is never the only signal (docs/TEST-PLAN.md accessibility
   checklist). */

.status {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: 600;
}

.status--neutral {
  background: var(--color-border);
  color: var(--color-text-secondary);
}

.status--attention {
  background: var(--color-status-attention-bg);
  color: var(--color-status-attention-text);
}

.status--positive {
  background: var(--color-status-positive-bg);
  color: var(--color-status-positive-text);
}

.status--caution {
  background: var(--color-status-caution-bg);
  color: var(--color-status-caution-text);
}

/* ---- Screens ---- */

.today-header {
  margin-bottom: var(--space-6);
}

.today-header__greeting {
  margin-bottom: var(--space-1);
}

.today-header__date {
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
  margin: 0;
}

/* ---- Dashboard grid ---- */

/* Base (mobile-first) layout: a single column, every card an explicit
   grid item with its own `order` so mobile can read in a different,
   priority-driven sequence than desktop's two-column grouping — see
   src/ui/screens/dashboard.js's comment. Desktop overrides
   `grid-template-columns` and each item's `grid-column`/`order` in
   src/styles/responsive.css; this base layer is what phones/tablets
   actually use. Spacing between cards comes from `gap` here, not from
   `.card`'s own `margin-bottom` (zeroed just below) — using the card's
   own margin for this used to leave an inconsistent, sometimes-zero gap
   depending on which card happened to land last inside a now-removed
   wrapper div (reported directly by the user as "not enough space").
   Directly after the hero: Current balance, then This period, then
   everything else — the priority order the user asked for on a phone.

   `.dashboard-grid__col` (the "main"/"side" wrapper each card slot sits
   inside — see dashboard.js) is `display: contents` here: it removes
   itself from layout so its children become direct flex items of
   `.dashboard-grid` and follow the flat `order` values below. This is
   what makes the mobile stacking order correct while still letting the
   two columns stack independently at desktop (src/styles/responsive.css)
   — see that file's comment for the CSS Grid bug this replaced (a shared
   row-track height was stranding side-column cards under huge gaps,
   reported directly by the user from a screenshot). */
.dashboard-grid {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.dashboard-grid__col {
  display: contents;
}

.dashboard-grid__item {
  min-width: 0; /* let cards shrink instead of overflowing their column */
}

.dashboard-grid .card {
  margin-bottom: 0;
}

.dashboard-grid__item--hero { order: 1; }
.dashboard-grid__item--balance { order: 2; }
.dashboard-grid__item--period { order: 3; }
.dashboard-grid__item--categories { order: 4; }
.dashboard-grid__item--expenses { order: 5; }
.dashboard-grid__item--income { order: 6; }
.dashboard-grid__item--bills { order: 7; }
.dashboard-grid__item--savings { order: 8; }
.dashboard-grid__item--privacy { order: 9; }

/* ---- Onboarding (Phase 7) ---- */

/* One question centered on the screen, both axes — at the user's
   request. `min-height: 100vh` (with a `dvh` upgrade for browsers that
   support it, more accurate on mobile where the address bar changes the
   viewport) makes the screen at least viewport-tall regardless of
   .app-main's own padding, so `justify-content: center` has real room to
   center within; a step long enough to exceed that just scrolls
   normally, it's a floor, not a hard clamp. */
.screen--onboarding {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
}

.screen--onboarding .onboarding-header,
.screen--onboarding > .card {
  width: 100%;
  max-width: 480px;
}

.onboarding-header {
  margin-bottom: var(--space-4);
  text-align: center;
}

.onboarding-header h1 {
  margin-bottom: var(--space-2);
}

.onboarding-header .section-description {
  margin-bottom: var(--space-2);
}

.onboarding-progress {
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  margin: 0 0 var(--space-4);
}

.onboarding-finish {
  text-align: center;
}

.onboarding-finish .section-description {
  margin-bottom: var(--space-4);
}

.section-description {
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
  margin-top: calc(var(--space-1) * -1);
}

/* ---- Expenses period filter (Recent Expenses section) ---- */

.expenses-filter {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.expenses-filter__select {
  min-height: var(--tap-target-min);
  flex: 1 1 160px;
}

.expenses-filter__date {
  min-height: var(--tap-target-min);
  flex: 1 1 140px;
}

.expenses-filter__date-sep {
  color: var(--color-text-secondary);

     below; only the mechanism changed (see dashboard.js's comment).

     Found and fixed a real layout bug here, reported directly by the
     user from a screenshot: the previous version made every card a
     direct item of one CSS Grid, pinning only its *column* explicitly
     and leaving its *row* to auto-placement — which packs items row by
     row across BOTH columns, so a row's height is forced to fit

(function () {
"use strict";
// ---- src/core/store.js ----
// The application state store: getState / dispatch / subscribe.
//
// See docs/ARCHITECTURE.md §4 "Application state architecture". This is
// intentionally small — a single in-memory state tree, updated only
// through a pure reducer, with subscribers notified after each real
// change.
//
// Reducer contract: `reducer(state, action)` must be pure, and MUST
// return the *same* state reference when an action produces no change
// (e.g. completing a task that doesn't exist). The store uses reference
// equality to decide whether to notify subscribers, so a reducer that
// always returns a new object defeats the no-op optimization and the
// "don't re-render on no-op" guarantee documented in docs/TEST-PLAN.md.

/**
 * @template S
 * @param {(state: S, action: {type: string, [key: string]: unknown}) => S} reducer
 * @param {S} initialState
 */
function createStore(reducer, initialState) {
  let state = initialState;
  const listeners = new Set();

  function getState() {
    return state;
  }

  function dispatch(action) {
    const nextState = reducer(state, action);
    if (nextState !== state) {
      state = nextState;
      // Snapshot so a listener unsubscribing (itself or another) during
      // notification doesn't skip or double-notify anyone.
      for (const listener of [...listeners]) {
        listener(state, action);
      }
    }
    return action;
  }

  /**
   * @param {(state: S, action: {type: string}) => void} listener
   * @returns {() => void} unsubscribe
   */
  function subscribe(listener) {
    listeners.add(listener);
    return () => listeners.delete(listener);
  }

  return { getState, dispatch, subscribe };
}


// ---- src/core/events.js ----
// A minimal pub/sub event bus.
//
// See docs/ARCHITECTURE.md §4. Used for cross-module signals that aren't
// full state changes — e.g. "a routine instance finished" — so a module
// can react without owning another module's state. State-change
// notifications themselves go through the store's own `subscribe`
// (src/core/store.js), not this bus.

function createEventBus() {
  /** @type {Map<string, Set<(payload: unknown) => void>>} */
  const handlers = new Map();

  /**
   * @param {string} event
   * @param {(payload: unknown) => void} handler
   * @returns {() => void} unsubscribe
   */
  function on(event, handler) {
    let set = handlers.get(event);
    if (!set) {
      set = new Set();
      handlers.set(event, set);
    }
    set.add(handler);
    return () => off(event, handler);
  }

  /**
   * @param {string} event
   * @param {(payload: unknown) => void} handler
   */
  function off(event, handler) {
    const set = handlers.get(event);
    if (!set) return;
    set.delete(handler);
    if (set.size === 0) {
      handlers.delete(event);
    }
  }

  /**
   * @param {string} event
   * @param {unknown} [payload]
   */
  function emit(event, payload) {
    const set = handlers.get(event);
    if (!set) return;
    // Snapshot so a handler that unsubscribes (itself or another) mid-emit
    // doesn't skip or double-call handlers.
    for (const handler of [...set]) {
      handler(payload);
    }
  }

  return { on, off, emit };
}


// ---- src/core/schema.js ----
// Schema version, empty-state shape, and migration registry for the
// persisted state tree. See docs/DATA-MODEL.md for the canonical shape
// and §7 "Schema versioning & migrations" for the policy this implements.
//
// The empty state below is the budget-product shape (docs/PRODUCT.md) —
// every collection empty, settings/budget at their defaults.

const CURRENT_SCHEMA_VERSION = 7;

/** @returns the state tree for a brand-new install, at the current schema version. */
function createEmptyState() {
  const now = new Date().toISOString();
  return {
    schemaVersion: CURRENT_SCHEMA_VERSION,
    meta: {
      createdAt: now,
      lastOpenedAt: now,
    },
    settings: {
      onboardingCompletedAt: null,
      displayName: null,
      theme: 'system',
      reducedMotion: false,
    },
    budget: {
      currentBalanceCents: 0,
      savingsAllocationCents: 0,
    },
    incomes: [],
    bills: [],
    plannedExpenses: [],
    expenses: [],
    categoryBudgets: [],
    incomeReceipts: [],
    billPayments: [],
  };
}

// Each migration transforms state from version (N-1) to version N, and is
// keyed by its *target* version. Per docs/DATA-MODEL.md §6, adding one
// means: bump CURRENT_SCHEMA_VERSION, add `[newVersion]: migrateFn` here,
// and describe the new shape in docs/DATA-MODEL.md, all in the same
// change.
//
// migrateFn shape: (state) => nextState — pure, prefers additive defaults
// over dropping data.

// v1 Task shape (pre-Phase-2, never shipped with a real Tasks UI):
//   { id, title, notes, createdAt, completedAt, dueAt, effortMinutes,
//     energy, context, goalId, source }
// v2 Task shape (Phase 2 — see docs/DATA-MODEL.md "Task"): adds status,
// priority, description, scheduledDate/Time, updatedAt; renames
// dueAt -> dueDate, effortMinutes -> estimatedMinutes, context -> category;
// drops energy/goalId/source (goalId/source will return, additively, when
// the Goals module's own migration lands).
function migrateTaskV1ToV2(task) {
  return {
    id: task.id,
    title: task.title,
    description: null,
    status: task.completedAt ? 'completed' : 'todo',
    priority: 'important',
    dueDate: task.dueAt ?? null,
    scheduledDate: null,
    scheduledTime: null,
    estimatedMinutes: task.effortMinutes ?? null,
    category: task.context ?? null,
    notes: task.notes ?? null,
    createdAt: task.createdAt,
    updatedAt: task.createdAt,
    completedAt: task.completedAt ?? null,
  };
}

// v2 -> v3: the product pivoted from a general life planner (Tasks,
// Routines, Calendar, Goals, Weekly Review) to a focused budget planner
// (docs/PRODUCT.md §9). The two shapes share no real data — a Task has no
// budget equivalent — so this migration deliberately *discards* the old
// tasks/routines/calendarEvents/money/goals/weeklyReviews collections
// rather than transform them, per the exception documented in
// docs/DATA-MODEL.md §7. `settings.payScheduleHint` (free-text) is
// likewise dropped — Income.nextDate replaces it with a structured value.
// What *does* carry over: meta and the settings fields that still apply
// (onboardingCompletedAt/displayName/theme/reducedMotion).
function migrateV2ToV3(state) {
  return {
    meta: state.meta,
    settings: {
      onboardingCompletedAt: state.settings?.onboardingCompletedAt ?? null,
      displayName: state.settings?.displayName ?? null,
      theme: state.settings?.theme ?? 'system',
      reducedMotion: state.settings?.reducedMotion ?? false,
    },
    budget: { currentBalanceCents: 0, savingsAllocationCents: 0, safetyBufferCents: 0 },
    incomes: [],
    bills: [],
    plannedExpenses: [],
  };
}

// v3 -> v4: adds the `expenses` collection (Phase 5 — Expense Tracking).
// Purely additive; nothing else changes shape. See docs/DATA-MODEL.md
// "Expense" and "Current Balance model".
function migrateV3ToV4(state) {
  return { ...state, expenses: state.expenses ?? [] };
}

// v4 -> v5: adds the `categoryBudgets` collection (Phase 6 — Budget
// Planning). Purely additive; nothing else changes shape. See
// docs/DATA-MODEL.md "CategoryBudget".
function migrateV4ToV5(state) {
  return { ...state, categoryBudgets: state.categoryBudgets ?? [] };
}

// v5 -> v6: adds the `incomeReceipts` collection — a real historical log
// of confirmed income (one record per "Mark received"), so an unbounded
// period ("All time") can sum actual received income instead of either a
// meaningless "every future paycheck forever" or a non-answer. Purely
// additive; nothing else changes shape. See docs/DATA-MODEL.md
// "IncomeReceipt".
function migrateV5ToV6(state) {
  return { ...state, incomeReceipts: state.incomeReceipts ?? [] };
}

// v6 -> v7: adds the `billPayments` collection — the Bill-side counterpart
// to `incomeReceipts`, a real historical log of confirmed payments (one
// record per "Mark paid"), so a period's "Money out" can include what was
// actually paid, not every bill merely *due* in that window. Purely
// additive; nothing else changes shape. See docs/DATA-MODEL.md
// "BillPayment".
function migrateV6ToV7(state) {
  return { ...state, billPayments: state.billPayments ?? [] };
}

const migrations = {
  2: (state) => ({ ...state, tasks: (state.tasks ?? []).map(migrateTaskV1ToV2) }),
  3: migrateV2ToV3,
  4: migrateV3ToV4,
  5: migrateV4ToV5,
  6: migrateV5ToV6,
  7: migrateV6ToV7,
};

/**
 * Runs `state` through every migration between its stored version and
 * `currentVersion`, in ascending order, and stamps the result with
 * `currentVersion`.
 *
 * `migrations`/`currentVersion` are overridable so this can be exercised
 * against a fake multi-step migration table in tests without touching the
 * real (currently empty) registry above.
 *
 * @param {{schemaVersion?: number, [key: string]: unknown}} state
 * @param {{migrations?: Record<number, (s: any) => any>, currentVersion?: number}} [options]
 */
function migrate(state, options = {}) {
  const { migrations: migrationTable = migrations, currentVersion = CURRENT_SCHEMA_VERSION } = options;

  const fromVersion = typeof state.schemaVersion === 'number' ? state.schemaVersion : 0;

  if (fromVersion > currentVersion) {
    // Data from a newer build than this one understands. Refuse to guess
    // rather than silently drop fields this code doesn't know about yet —
    // the caller (the storage adapter) treats this as unrecoverable and
    // falls back to a fresh state.
    throw new Error(`stored schemaVersion ${fromVersion} is newer than supported version ${currentVersion}`);
  }

  let migrated = state;
  for (let v = fromVersion + 1; v <= currentVersion; v++) {
    const step = migrationTable[v];
    if (step) {
      migrated = step(migrated);
    }
  }

  return normalizeCollections({ ...migrated, schemaVersion: currentVersion });
}

// The list-shaped collections every list-entity reducer (src/core/
// list-entity.js) expects to be able to spread/index/findIndex into.
// Guaranteeing this once, here — the one place all persisted state passes
// through — means every reducer, selector, and the Safe-to-Spend
// calculation can trust these are always real arrays, even if the raw
// stored value degraded into something else (an object, a string, `null`)
// through hand-editing or a future bug. See Phase 8 QA (docs/QA-REPORT.md).
const ARRAY_COLLECTION_KEYS = ['incomes', 'bills', 'plannedExpenses', 'expenses', 'categoryBudgets', 'incomeReceipts', 'billPayments'];

function normalizeCollections(state) {
  const normalized = { ...state };
  for (const key of ARRAY_COLLECTION_KEYS) {
    if (!Array.isArray(normalized[key])) normalized[key] = [];
  }
  return normalized;
}


// ---- src/core/storage.js ----
// The storage adapter: the only module allowed to touch localStorage.
// See docs/ARCHITECTURE.md §5 "LocalStorage strategy" for the contract
// this implements — everything else in the app reads/writes persisted
// state through this module, never localStorage directly.
//
// Responsibilities:
//   - Safe JSON serialize/deserialize (never let a parse error crash the
//     app; corrupted data is preserved under a recovery key, not lost).
//   - Run the state through schema migration on load.
//   - Debounce writes so rapid interactions don't hammer localStorage.
//   - A soft size check that warns (via callback) well before the
//     browser's real storage quota.
//
// The `storage` backend (localStorage.getItem/setItem) is passed in
// rather than imported globally, per docs/ARCHITECTURE.md §4 ("no global
// mutable singletons reached via import") — this is also what lets the
// adapter be unit-tested under Node, which has no real localStorage.


const DEFAULT_KEY = 'adhd-planner:v1';
const RECOVERY_KEY_SUFFIX = ':recovery';
const DEFAULT_DEBOUNCE_MS = 300;
// Conservative vs. typical browser localStorage quotas (often 5-10MB per
// origin) — warn well before the user could hit a real QuotaExceededError.
const DEFAULT_SOFT_LIMIT_BYTES = 4 * 1024 * 1024;

/**
 * @param {object} [options]
 * @param {{getItem: Function, setItem: Function, removeItem?: Function}} [options.storage]
 *   Defaults to the global `localStorage` when present (i.e. in a browser).
 * @param {string} [options.key] Root key the whole state tree is stored under.
 * @param {number} [options.debounceMs] Delay before a scheduled save flushes.
 * @param {number} [options.softLimitBytes] Size threshold that triggers onQuotaWarning.
 * @param {(approxBytes: number) => void} [options.onQuotaWarning]
 * @param {(rawValue: string) => void} [options.onCorruptData]
 */
function createStorageAdapter({
  storage = typeof localStorage !== 'undefined' ? localStorage : undefined,
  key = DEFAULT_KEY,
  debounceMs = DEFAULT_DEBOUNCE_MS,
  softLimitBytes = DEFAULT_SOFT_LIMIT_BYTES,
  onQuotaWarning,
  onCorruptData,
} = {}) {
  if (!storage) {
    throw new Error(
      'createStorageAdapter: no storage backend available (pass `storage`, or run where `localStorage` exists)'
    );
  }

  const recoveryKey = `${key}${RECOVERY_KEY_SUFFIX}`;
  let pendingState = null;
  let flushTimer = null;

  /** Reads and migrates the persisted state, or a fresh empty state if there is none / it's unusable. */
  function load() {
    let raw;
    try {
      raw = storage.getItem(key);
    } catch {
      // localStorage unavailable (disabled, some private-browsing modes):
      // degrade to an in-memory-only empty state rather than crash.
      return createEmptyState();
    }

    if (raw == null) {
      return createEmptyState();
    }

    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch {
      recoverCorrupt(raw);
      return createEmptyState();
    }

    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
      recoverCorrupt(raw);
      return createEmptyState();
    }

    try {
      return migrate(parsed);
    } catch {
      // e.g. a schemaVersion newer than this build supports.
      recoverCorrupt(raw);
      return createEmptyState();
    }
  }

  function recoverCorrupt(raw) {
    try {
      storage.setItem(recoveryKey, raw);
    } catch {
      // Best-effort only — if even this write fails, there's nothing more
      // to do; the caller still gets a safe empty state either way.
    }
    onCorruptData?.(raw);
  }

  /** Writes `state` immediately. Prefer `scheduleSave` for interactive use. */
  function save(state) {
    const serialized = JSON.stringify(state);
    storage.setItem(key, serialized);
    checkSize(serialized);
  }

  function checkSize(serialized) {
    if (!onQuotaWarning) return;
    // UTF-16 code units, 2 bytes each — a rough but cheap estimate, not
    // exact byte-accounting.
    const approxBytes = serialized.length * 2;
    if (approxBytes > softLimitBytes) {
      onQuotaWarning(approxBytes);
    }
  }

  /**
   * Queues `state` to be written after `debounceMs` of inactivity,
   * coalescing rapid successive calls into one write. Call `flush()`
   * before the page unloads so the last update isn't lost.
   */
  function scheduleSave(state) {
    pendingState = state;
    if (flushTimer) clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, debounceMs);
  }

  /** Writes any pending scheduled save immediately, if one is queued. */
  function flush() {
    if (flushTimer) {
      clearTimeout(flushTimer);
      flushTimer = null;
    }
    if (pendingState !== null) {
      const toSave = pendingState;
      pendingState = null;
      save(toSave);
    }
  }

  return { load, save, scheduleSave, flush };
}


// ---- src/ui/dom.js ----
// A tiny DOM-building helper — not a component framework, just removes
// repetitive createElement/appendChild boilerplate. See
// docs/ARCHITECTURE.md §2 ("no framework ... small hand-written helper
// utilities for rendering if repetitive patterns emerge").

/**
 * @param {string} tag
 * @param {Record<string, string>} [attrs]
 * @param {(Node|string|null|Array<Node|string|null>)} [children]
 * @returns {HTMLElement}
 */
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);

  for (const [key, value] of Object.entries(attrs)) {
    if (value == null) continue;
    if (key === 'class') node.className = value;
    // These must go through setAttribute, never a direct property
    // assignment: aria-*/data-*/role have no IDL property at all, and
    // `list` (an <input>'s associated <datalist>) is a *read-only* IDL
    // property that reflects the resolved element, not the attribute
    // string — `node.list = 'someId'` throws a TypeError in strict-mode
    // ES modules (which this codebase always runs as) in at least Safari,
    // silently doing nothing everywhere else. A Node-based DOM shim can't
    // catch this class of bug: it doesn't model real getter-only IDL
    // semantics, only a real browser does — found via manual QA, not
    // automated testing (see git history).
    else if (key.startsWith('aria-') || key.startsWith('data-') || key === 'role' || key === 'list') node.setAttribute(key, value);
    else node[key] = value;
  }

  for (const child of [].concat(children)) {
    if (child == null) continue;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }

  return node;
}

function svgMarkup(name, size) {
  const body = ICON_PATHS[name] ?? ICON_PATHS.tag;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

/**
 * A bare inline icon (e.g. inside a button, next to text on the same
 * line). Always `aria-hidden` — never the only identifier for what it's
 * next to.
 * @param {keyof typeof ICON_PATHS} name
 * @param {{size?: number}} [options]
 */
function icon(name, { size = 16 } = {}) {
  const span = document.createElement('span');
  span.className = 'icon';
  span.setAttribute('aria-hidden', 'true');
  span.innerHTML = svgMarkup(name, size);
  return span;
}

/**
 * An icon inside a small tinted rounded chip — used for section-header
 * badges and leading icons on list rows. `color` is a CSS color value
 * (usually a `var(--color-...)` token); the chip's background is a soft
 * tint of that same color via `color-mix`, so adding a new tint never
 * requires a second token.
 * @param {keyof typeof ICON_PATHS} name
 * @param {{color?: string, small?: boolean}} [options]
 */
function iconChip(name, { color = 'var(--color-accent)', small = false } = {}) {
  const span = document.createElement('span');
  span.className = small ? 'icon-chip icon-chip--sm' : 'icon-chip';
  span.style.setProperty('--chip-color', color);
  span.setAttribute('aria-hidden', 'true');
  span.innerHTML = svgMarkup(name, small ? 15 : 18);
  return span;
}

/**
 * A small, square icon-only button (e.g. a row's Edit/Delete actions).
 * Unlike `icon()`, this is a real, focusable `<button>` — icon-only
 * controls must carry their own accessible name since there's no visible
 * text label next to them (docs/TEST-PLAN.md accessibility checklist),
 * so `label` is required, not optional, and becomes `aria-label`.
 * @param {keyof typeof ICON_PATHS} name
 * @param {string} label accessible name, e.g. "Edit Groceries"
 * @param {() => void} onClick
 * @param {{tone?: 'neutral'|'attention'}} [options]
 */
function iconButton(name, label, onClick, { tone = 'neutral' } = {}) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = `icon-btn${tone === 'attention' ? ' icon-btn--attention' : ''}`;
  button.setAttribute('aria-label', label);
  button.title = label;
  button.innerHTML = svgMarkup(name, 16);
  button.addEventListener('click', onClick);
  return button;
}

/**
 * A standard card header: a small icon chip beside an `<h2>`. Used in
 * place of a bare `el('h2', {id}, text)` everywhere a card wants the
 * section-header icon treatment.
 * @param {keyof typeof ICON_PATHS} name
 * @param {string} text
 * @param {string} [id] heading id, for `aria-labelledby` on the parent card
 * @param {{color?: string}} [options]
 */
function sectionHeading(name, text, id, { color } = {}) {
  const wrapper = document.createElement('div');
  wrapper.className = 'section-heading';
  wrapper.appendChild(iconChip(name, { color, small: true }));
  const heading = document.createElement('h2');
  if (id) heading.id = id;
  heading.textContent = text;
  wrapper.appendChild(heading);
  return wrapper;
}

// ---- src/ui/components/period-selector.js ----
// The header bar's global period selector — the single source of truth
// for every period-scoped card (This Period, Expenses). Deliberately NOT
// read by Safe-to-Spend or Current Balance, which are always "right now"
// snapshots (see docs/SAFE-TO-SPEND.md and src/ui/components/
// safe-to-spend-hero.js). The selected period itself is owned by
// src/ui/screens/dashboard.js (the one place that already threads shared
// values down to every card that needs them) and passed in here as a
// controlled `{period, from, to}` + `onChange` — this file only owns
// whether its own dropdown panel is open, which nothing else needs to
// know about.


const GLOBAL_PERIODS = ['week', 'month', 'lastMonth', 'all', 'custom'];
const PERIOD_LABEL = { week: 'This week', month: 'This month', lastMonth: 'Last month', all: 'All time', custom: 'Custom range' };

// Whether the dropdown panel is open — transient UI state, deliberately
// outside the store (see docs/ARCHITECTURE.md §4), same convention as
// every other popup/toggle in this app.
let panelOpen = false;

/**
 * @param {object} options
 * @param {{period: string, from: string|null, to: string|null}} options.value
 * @param {(next: {period: string, from: string|null, to: string|null}) => void} options.onChange
 * @param {() => void} [options.requestRender]
 */
function renderPeriodSelector({ value, onChange, requestRender }) {
  const toggle = iconButton('calendar', `Filter by period: ${PERIOD_LABEL[value.period] ?? 'This month'}`, () => {
    panelOpen = !panelOpen;
    requestRender?.();
  });
  toggle.classList.add('period-selector__toggle');

  const wrapper = el('div', { class: 'period-selector' }, [toggle]);
  if (!panelOpen) return wrapper;

  const close = () => {
    panelOpen = false;
    requestRender?.();
  };
  const choose = (period) => {
    onChange(period === 'custom' ? { period, from: value.from, to: value.to } : { period, from: null, to: null });
    if (period !== 'custom') close();
    else requestRender?.();
  };

  const options = el(
    'div',
    { class: 'period-selector__options', role: 'group', 'aria-label': 'Select a time period' },

          onclick: () => choose(period),

  // transparent full-page click-catcher behind an anchored panel, instead
  // of popup.js's centered dark backdrop) — closes on a click anywhere
  // outside the panel, or Escape, without a raw `document`-level listener

  wrapper.appendChild(scrim);
  return wrapper;
}

// ---- src/core/money.js ----
// Money utilities. Every monetary amount in this app is stored as a
// non-negative integer number of cents — never a float — so values users
// need to trust exactly are never subject to floating-point drift (e.g.
// 0.1 + 0.2 !== 0.3 in IEEE 754). See docs/DATA-MODEL.md.

/**
 * Parses a user-entered amount (string or number) into non-negative
 * integer cents. Accepts "2450", "2450.5", "2,450.00", "$1,200". Rejects
 * negative amounts, non-numeric input, and more than 2 fractional digits
 * (rather than silently rounding away precision the user typed).
 * @param {string|number} input
 * @returns {number|null} integer cents, or null if not a valid amount
 */
function parseAmountToCents(input) {
  if (typeof input === 'number') {
    if (!Number.isFinite(input) || input < 0) return null;
    return Math.round(input * 100);
  }
  if (typeof input !== 'string') return null;

  const trimmed = input.trim();
  if (trimmed === '') return null;

  // Strip currency symbols and thousands separators; keep digits/dot/minus
  // so a leading minus can still be detected and rejected explicitly below
  // (rather than silently stripped, which would turn "-5" into "5").
  const cleaned = trimmed.replace(/[^0-9.\-]/g, '');
  if (cleaned === '' || cleaned.startsWith('-')) return null;
  if (!/^\d+(\.\d+)?$/.test(cleaned)) return null;

  const [wholePart, fractionPart = ''] = cleaned.split('.');
  if (fractionPart.length > 2) return null;

  const wholeCents = BigInt(wholePart || '0') * 100n;
  const fractionCents = BigInt(fractionPart.padEnd(2, '0') || '0');
  const totalCents = wholeCents + fractionCents;

  if (totalCents > BigInt(Number.MAX_SAFE_INTEGER)) return null;
  return Number(totalCents);
}

/** @param {*} value @returns {boolean} true if a valid stored amount (non-negative integer cents) */
function isValidAmountCents(value) {
  return Number.isInteger(value) && value >= 0;
}

/**
 * Parses a user-entered balance (string or number) into integer cents,
 * same as parseAmountToCents but permitting a negative result. Only the
 * Current Balance figure uses this — see docs/DATA-MODEL.md "Current
 * Balance model": a balance can legitimately go negative (overdraft-style,
 * or simply having logged more spending than was on hand), and clamping
 * that to $0 would silently misrepresent the user's real position. Every
 * other amount in the app (bills, income, planned expenses, expenses,
 * savings) is a magnitude and must stay non-negative — use
 * parseAmountToCents for those.
 * @param {string|number} input
 * @returns {number|null}
 */
function parseBalanceToCents(input) {
  if (typeof input === 'number') {
    if (!Number.isFinite(input)) return null;
    return Math.round(input * 100);
  }
  if (typeof input !== 'string') return null;

  const trimmed = input.trim();
  if (trimmed === '') return null;

  const isNegative = trimmed.startsWith('-');
  const cleaned = trimmed.replace(/[^0-9.\-]/g, '').replace(/^-/, '');
  if (cleaned === '') return null;
  if (!/^\d+(\.\d+)?$/.test(cleaned)) return null;

  const [wholePart, fractionPart = ''] = cleaned.split('.');
  if (fractionPart.length > 2) return null;

  const wholeCents = BigInt(wholePart || '0') * 100n;
  const fractionCents = BigInt(fractionPart.padEnd(2, '0') || '0');
  const totalCents = wholeCents + fractionCents;

  if (totalCents > BigInt(Number.MAX_SAFE_INTEGER)) return null;
  const magnitude = Number(totalCents);
  return isNegative ? -magnitude : magnitude;
}

/** @param {*} value @returns {boolean} true if a valid stored balance (any-sign integer cents) */
function isValidBalanceCents(value) {
  return Number.isInteger(value);
}

/** @param {number} cents @returns {string} e.g. "$2,450.00" */
function formatCents(cents) {
  const safe = Number.isFinite(cents) ? cents : 0;
  const sign = safe < 0 ? '-' : '';
  const abs = Math.abs(Math.round(safe));
  const dollars = Math.floor(abs / 100);
  const remainder = abs % 100;
  return `${sign}$${dollars.toLocaleString('en-US')}.${String(remainder).padStart(2, '0')}`;
}

/** @param {number} cents @returns {number} plain dollars, e.g. for pre-filling a form input */
function centsToDollarString(cents) {
  return (cents / 100).toFixed(2);
}

// A "+ More options" progressive-disclosure wrapper (Phase 7 — "is the
// user being asked to make unnecessary decisions?"). Secondary fields
// stay out of the way for the common fast-capture case; editing an
// existing record starts expanded, since there's nothing to hide once
// values are already set.


const FOCUSABLE_TAGS = new Set(['INPUT', 'SELECT', 'TEXTAREA']);

/** Depth-first search for the first focusable field, so opening "+ More
 * options" (or a modal — see src/ui/components/popup.js) via
 * keyboard/click lands focus where the user is about to type next, instead
 * of leaving it stranded on the now-hidden/closed trigger. */
function focusFirstField(container) {
  for (const child of container.children ?? []) {
    if (FOCUSABLE_TAGS.has(child.tagName)) {
      child.focus?.();
      return true;
    }
    if (focusFirstField(child)) return true;
  }
  return false;
}

/**
 * @param {() => HTMLElement[]} buildFields called once per paint to build
 *   the secondary fields — a function, not a static array, so it can
 *   close over live input values if ever needed.
 * @param {{startExpanded?: boolean}} [options]
 * @returns {{ toggle: HTMLElement, details: HTMLElement }} append both to
 *   the form; `toggle` hides itself once expanded.
 */
function renderMoreOptions(buildFields, { startExpanded = false } = {}) {
  let expanded = startExpanded;
  const details = el('div', { class: 'money-form__details' });
  const toggle = el('button', { type: 'button', class: 'btn btn--secondary btn--small money-form__toggle' }, '+ More options');

  function paint() {
    details.innerHTML = '';
    if (expanded) {
      for (const field of buildFields()) details.appendChild(field);
      toggle.hidden = true;
      details.hidden = false;
    } else {
      toggle.hidden = false;
      details.hidden = true;
    }
  }

  toggle.onclick = () => {
    expanded = true;
    paint();
    focusFirstField(details);
  };
  paint();

  return { toggle, details };
}


// ---- src/core/id.js ----
// Client-side unique id generation. See docs/DATA-MODEL.md §7 — timestamp
// + random suffix is sufficient uniqueness for a single-user, single-device
// app; no UUID library dependency needed.
//
// A monotonic counter is layered on top of the timestamp so uniqueness is
// guaranteed even across many synchronous calls within the same
// millisecond, rather than relying on Math.random() alone to avoid
// collisions.

let lastTimestamp = 0;
let callsAtLastTimestamp = 0;

/**
 * @param {string} [prefix] Short entity-type prefix, e.g. 't' for Task,
 *   'g' for Goal. Omit for a bare id.
 * @returns {string}
 */
function createId(prefix = '') {
  const timestamp = Date.now();
  if (timestamp === lastTimestamp) {
    callsAtLastTimestamp += 1;
  } else {
    lastTimestamp = timestamp;
    callsAtLastTimestamp = 0;
  }

  const random = Math.random().toString(36).slice(2, 8);
  const sequence = callsAtLastTimestamp > 0 ? `-${callsAtLastTimestamp.toString(36)}` : '';
  const base = `${timestamp.toString(36)}${sequence}_${random}`;

  return prefix ? `${prefix}_${base}` : base;
}


// ---- src/core/date.js ----
// Shared date/time utilities — the single implementation of "what day is
// it" logic. See docs/ARCHITECTURE.md §6 (`/core/date.js`) and
// docs/DATA-MODEL.md §2 ("conversion to local time/day boundaries happens
// only at render/derivation time, via the shared date utility ... never
// scattered ad hoc across modules").
//
// All "local day" logic here is deliberately based on the runtime's local
// timezone (the browser's), not UTC — a date-only value like a Task's
// `dueAt` of "2026-08-21" means the 21st in the user's own day, not in UTC.

/** @param {Date} [date] @returns {string} local date as "YYYY-MM-DD" */
function getLocalDateKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

/** @param {Date} [date] @returns {Date} local midnight of the given date */
function startOfLocalDay(date = new Date()) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

/** @param {Date} a @param {Date} b @returns {boolean} */
function isSameLocalDay(a, b) {
  return getLocalDateKey(a) === getLocalDateKey(b);
}

/**
 * Parses an ISO date or datetime string as a local-time Date, avoiding the
 * common footgun where `new Date("YYYY-MM-DD")` is parsed as UTC midnight
 * (which can land on the *previous* local day in negative-UTC-offset
 * timezones). Date-only strings are parsed as local; full datetime strings
 * are passed through to the native parser, which already treats them as
 * local time per the ES spec when no timezone offset is present.
 *
 * @param {string} isoString
 * @returns {Date}
 */
function parseLocalDate(isoString) {
  const dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoString);
  if (dateOnly) {
    const [, year, month, day] = dateOnly;
    return new Date(Number(year), Number(month) - 1, Number(day));
  }
  return new Date(isoString);
}

/** @param {string} isoString @param {Date} [now] @returns {boolean} */
function isToday(isoString, now = new Date()) {
  return isSameLocalDay(parseLocalDate(isoString), now);
}

/**
 * A date is "overdue" if its local day is strictly before today's local
 * day — a due date of today is not yet overdue.
 * @param {string} isoString @param {Date} [now] @returns {boolean}
 */
function isOverdue(isoString, now = new Date()) {
  const due = startOfLocalDay(parseLocalDate(isoString));
  const today = startOfLocalDay(now);
  return due.getTime() < today.getTime();
}

/** @param {Date} [date] @returns {'morning'|'afternoon'|'evening'} */
function getGreetingPeriod(date = new Date()) {
  const hour = date.getHours();
  if (hour < 12) return 'morning';
  if (hour < 17) return 'afternoon';
  return 'evening';
}

/** @param {Date} [date] @returns {string} e.g. "Friday, August 21, 2026" */
function formatFriendlyDate(date = new Date()) {
  return new Intl.DateTimeFormat(undefined, {
    weekday: 'long',
    month: 'long',
    day: 'numeric',
    year: 'numeric',
  }).format(date);
}

/** @param {Date} date @param {number} n @returns {Date} `date` plus `n` local days */
function addDays(date, n) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
}

/**
 * `date` plus `n` calendar months, clamped to the last day of the target
 * month if the original day-of-month doesn't exist there (e.g. Jan 31 + 1
 * month -> Feb 28, not "March 3" from naive overflow).
 * @param {Date} date @param {number} n @returns {Date}
 */
function addMonths(date, n) {
  const targetMonth = date.getMonth() + n;
  const candidate = new Date(date.getFullYear(), targetMonth, date.getDate());
  const normalizedTargetMonth = ((targetMonth % 12) + 12) % 12;
  if (candidate.getMonth() !== normalizedTargetMonth) {
    return new Date(date.getFullYear(), targetMonth + 1, 0); // day 0 = last day of the intended month
  }
  return candidate;
}

/** @param {Date} from @param {Date} to @returns {number} whole local days from `from` to `to` (negative if `to` is earlier) */
function daysBetween(from, to) {
  const a = startOfLocalDay(from);
  const b = startOfLocalDay(to);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

/** @param {Date} date @returns {Date} local midnight of the 1st of `date`'s month */
function startOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

/** @param {Date} date @returns {Date} local midnight of the last day of `date`'s month */
function endOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth() + 1, 0); // day 0 = last day of the current month
}

/**
 * Monday of the calendar week containing `date` (ISO-style week start —
 * this app has no other week-start convention to be consistent with).
 * @param {Date} date @returns {Date} local midnight of that Monday
 */
function startOfWeek(date) {
  const day = date.getDay(); // 0 = Sunday ... 6 = Saturday
  const offsetFromMonday = day === 0 ? 6 : day - 1;
  return addDays(startOfLocalDay(date), -offsetFromMonday);
}

/**
 * `date` advanced by exactly one cycle of `frequency` — a single
 * unconditional step, unlike src/modules/safe-to-spend/recurrence.js's
 * `rollForwardRecurring` (which steps repeatedly until reaching "today").
 * Used where something needs "the next occurrence after this one," not
 * "the current occurrence as of now" — e.g. advancing a recurring
 * Income's `nextDate` the moment it's confirmed received (src/modules/
 * incomes/reducer.js). Lives here (not safe-to-spend/) since it's a
 * generic date-math primitive, not Safe-to-Spend-specific logic.
 * @param {Date} date
 * @param {'one-time'|'weekly'|'biweekly'|'monthly'} frequency
 * @returns {Date} `date` unchanged for 'one-time' or an unrecognized frequency
 */
function advanceByFrequency(date, frequency) {
  if (frequency === 'weekly') return addDays(date, 7);
  if (frequency === 'biweekly') return addDays(date, 14);
  if (frequency === 'monthly') return addMonths(date, 1);
  return date;
}

}

/**
 * Every category currently "in play" — the default suggestions plus any
 * category actually used by a logged Expense or an existing Category
 * Budget, deduplicated and alphabetized. Category stays free text
 * everywhere (docs/DATA-MODEL.md — no locked enum), so this isn't a
 * source of truth to validate against, just the shared `<datalist>`
 * suggestion list for both the Expense form's category field (this
 * module) and the Category Budget form's category field
 * (src/modules/category-budgets/) — one function so introducing a new
 * category from *either* form makes it "known" to both from then on,
 * without a separate persisted category list. Reads `state.categoryBudgets`
 * directly as raw data (not through category-budgets/index.js) — the same
 * "read another slice's raw data for a simple read-only aggregate"
 * precedent already used by category-budgets/selectors.js reading
 * `state.expenses`, so neither module formally depends on the other.
 * @param {object} state
 * @returns {string[]}
 */
function getKnownCategories(state) {
  const categories = new Set(DEFAULT_EXPENSE_CATEGORIES);
  const expenses = getAllExpenses(state);
  for (const expense of Array.isArray(expenses) ? expenses : []) {
    if (expense?.category) categories.add(expense.category);
  }
  for (const budget of Array.isArray(state?.categoryBudgets) ? state.categoryBudgets : []) {
    if (budget?.category) categories.add(budget.category);
  }
  return [...categories].sort((a, b) => a.localeCompare(b));
}

function sortByDateDesc(expenses) {
  return expenses.slice().sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return a.createdAt < b.createdAt ? 1 : -1;
  });
}

/** Most recent expenses first (by date, then createdAt as a tiebreak) — a short list, not a ledger. */
function getRecentExpenses(state, { limit = 5 } = {}) {
  return sortByDateDesc(getAllExpenses(state)).slice(0, limit);
}

// The period filter (Recent Expenses section): lets the user look at a
// specific stretch of past spending instead of only "the last few". This
// is a read-only lens over Expenses — it doesn't change what's stored,
// doesn't touch Safe-to-Spend, and follows the same "derived, not stored"
// principle as Category Budgets' monthly figures (src/modules/
// category-budgets/selectors.js) and Safe-to-Spend itself.
const EXPENSE_PERIODS = ['recent', 'week', 'month', 'lastMonth', 'all', 'custom'];

/**
 * Resolves a period id into inclusive `[startDateKey, endDateKey]` bounds
 * ("YYYY-MM-DD" strings, directly comparable against `Expense.date`), or
 * `null` for periods with no bound on one or both ends ('recent', 'all',
 * or a 'custom' range missing both `from`/`to`).
 * @param {string} period one of EXPENSE_PERIODS
 * @param {{now?: Date, from?: string|null, to?: string|null}} [options]
 * @returns {{startDateKey: string|null, endDateKey: string|null}|null}
 */
function resolvePeriodRange(period, { now = new Date(), from = null, to = null } = {}) {
  if (period === 'week') {
    const start = startOfWeek(now);
    return { startDateKey: getLocalDateKey(start), endDateKey: getLocalDateKey(addDays(start, 6)) };
  }
  if (period === 'month') {
    return { startDateKey: getLocalDateKey(startOfMonth(now)), endDateKey: getLocalDateKey(endOfMonth(now)) };
  }
  if (period === 'lastMonth') {
    const lastMonth = addMonths(now, -1);
    return { startDateKey: getLocalDateKey(startOfMonth(lastMonth)), endDateKey: getLocalDateKey(endOfMonth(lastMonth)) };
  }
  if (period === 'custom') {
    if (!from && !to) return null;
    return { startDateKey: from || null, endDateKey: to || null };
  }
  return null; // 'recent' and 'all' — no date bound, only 'recent' additionally caps by count
}

/**
 * Expenses within a chosen period, most recent first. 'recent' and 'all'
 * are both unbounded by date — 'recent' additionally caps to `limit`
 * (the existing default-glance behavior); every other period returns
 * every matching expense, uncapped, since the user asked to look at that
 * specific stretch of time.
 * @param {object} state
 * @param {{period?: string, now?: Date, from?: string|null, to?: string|null, limit?: number}} [options]
 */
function getExpensesForPeriod(state, { period = 'recent', now = new Date(), from = null, to = null, limit = 10 } = {}) {
  const sorted = sortByDateDesc(getAllExpenses(state));
  const range = resolvePeriodRange(period, { now, from, to });
  const filtered = range
    ? sorted.filter((expense) => {
        if (!expense?.date) return false;
        if (range.startDateKey && expense.date < range.startDateKey) return false;
        if (range.endDateKey && expense.date > range.endDateKey) return false;
        return true;
      })
    : sorted;
  return period === 'recent' ? filtered.slice(0, limit) : filtered;
}

/**
 * Sum of a list of expenses' amounts, skipping any with a corrupted/
 * invalid `amountCents` rather than letting one bad value NaN-poison the
 * total (same defensive pattern as src/modules/category-budgets/
 * selectors.js and src/modules/safe-to-spend/calculation.js).
 * @param {Array<{amountCents: number}>} expenses
 */
function getExpensesTotalCents(expenses) {
  let totalCents = 0;
  for (const expense of Array.isArray(expenses) ? expenses : []) {
    if (!expense || !isValidAmountCents(expense.amountCents)) continue;
    totalCents += expense.amountCents;
  }
  return totalCents;
}


// ---- src/core/list-entity.js ----
// A small factory for the common "flat list of id-keyed entities with
// create/update/delete/toggle" reducer shape shared by several budget
// modules (Income, Bills, Planned Expenses). Not product-specific — lives
// in /core because it's generic reducer-building logic, same spirit as
// src/core/store.js. See docs/ARCHITECTURE.md §4 (reducers must return the
// same array reference for a no-op) and §7 (module boundaries).

/**
 * @param {object} options
 * @param {string} options.actionPrefix e.g. 'incomes' — actions are
 *   `${actionPrefix}/create|update|delete|toggle`.
 * @param {string} options.entityKey the property on the create action
 *   holding the candidate entity, e.g. 'income'.
 * @param {(candidate: object) => object|null} options.validateNew returns
 *   a cleaned entity to accept, or null to reject (reducer no-op).
 * @param {(changes: object) => object} options.sanitizeChanges whitelists/
 *   validates an update action's `changes`, dropping anything invalid.
 */
function createListReducer({ actionPrefix, entityKey, validateNew, sanitizeChanges }) {
  return function listReducer(items = [], action) {
    switch (action.type) {
      case `${actionPrefix}/create`: {
        const entity = validateNew(action[entityKey]);
        if (!entity) return items;
        return [...items, entity];
      }

      case `${actionPrefix}/update`: {
        const index = items.findIndex((item) => item.id === action.id);
        if (index === -1) return items;
        const changes = sanitizeChanges(action.changes);
        if (Object.keys(changes).length === 0) return items;
        const next = items.slice();
        next[index] = { ...items[index], ...changes, updatedAt: action.now };
        return next;
      }

      case `${actionPrefix}/delete`: {
        const index = items.findIndex((item) => item.id === action.id);
        if (index === -1) return items;
        return items.filter((item) => item.id !== action.id);
      }

      case `${actionPrefix}/toggle`: {
        const index = items.findIndex((item) => item.id === action.id);
        if (index === -1) return items;
        const current = items[index];
        const next = items.slice();
        next[index] = { ...current, [action.field]: !current[action.field], updatedAt: action.now };
        return next;
      }

      default:
        return items;
    }
  };
}


// ---- src/modules/expenses/reducer.js ----

const EDITABLE_FIELDS = ['amountCents', 'description', 'date', 'category', 'notes'];

function validateNewExpense(candidate) {
  if (!candidate) return null;
  if (!isValidAmountCents(candidate.amountCents)) return null;
  return candidate;
}

function sanitizeExpenseChanges(changes = {}) {
  const sanitized = {};
  for (const field of EDITABLE_FIELDS) {
    if (field in changes) sanitized[field] = changes[field];
  }
  if ('amountCents' in sanitized && !isValidAmountCents(sanitized.amountCents)) {
    delete sanitized.amountCents;
  }
  return sanitized;
}

// Note: this reducer only manages the `expenses` array itself. The
// consequence of an expense on Current Balance (docs/DATA-MODEL.md
// "Current Balance model") is a *cross-slice* effect computed by
// balance-effect.js and applied by src/main.js's rootReducer, which has
// visibility into both slices — this reducer deliberately doesn't know
// budget exists, keeping module boundaries clean (docs/ARCHITECTURE.md §7).
const expensesReducer = createListReducer({
  actionPrefix: 'expenses',
  entityKey: 'expense',
  validateNew: validateNewExpense,
  sanitizeChanges: sanitizeExpenseChanges,
});


// ---- src/modules/expenses/balance-effect.js ----
// How logging/editing/deleting an Expense affects the Current Balance
// checkpoint. See docs/DATA-MODEL.md "Current Balance model" for the full
// reasoning: the balance is a checkpoint the user can correct at any
// time, automatically adjusted by expense transactions in between.
//
// This file only decides *how much* the balance should change — it
// returns a signed delta, never mutates state itself. src/main.js's
// rootReducer applies that delta to `budget.currentBalanceCents`
// atomically, in the same state transition as the `expenses` slice
// update (so the two never drift out of sync, and the store's
// subscribers see one consistent state, not two separate updates).


/**
 * @param {{type: string, id?: string}} action
 * @param {Array} prevExpenses the `expenses` slice before this action
 * @param {Array} nextExpenses the `expenses` slice after this action
 * @returns {number} signed cents to add to currentBalanceCents (negative = spent)
 */
function computeBalanceDelta(action, prevExpenses, nextExpenses) {
  if (nextExpenses === prevExpenses) return 0; // the expenses reducer no-op'd — nothing to apply

  if (action.type === 'expenses/create') {
    // createListReducer appends; the new expense is always the last item.
    const added = nextExpenses[nextExpenses.length - 1];
    return added && isValidAmountCents(added.amountCents) ? -added.amountCents : 0;
  }

  if (action.type === 'expenses/delete') {
    const removed = prevExpenses.find((expense) => expense.id === action.id);
    // Refund what was previously deducted — but only if that figure is
    // actually a valid amount. A corrupted stored expense (bad amountCents
    // from hand-edited/pre-validation localStorage data) contributes 0
    // rather than NaN-poisoning currentBalanceCents; the reducer already
    // guarantees this can't happen for anything created/edited through the
    // app itself (src/modules/expenses/reducer.js).
    return removed && isValidAmountCents(removed.amountCents) ? removed.amountCents : 0;
  }

  if (action.type === 'expenses/update') {
    const before = prevExpenses.find((expense) => expense.id === action.id);
    const after = nextExpenses.find((expense) => expense.id === action.id);
    if (!before || !after) return 0;
    const beforeCents = isValidAmountCents(before.amountCents) ? before.amountCents : 0;
    const afterCents = isValidAmountCents(after.amountCents) ? after.amountCents : 0;
    // Spent more than before -> further deduct the increase.
    // Spent less than before -> refund the decrease.
    return beforeCents - afterCents;
  }

  return 0;
}

// edit/delete — not a full accounting ledger. Categories have sensible
// defaults but are freely editable via a <datalist>, not a locked enum.


// Which expense row (if any) is being edited inline — transient UI state,

let editingExpenseId = null;

/**
 * @param {string|null|undefined} value
 * @param {string[]} knownCategories datalist suggestions — every category
 *   currently "in play" (see getKnownCategories), not a locked list; the
 *   field stays free text, so typing anything else introduces a new
 *   category, known everywhere from then on.
 * @returns {HTMLLabelElement} with `.categoryInput` set to the nested <input>
 */
function categoryField(value, knownCategories) {
  const input = el('input', { type: 'text', name: 'category', class: 'field__input', list: 'expense-categories', value: value || '', placeholder: 'Optional' });
  const datalist = el(
    'datalist',

  );
